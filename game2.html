<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>マージパズル | すいか風合体ゲーム</title>

  <!-- 物理演算エンジン Matter.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background-color: #1e293b;
      background-image: linear-gradient(rgba(30, 41, 59, 0.85), rgba(30, 41, 59, 0.85)), url("images/kibana.png");
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 6px 12px;
      padding-top: calc(4px + env(safe-area-inset-top));
      padding-bottom: calc(4px + env(safe-area-inset-bottom));
    }

    .container {
      width: 100%;
      max-width: 360px;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 4px;
      justify-content: flex-start;
    }

    /* ヘッダー */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .back-btn {
      color: #ffffff;
      text-decoration: none;
      font-size: 11px;
      font-weight: bold;
      background: rgba(0, 0, 0, 0.4);
      padding: 2px 8px;
      border-radius: 20px;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    /* スコアボード */
    .score-board {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(8px);
      border-radius: 10px;
      padding: 3px 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid rgba(255, 255, 255, 0.2);
      flex-shrink: 0;
    }
    .score-item { text-align: center; }
    .score-item span { display: block; font-size: 8px; color: #cbd5e1; }
    .score-item strong { font-size: 14px; color: #f59e0b; }

    .next-preview {
      display: flex;
      align-items: center;
      gap: 4px;
      background: rgba(0, 0, 0, 0.3);
      padding: 2px 6px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .next-preview span { font-size: 8px; color: #94a3b8; font-weight: bold; }
    .next-bubble-box {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      border: 1.2px solid rgba(255, 255, 255, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 5px rgba(255, 255, 255, 0.4);
    }
    .next-img { width: 16px; height: 16px; object-fit: contain; }

    /* セリフエリア */
    .voice-bubble {
      background: rgba(15, 23, 42, 0.75);
      border-left: 3px solid #FFA500;
      padding: 2px 6px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: bold;
      color: #f8fafc;
      min-height: 20px;
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }

    /* シャボン玉の進化順サンプルバー */
    .evolution-chart {
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(6px);
      border-radius: 10px;
      padding: 4px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid rgba(255, 255, 255, 0.2);
      flex-shrink: 0;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .evolution-chart::-webkit-scrollbar { display: none; }

    .evo-item {
      display: flex;
      align-items: center;
      gap: 3px;
      flex-shrink: 0;
    }
    .evo-bubble {
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 4px rgba(255, 255, 255, 0.3);
    }
    .evo-bubble img {
      width: 80%;
      height: 80%;
      object-fit: contain;
    }
    .evo-arrow {
      font-size: 8px;
      color: rgba(255, 255, 255, 0.5);
      font-weight: bold;
    }

    /* ゲームコンテナ */
    .game-stage {
      height: 56vh;
      height: 56dvh;
      max-height: 440px;
      background-color: #FFA500;
      background-image: linear-gradient(180deg, rgba(255, 255, 255, 0.25) 0%, rgba(0, 0, 0, 0.1) 100%);
      border-radius: 14px;
      position: relative;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.6);
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.2), 0 4px 14px rgba(0, 0, 0, 0.3);
      touch-action: none;
      flex-shrink: 0;
    }

    /* 危険ライン */
    .danger-line {
      position: absolute;
      top: 45px;
      left: 0;
      right: 0;
      height: 2px;
      background: repeating-linear-gradient(90deg, #ef4444, #ef4444 8px, transparent 8px, transparent 16px);
      z-index: 5;
      opacity: 0.85;
      pointer-events: none;
    }

    /* ドロップガイド */
    .drop-guide {
      position: absolute;
      top: 6px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.7) 0%, rgba(255,255,255,0.2) 60%, rgba(255,165,0,0.5) 100%);
      border: 1.5px solid rgba(255, 255, 255, 0.95);
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.6);
      transform: translateX(-50%);
      pointer-events: none;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .drop-guide img { width: 80%; height: 80%; object-fit: contain; }

    /* DOMシャボン玉要素 */
    .bubble-dom {
      position: absolute;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 6;
      border: 2px solid rgba(255, 255, 255, 0.95);
      box-shadow: inset 0 0 8px rgba(255, 255, 255, 0.6), 0 3px 8px rgba(0, 0, 0, 0.15);
      will-change: transform;
    }
    .bubble-pop-anim {
      animation: bubblePop 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    @keyframes bubblePop {
      0% { transform: scale(0.65); }
      50% { transform: scale(1.18); }
      100% { transform: scale(1); }
    }
    .bubble-dom::after {
      content: "";
      position: absolute;
      top: 12%;
      left: 15%;
      width: 22%;
      height: 22%;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.75);
      pointer-events: none;
    }
    .bubble-img {
      width: 84%;
      height: 84%;
      object-fit: contain;
      pointer-events: none;
      transform-origin: center center;
    }

    /* 下部操作パネル */
    .control-panel {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      touch-action: none;
      cursor: grab;
    }
    .control-panel:active {
      cursor: grabbing;
      background: rgba(255, 255, 255, 0.22);
    }
    .control-guide-txt {
      font-size: 10px;
      font-weight: bold;
      color: #cbd5e1;
      letter-spacing: 0.5px;
    }
    .control-track {
      width: 100%;
      height: 5px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 3px;
      position: relative;
    }
    .control-knob {
      width: 20px;
      height: 10px;
      background: #FFA500;
      border-radius: 5px;
      position: absolute;
      top: -2.5px;
      left: 50%;
      transform: translateX(-50%);
      box-shadow: 0 0 5px rgba(255, 165, 0, 0.8);
      border: 1px solid #fff;
    }

    /* パーティクル */
    .sparkle-particle {
      position: absolute;
      pointer-events: none;
      border-radius: 50%;
      z-index: 20;
      animation: particleFly 0.45s forwards ease-out;
    }
    @keyframes particleFly {
      0% { transform: translate(0, 0) scale(1); opacity: 1; }
      100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
    }

    /* リザルト画面 */
    .overlay-screen {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px;
      text-align: center;
      z-index: 30;
    }
    .overlay-screen h2 { font-size: 20px; color: #FFA500; }
    .overlay-screen p { font-size: 11px; color: #cbd5e1; line-height: 1.4; }

    .btn-action {
      background: linear-gradient(135deg, #FFA500, #ea580c);
      color: #ffffff;
      border: none;
      font-size: 13px;
      font-weight: bold;
      padding: 6px 20px;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(255, 165, 0, 0.4);
      margin-top: 4px;
    }
    .btn-action:active { transform: scale(0.94); }
  </style>
</head>
<body>

  <div class="container">
    
    <div class="top-bar">
      <a href="index.html" class="back-btn">◀ 戻る</a>
      <span style="font-size: 10px; color: #cbd5e1;">MERGE PUZZLE</span>
    </div>

    <div class="score-board">
      <div class="score-item">
        <span>🔥 スコア</span>
        <strong id="score-val">0</strong>
      </div>
      <div class="next-preview">
        <span>NEXT ➔</span>
        <div class="next-bubble-box">
          <img id="next-img" class="next-img" src="images/merge1.png" alt="">
        </div>
      </div>
      <div class="score-item">
        <span>👑 ベスト</span>
        <strong id="best-score-val">0</strong>
      </div>
    </div>

    <div class="voice-bubble" id="voice-msg">
      「シャボン玉同士をぶつけて、でっかく進化させろよ！」
    </div>

    <!-- 進化順（サイズ順）サンプルバー -->
    <div class="evolution-chart" id="evo-chart">
      <!-- JavaScriptでLv.1〜8のシャボン玉を自動配置 -->
    </div>

    <!-- ゲームステージ -->
    <div class="game-stage" id="stage">
      <div class="danger-line"></div>
      
      <div class="drop-guide" id="drop-guide">
        <img id="guide-img" src="images/merge1.png" alt="">
      </div>

      <div id="bubble-container" style="position: absolute; inset: 0; pointer-events: none;"></div>

      <div class="overlay-screen" id="overlay" style="display: none;">
        <h2 id="overlay-title">ゲームオーバー</h2>
        <p id="overlay-desc">箱から溢れちまったな！<br>もう一回挑戦するか？</p>
        <button class="btn-action" onclick="restartGame()">もう一度遊ぶ</button>
      </div>

    </div>

    <!-- 下部専用操作パネル -->
    <div class="control-panel" id="control-panel">
      <span class="control-guide-txt">◀ スライドして狙いを定めて離す ▶</span>
      <div class="control-track">
        <div class="control-knob" id="control-knob"></div>
      </div>
    </div>

  </div>

  <script>
    const FRUITS = [
      { level: 0, bubbleRadius: 18, score: 2,   bubbleColor: 'radial-gradient(circle at 35% 35%, rgba(255,255,255,0.7) 0%, rgba(56,189,248,0.5) 60%, rgba(2,132,199,0.7) 100%)', img: 'images/merge1.png' },
      { level: 1, bubbleRadius: 25, score: 4,   bubbleColor: 'radial-gradient(circle at 35% 35%, rgba(255,255,255,0.7) 0%, rgba(168,85,247,0.5) 60%, rgba(126,34,206,0.7) 100%)', img: 'images/merge2.png' },
      { level: 2, bubbleRadius: 33, score: 8,   bubbleColor: 'radial-gradient(circle at 35% 35%, rgba(255,255,255,0.7) 0%, rgba(236,72,153,0.5) 60%, rgba(190,24,93,0.7) 100%)',  img: 'images/merge3.png' },
      { level: 3, bubbleRadius: 44, score: 16,  bubbleColor: 'radial-gradient(circle at 35% 35%, rgba(255,255,255,0.7) 0%, rgba(245,158,11,0.5) 60%, rgba(180,83,9,0.7) 100%)',   img: 'images/merge4.png' },
      { level: 4, bubbleRadius: 56, score: 32,  bubbleColor: 'radial-gradient(circle at 35% 35%, rgba(255,255,255,0.7) 0%, rgba(34,197,94,0.5) 60%, rgba(21,128,61,0.7) 100%)',   img: 'images/merge5.png' },
      { level: 5, bubbleRadius: 70, score: 64,  bubbleColor: 'radial-gradient(circle at 35% 35%, rgba(255,255,255,0.7) 0%, rgba(239,68,68,0.5) 60%, rgba(185,28,28,0.7) 100%)',   img: 'images/merge6.png' },
      { level: 6, bubbleRadius: 86, score: 128, bubbleColor: 'radial-gradient(circle at 35% 35%, rgba(255,255,255,0.7) 0%, rgba(14,165,233,0.5) 60%, rgba(3,105,161,0.7) 100%)', img: 'images/merge7.png' },
      { level: 7, bubbleRadius: 105, score: 256, bubbleColor: 'radial-gradient(circle at 35% 35%, rgba(255,255,255,0.8) 0%, rgba(234,179,8,0.6) 60%, rgba(161,98,7,0.8) 100%)',  img: 'images/merge8.png' }
    ];

    let score = 0;
    let currentFruitIndex = 0;
    let nextFruitIndex = 0;
    let canDrop = true;
    let isGameOver = false;

    const stageEl = document.getElementById('stage');
    const bubbleContainer = document.getElementById('bubble-container');
    const controlPanel = document.getElementById('control-panel');
    const controlKnob = document.getElementById('control-knob');
    const guideEl = document.getElementById('drop-guide');
    const guideImg = document.getElementById('guide-img');
    const nextImg = document.getElementById('next-img');
    const voiceEl = document.getElementById('voice-msg');

    const quotes = {
      start: "「シャボン玉同士をぶつけて、でっかく進化させろよ！」",
      merge3: "「いい感じに育ってきたじゃねえか！」",
      merge6: "「すげえ！あと少しで最大進化だぜ！」",
      max: "「やったな！！最高ランク達成だぜ、最高だ！」",
      overLow: "「おっと、溢れちまったか！次はもっといけんだろ？」",
      overHigh: "「マジかよ！そこまでデカく育てたのすげえな！」"
    };

    function getBestScore() {
      return parseInt(localStorage.getItem('my_merge_best') || '0');
    }
    document.getElementById('best-score-val').textContent = getBestScore();

    // 進化チャートの自動生成
    function buildEvolutionChart() {
      const chartEl = document.getElementById('evo-chart');
      chartEl.innerHTML = '';

      FRUITS.forEach((f, i) => {
        const item = document.createElement('div');
        item.className = 'evo-item';

        // プレビューサイズ（Lv.1の16pxからLv.8の32pxまで段階的に拡大）
        const previewSize = 15 + (i * 2.3);

        const bubble = document.createElement('div');
        bubble.className = 'evo-bubble';
        bubble.style.width = previewSize + 'px';
        bubble.style.height = previewSize + 'px';
        bubble.style.background = f.bubbleColor;

        const img = document.createElement('img');
        img.src = f.img;
        bubble.appendChild(img);

        item.appendChild(bubble);

        if (i < FRUITS.length - 1) {
          const arrow = document.createElement('span');
          arrow.className = 'evo-arrow';
          arrow.textContent = '›';
          item.appendChild(arrow);
        }

        chartEl.appendChild(item);
      });
    }

    const { Engine, Runner, Bodies, Composite, Events, Body } = Matter;
    let engine, runner;

    function initPhysics() {
      const width = stageEl.clientWidth;
      const height = stageEl.clientHeight;

      engine = Engine.create({ 
        gravity: { x: 0, y: 1.5 },
        positionIterations: 12,
        velocityIterations: 12
      });

      const wallThickness = 120;
      const ground = Bodies.rectangle(width / 2, height + wallThickness / 2, width * 2, wallThickness, { isStatic: true, friction: 0.15 });
      const ceiling = Bodies.rectangle(width / 2, -wallThickness / 2, width * 2, wallThickness, { isStatic: true });
      const leftWall = Bodies.rectangle(-wallThickness / 2, height / 2, wallThickness, height * 2, { isStatic: true, friction: 0.05 });
      const rightWall = Bodies.rectangle(width + wallThickness / 2, height / 2, wallThickness, height * 2, { isStatic: true, friction: 0.05 });

      Composite.add(engine.world, [ground, ceiling, leftWall, rightWall]);

      runner = Runner.create();
      Runner.run(runner, engine);

      Events.on(engine, 'afterUpdate', () => {
        const bodies = Composite.allBodies(engine.world);

        bodies.forEach(body => {
          if (body.domElement) {
            const { x, y } = body.position;
            const r = body.circleRadius;
            body.domElement.style.transform = `translate3d(${x - r}px, ${y - r}px, 0)`;
            if (body.domImg) {
              body.domImg.style.transform = `rotate(${body.angle}rad)`;
            }
          }
        });
      });

      // 衝突合体判定
      Events.on(engine, 'collisionStart', (e) => {
        e.pairs.forEach(pair => {
          const { bodyA, bodyB } = pair;
          if (bodyA.fruitLevel !== undefined && bodyB.fruitLevel !== undefined) {
            if (bodyA.fruitLevel === bodyB.fruitLevel && !bodyA.isMerged && !bodyB.isMerged) {
              bodyA.isMerged = true;
              bodyB.isMerged = true;
              mergeFruits(bodyA, bodyB);
            }
          }
        });
      });
    }

    function dropFruit(x) {
      if (!canDrop || isGameOver) return;
      canDrop = false;

      const fruitData = FRUITS[currentFruitIndex];
      const minX = fruitData.bubbleRadius + 6;
      const maxX = stageEl.clientWidth - fruitData.bubbleRadius - 6;
      const dropX = Math.max(minX, Math.min(maxX, x));

      createFruitBody(dropX, 25, currentFruitIndex, false);

      guideEl.style.display = 'none';

      setTimeout(() => {
        prepareNextFruit();
        guideEl.style.display = 'flex';
        canDrop = true;
      }, 500);
    }

    function createFruitBody(x, y, level, isMerged = false) {
      const data = FRUITS[level];
      const r = data.bubbleRadius;

      const dom = document.createElement('div');
      dom.className = 'bubble-dom' + (isMerged ? ' bubble-pop-anim' : '');
      dom.style.width = (r * 2) + 'px';
      dom.style.height = (r * 2) + 'px';
      dom.style.background = data.bubbleColor;

      const img = document.createElement('img');
      img.className = 'bubble-img';
      img.src = data.img;
      dom.appendChild(img);

      bubbleContainer.appendChild(dom);

      const body = Bodies.circle(x, y, r, {
        restitution: 0.12,
        friction: 0.02,
        frictionStatic: 0.05,
        frictionAir: 0.003,
        density: 0.002,
        fruitLevel: level
      });

      body.domElement = dom;
      body.domImg = img;

      Composite.add(engine.world, body);
      return body;
    }

    function mergeFruits(bodyA, bodyB) {
      const nextLevel = bodyA.fruitLevel + 1;
      const newX = (bodyA.position.x + bodyB.position.x) / 2;
      const newY = (bodyA.position.y + bodyB.position.y) / 2;

      if (bodyA.domElement && bodyA.domElement.parentNode) bodyA.domElement.parentNode.removeChild(bodyA.domElement);
      if (bodyB.domElement && bodyB.domElement.parentNode) bodyB.domElement.parentNode.removeChild(bodyB.domElement);

      Composite.remove(engine.world, [bodyA, bodyB]);

      score += FRUITS[bodyA.fruitLevel].score * 2;
      document.getElementById('score-val').textContent = score;

      createSparkles(newX, newY);

      if (nextLevel < FRUITS.length) {
        const newBody = createFruitBody(newX, newY, nextLevel, true);
        Body.setVelocity(newBody, { x: 0, y: 0.3 });

        if (nextLevel === 3) voiceEl.textContent = quotes.merge3;
        if (nextLevel === 6) voiceEl.textContent = quotes.merge6;
        if (nextLevel === 7) voiceEl.textContent = quotes.max;
      }
    }

    function prepareNextFruit() {
      currentFruitIndex = nextFruitIndex;
      nextFruitIndex = Math.floor(Math.random() * 3);

      const cur = FRUITS[currentFruitIndex];
      guideImg.src = cur.img;
      guideEl.style.width = (cur.bubbleRadius * 2) + 'px';
      guideEl.style.height = (cur.bubbleRadius * 2) + 'px';

      nextImg.src = FRUITS[nextFruitIndex].img;
    }

    function handleAim(clientX) {
      if (!canDrop || isGameOver) return;
      const rect = stageEl.getBoundingClientRect();
      let x = clientX - rect.left;
      x = Math.max(20, Math.min(rect.width - 20, x));
      guideEl.style.left = x + 'px';

      const ratio = (x / rect.width) * 100;
      controlKnob.style.left = ratio + '%';
    }

    function handleDrop(clientX) {
      if (!canDrop || isGameOver) return;
      const rect = stageEl.getBoundingClientRect();
      const x = clientX - rect.left;
      dropFruit(x);
    }

    stageEl.addEventListener('pointermove', (e) => handleAim(e.clientX));
    stageEl.addEventListener('pointerup', (e) => handleDrop(e.clientX));

    controlPanel.addEventListener('pointermove', (e) => handleAim(e.clientX));
    controlPanel.addEventListener('pointerup', (e) => handleDrop(e.clientX));

    // 溢れ判定
    setInterval(() => {
      if (isGameOver) return;
      const bodies = Composite.allBodies(engine.world);
      for (let b of bodies) {
        if (b.fruitLevel !== undefined && b.position.y < 45 && Math.abs(b.velocity.y) < 0.15 && Math.abs(b.velocity.x) < 0.15) {
          triggerGameOver();
          break;
        }
      }
    }, 1000);

    function triggerGameOver() {
      isGameOver = true;
      let best = getBestScore();
      if (score > best) {
        best = score;
        localStorage.setItem('my_merge_best', best);
        document.getElementById('best-score-val').textContent = best;
      }

      document.getElementById('overlay-desc').innerHTML = `スコア: <strong style="font-size:22px; color:#FFA500;">${score}</strong> 点！<br>${score >= 500 ? quotes.overHigh : quotes.overLow}`;
      document.getElementById('overlay').style.display = 'flex';
    }

    function restartGame() {
      document.getElementById('overlay').style.display = 'none';
      bubbleContainer.innerHTML = '';
      Composite.clear(engine.world, false, true);
      initPhysicsWalls();
      score = 0;
      document.getElementById('score-val').textContent = 0;
      isGameOver = false;
      canDrop = true;
      voiceEl.textContent = quotes.start;
      prepareNextFruit();
      guideEl.style.display = 'flex';
    }

    function initPhysicsWalls() {
      const width = stageEl.clientWidth;
      const height = stageEl.clientHeight;
      const wallThickness = 120;
      const ground = Bodies.rectangle(width / 2, height + wallThickness / 2, width * 2, wallThickness, { isStatic: true, friction: 0.15 });
      const ceiling = Bodies.rectangle(width / 2, -wallThickness / 2, width * 2, wallThickness, { isStatic: true });
      const leftWall = Bodies.rectangle(-wallThickness / 2, height / 2, wallThickness, height * 2, { isStatic: true, friction: 0.05 });
      const rightWall = Bodies.rectangle(width + wallThickness / 2, height / 2, wallThickness, height * 2, { isStatic: true, friction: 0.05 });
      Composite.add(engine.world, [ground, ceiling, leftWall, rightWall]);
    }

    function createSparkles(x, y) {
      const colors = ['#FFA500', '#ffffff', '#38bdf8', '#a855f7', '#fbbf24', '#ff4d4f'];
      for (let i = 0; i < 8; i++) {
        const p = document.createElement('div');
        p.className = 'sparkle-particle';
        const size = Math.floor(Math.random() * 8) + 6;
        p.style.width = size + 'px';
        p.style.height = size + 'px';
        p.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        const angle = (Math.PI * 2 / 8) * i + (Math.random() - 0.5);
        const distance = Math.floor(Math.random() * 40) + 20;
        p.style.setProperty('--tx', Math.cos(angle) * distance + 'px');
        p.style.setProperty('--ty', Math.sin(angle) * distance + 'px');
        p.style.left = (x - size / 2) + 'px';
        p.style.top = (y - size / 2) + 'px';
        stageEl.appendChild(p);
        setTimeout(() => { if (p.parentNode) p.parentNode.removeChild(p); }, 450);
      }
    }

    window.onload = () => {
      buildEvolutionChart();
      initPhysics();
      currentFruitIndex = Math.floor(Math.random() * 2);
      nextFruitIndex = Math.floor(Math.random() * 3);
      
      const cur = FRUITS[currentFruitIndex];
      guideImg.src = cur.img;
      guideEl.style.width = (cur.bubbleRadius * 2) + 'px';
      guideEl.style.height = (cur.bubbleRadius * 2) + 'px';

      nextImg.src = FRUITS[nextFruitIndex].img;
      guideEl.style.left = (stageEl.clientWidth / 2) + 'px';
    };
  </script>
</body>
</html>
