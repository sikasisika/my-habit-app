<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>マージパズル | すいか風合体ゲーム</title>

  <!-- 物理演算エンジン Matter.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: none;
    }

    body {
      background-color: #1e293b;
      background-image: linear-gradient(rgba(30, 41, 59, 0.85), rgba(30, 41, 59, 0.85)), url("images/kibana.png");
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 6px 12px;
      padding-top: calc(4px + env(safe-area-inset-top));
      padding-bottom: calc(4px + env(safe-area-inset-bottom));
    }

    .container {
      width: 100%;
      max-width: 360px;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 5px;
      justify-content: flex-start;
    }

    /* ヘッダー */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .back-btn {
      color: #ffffff;
      text-decoration: none;
      font-size: 11px;
      font-weight: bold;
      background: rgba(0, 0, 0, 0.4);
      padding: 3px 10px;
      border-radius: 20px;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    /* スコアボード */
    .score-board {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(8px);
      border-radius: 10px;
      padding: 4px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid rgba(255, 255, 255, 0.2);
      flex-shrink: 0;
    }
    .score-item { text-align: center; }
    .score-item span { display: block; font-size: 8px; color: #cbd5e1; }
    .score-item strong { font-size: 15px; color: #f59e0b; }

    .next-preview {
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(0, 0, 0, 0.3);
      padding: 2px 8px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .next-preview span { font-size: 9px; color: #94a3b8; font-weight: bold; }
    .next-bubble-box {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      border: 1.2px solid rgba(255, 255, 255, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 5px rgba(255, 255, 255, 0.4);
    }
    .next-img { width: 18px; height: 18px; object-fit: contain; }

    /* セリフエリア */
    .voice-bubble {
      background: rgba(15, 23, 42, 0.75);
      border-left: 3px solid #FFA500;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: bold;
      color: #f8fafc;
      min-height: 20px;
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }

    /* 進化順サークルチャート */
    .evolution-chart {
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(6px);
      border-radius: 12px;
      padding: 6px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid rgba(255, 255, 255, 0.25);
      flex-shrink: 0;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .evolution-chart::-webkit-scrollbar { display: none; }

    .evo-item {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }
    .evo-bubble {
      border-radius: 50%;
      border: 1.5px solid rgba(255, 255, 255, 0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 6px rgba(255, 255, 255, 0.4);
    }
    .evo-bubble img {
      width: 82%;
      height: 82%;
      object-fit: contain;
    }
    .evo-arrow {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.6);
      font-weight: bold;
    }

    /* ゲームコンテナ */
    .game-stage {
      height: 56vh;
      height: 56dvh;
      max-height: 440px;
      background-color: #FFA500;
      background-image: linear-gradient(180deg, rgba(255, 255, 255, 0.25) 0%, rgba(0, 0, 0, 0.1) 100%);
      border-radius: 14px;
      position: relative;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.6);
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.2), 0 4px 14px rgba(0, 0, 0, 0.3);
      touch-action: none;
      flex-shrink: 0;
      cursor: pointer;
    }

    /* 危険ライン */
    .danger-line {
      position: absolute;
      top: 75px;
      left: 0;
      right: 0;
      height: 2px;
      background: repeating-linear-gradient(90deg, #ef4444, #ef4444 8px, transparent 8px, transparent 16px);
      z-index: 5;
      opacity: 0.85;
      pointer-events: none;
    }

    /* ドロップガイド */
    .drop-guide {
      position: absolute;
      top: 15px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.7) 0%, rgba(255,255,255,0.2) 60%, rgba(255,165,0,0.5) 100%);
      border: 1.5px solid rgba(255, 255, 255, 0.95);
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.6);
      transform: translateX(-50%);
      pointer-events: none;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .drop-guide img { width: 80%; height: 80%; object-fit: contain; }

    /* 下部操作パネル */
    .control-panel {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      touch-action: none;
      cursor: grab;
    }
    .control-panel:active {
      cursor: grabbing;
      background: rgba(255, 255, 255, 0.22);
    }
    .control-guide-txt {
      font-size: 10px;
      font-weight: bold;
      color: #cbd5e1;
      letter-spacing: 0.5px;
    }
    .control-track {
      width: 100%;
      height: 5px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 3px;
      position: relative;
    }
    .control-knob {
      width: 20px;
      height: 10px;
      background: #FFA500;
      border-radius: 5px;
      position: absolute;
      top: -2.5px;
      left: 50%;
      transform: translateX(-50%);
      box-shadow: 0 0 5px rgba(255, 165, 0, 0.8);
      border: 1px solid #fff;
    }

    /* パーティクル */
    .sparkle-particle {
      position: absolute;
      pointer-events: none;
      border-radius: 50%;
      z-index: 20;
      animation: particleFly 0.45s forwards ease-out;
    }
    @keyframes particleFly {
      0% { transform: translate(0, 0) scale(1); opacity: 1; }
      100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
    }

    /* リザルト画面 */
    .overlay-screen {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px;
      text-align: center;
      z-index: 30;
    }
    .overlay-screen h2 { font-size: 20px; color: #FFA500; }
    .overlay-screen p { font-size: 11px; color: #cbd5e1; line-height: 1.4; }

    .btn-action {
      background: linear-gradient(135deg, #FFA500, #ea580c);
      color: #ffffff;
      border: none;
      font-size: 13px;
      font-weight: bold;
      padding: 6px 20px;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(255, 165, 0, 0.4);
      margin-top: 4px;
    }
    .btn-action:active { transform: scale(0.94); }
  </style>
</head>
<body>

  <div class="container">
    
    <div class="top-bar">
      <a href="index.html" class="back-btn">◀ 戻る</a>
      <span style="font-size: 10px; color: #cbd5e1;">MERGE PUZZLE</span>
    </div>

    <div class="score-board">
      <div class="score-item">
        <span>🔥 スコア</span>
        <strong id="score-val">0</strong>
      </div>
      <div class="next-preview">
        <span>NEXT ➔</span>
        <div class="next-bubble-box">
          <img id="next-img" class="next-img" src="images/merge1.png" alt="">
        </div>
      </div>
      <div class="score-item">
        <span>👑 ベスト</span>
        <strong id="best-score-val">0</strong>
      </div>
    </div>

    <div class="voice-bubble" id="voice-msg">
      「シャボン玉同士をぶつけて、でっかく進化させろよ！」
    </div>

    <div class="evolution-chart" id="evo-chart"></div>

    <div class="game-stage" id="stage">
      <div class="danger-line"></div>
      
      <div class="drop-guide" id="drop-guide">
        <img id="guide-img" src="images/merge1.png" alt="">
      </div>

      <!-- 高画質描画用キャンバス -->
      <canvas id="game-canvas" style="position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none;"></canvas>

      <div class="overlay-screen" id="overlay" style="display: none;">
        <h2 id="overlay-title">ゲームオーバー</h2>
        <p id="overlay-desc">箱から溢れちまったな！<br>もう一回挑戦するか？</p>
        <button class="btn-action" onclick="restartGame()">もう一度遊ぶ</button>
      </div>

    </div>

    <div class="control-panel" id="control-panel">
      <span class="control-guide-txt">◀ スライドして狙いを定めて離す ▶</span>
      <div class="control-track">
        <div class="control-knob" id="control-knob"></div>
      </div>
    </div>

  </div>

  <script>
    const FRUITS = [
      { level: 0, bubbleRadius: 18, score: 2,   bubbleColor: 'rgba(56, 189, 248, 0.55)',  borderColor: '#0284c7', img: 'images/merge1.png' },
      { level: 1, bubbleRadius: 25, score: 4,   bubbleColor: 'rgba(168, 85, 247, 0.55)',  borderColor: '#7e22ce', img: 'images/merge2.png' },
      { level: 2, bubbleRadius: 33, score: 8,   bubbleColor: 'rgba(236, 72, 153, 0.55)',  borderColor: '#be185d', img: 'images/merge3.png' },
      { level: 3, bubbleRadius: 44, score: 16,  bubbleColor: 'rgba(245, 158, 11, 0.55)',  borderColor: '#b45309', img: 'images/merge4.png' },
      { level: 4, bubbleRadius: 56, score: 32,  bubbleColor: 'rgba(34, 197, 94, 0.55)',   borderColor: '#15803d', img: 'images/merge5.png' },
      { level: 5, bubbleRadius: 70, score: 64,  bubbleColor: 'rgba(239, 68, 68, 0.55)',   borderColor: '#b91c1c', img: 'images/merge6.png' },
      { level: 6, bubbleRadius: 86, score: 128, bubbleColor: 'rgba(14, 165, 233, 0.55)',  borderColor: '#0369a1', img: 'images/merge7.png' },
      { level: 7, bubbleRadius: 105, score: 256, bubbleColor: 'rgba(234, 179, 8, 0.65)', borderColor: '#a16207', img: 'images/merge8.png' }
    ];

    // 画像プリロード
    const loadedImages = {};
    FRUITS.forEach(f => {
      const img = new Image();
      img.src = f.img;
      loadedImages[f.level] = img;
    });

    let score = 0;
    let currentFruitIndex = 0;
    let nextFruitIndex = 0;
    let canDrop = true;
    let isGameOver = false;
    let currentAimX = null;
    let mergeQueue = [];

    const stageEl = document.getElementById('stage');
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');
    const controlPanel = document.getElementById('control-panel');
    const controlKnob = document.getElementById('control-knob');
    const guideEl = document.getElementById('drop-guide');
    const guideImg = document.getElementById('guide-img');
    const nextImg = document.getElementById('next-img');
    const voiceEl = document.getElementById('voice-msg');

    const quotes = {
      start: "「シャボン玉同士をぶつけて、でっかく進化させろよ！」",
      merge3: "「いい感じに育ってきたじゃねえか！」",
      merge6: "「すげえ！あと少しで最大進化だぜ！」",
      max: "「やったな！！最高ランク達成だぜ、最高だ！」",
      overLow: "「おっと、溢れちまったか！次はもっといけんだろ？」",
      overHigh: "「マジかよ！そこまでデカく育てたのすげえな！」"
    };

    function getBestScore() {
      return parseInt(localStorage.getItem('my_merge_best') || '0');
    }
    document.getElementById('best-score-val').textContent = getBestScore();

    function buildEvolutionChart() {
      const chartEl = document.getElementById('evo-chart');
      chartEl.innerHTML = '';

      FRUITS.forEach((f, i) => {
        const item = document.createElement('div');
        item.className = 'evo-item';

        const previewSize = 20 + (i * 2.6);

        const bubble = document.createElement('div');
        bubble.className = 'evo-bubble';
        bubble.style.width = previewSize + 'px';
        bubble.style.height = previewSize + 'px';
        bubble.style.background = f.bubbleColor;

        const img = document.createElement('img');
        img.src = f.img;
        bubble.appendChild(img);

        item.appendChild(bubble);

        if (i < FRUITS.length - 1) {
          const arrow = document.createElement('span');
          arrow.className = 'evo-arrow';
          arrow.textContent = '›';
          item.appendChild(arrow);
        }

        chartEl.appendChild(item);
      });
    }

    const { Engine, Runner, Bodies, Composite, Events, Body } = Matter;
    let engine, runner;
    let dpr = window.devicePixelRatio || 1;

    function initPhysics() {
      const width = stageEl.clientWidth;
      const height = stageEl.clientHeight;

      // 高解像度DPI設定
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      ctx.scale(dpr, dpr);

      engine = Engine.create({ 
        gravity: { x: 0, y: 1.5 },
        positionIterations: 14,
        velocityIterations: 14
      });

      const wallThickness = 120;
      const ground = Bodies.rectangle(width / 2, height + wallThickness / 2, width * 2, wallThickness, { isStatic: true, friction: 0.15 });
      const ceiling = Bodies.rectangle(width / 2, -wallThickness / 2, width * 2, wallThickness, { isStatic: true });
      const leftWall = Bodies.rectangle(-wallThickness / 2, height / 2, wallThickness, height * 2, { isStatic: true, friction: 0.05 });
      const rightWall = Bodies.rectangle(width + wallThickness / 2, height / 2, wallThickness, height * 2, { isStatic: true, friction: 0.05 });

      Composite.add(engine.world, [ground, ceiling, leftWall, rightWall]);

      runner = Runner.create();
      Runner.run(runner, engine);

      // 描画＆合体キュー処理ループ
      Events.on(engine, 'afterUpdate', () => {
        // 安全な合体キュー処理（ゴースト化を完全防止）
        if (mergeQueue.length > 0) {
          const queue = [...mergeQueue];
          mergeQueue = [];
          queue.forEach(item => processMerge(item.bodyA, item.bodyB));
        }

        renderCanvas();
      });

      // 衝突判定
      Events.on(engine, 'collisionStart', (e) => {
        e.pairs.forEach(pair => {
          const { bodyA, bodyB } = pair;
          if (bodyA.fruitLevel !== undefined && bodyB.fruitLevel !== undefined) {
            if (bodyA.fruitLevel === bodyB.fruitLevel && !bodyA._merged && !bodyB._merged) {
              bodyA._merged = true;
              bodyB._merged = true;
              mergeQueue.push({ bodyA, bodyB });
            }
          }
        });
      });
    }

    // 高品質Canvasダイレクト描画
    function renderCanvas() {
      const width = stageEl.clientWidth;
      const height = stageEl.clientHeight;
      ctx.clearRect(0, 0, width, height);

      const bodies = Composite.allBodies(engine.world);

      bodies.forEach(body => {
        if (body.fruitLevel !== undefined) {
          const { x, y } = body.position;
          const r = body.circleRadius;
          const data = FRUITS[body.fruitLevel];

          ctx.save();
          ctx.translate(x, y);

          // 1. シャボン玉背景グラデーション
          const grad = ctx.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.1, 0, 0, r);
          grad.addColorStop(0, 'rgba(255, 255, 255, 0.7)');
          grad.addColorStop(0.6, data.bubbleColor);
          grad.addColorStop(1, 'rgba(255, 255, 255, 0.8)');

          ctx.beginPath();
          ctx.arc(0, 0, r, 0, Math.PI * 2);
          ctx.fillStyle = grad;
          ctx.fill();

          // 2. シャボン玉フチ
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.95)';
          ctx.lineWidth = Math.max(1.8, r * 0.04);
          ctx.stroke();

          // 3. キャライラスト（回転描画）
          ctx.save();
          ctx.rotate(body.angle);
          const imgR = r * 0.84;
          const img = loadedImages[body.fruitLevel];
          if (img && img.complete) {
            ctx.drawImage(img, -imgR, -imgR, imgR * 2, imgR * 2);
          }
          ctx.restore();

          // 4. ハイライト光
          ctx.beginPath();
          ctx.arc(-r * 0.4, -r * 0.4, r * 0.22, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
          ctx.fill();

          ctx.restore();
        }
      });
    }

    function dropFruit(x) {
      if (!canDrop || isGameOver) return;
      canDrop = false;

      const fruitData = FRUITS[currentFruitIndex];
      const minX = fruitData.bubbleRadius + 6;
      const maxX = stageEl.clientWidth - fruitData.bubbleRadius - 6;
      const dropX = Math.max(minX, Math.min(maxX, x));

      createFruitBody(dropX, 35, currentFruitIndex);

      guideEl.style.display = 'none';

      setTimeout(() => {
        prepareNextFruit();
        guideEl.style.display = 'flex';
        canDrop = true;
      }, 500);
    }

    function createFruitBody(x, y, level) {
      const data = FRUITS[level];
      const r = data.bubbleRadius;

      const body = Bodies.circle(x, y, r, {
        restitution: 0.12,
        friction: 0.02,
        frictionStatic: 0.05,
        frictionAir: 0.003,
        density: 0.002,
        fruitLevel: level
      });

      body._merged = false;
      Composite.add(engine.world, body);
      return body;
    }

    function processMerge(bodyA, bodyB) {
      const nextLevel = bodyA.fruitLevel + 1;
      const newX = (bodyA.position.x + bodyB.position.x) / 2;
      const newY = (bodyA.position.y + bodyB.position.y) / 2;

      Composite.remove(engine.world, [bodyA, bodyB]);

      score += FRUITS[bodyA.fruitLevel].score * 2;
      document.getElementById('score-val').textContent = score;

      createSparkles(newX, newY);

      if (nextLevel < FRUITS.length) {
        const newBody = createFruitBody(newX, newY, nextLevel);
        Body.setVelocity(newBody, { x: 0, y: 0.2 });

        if (nextLevel === 3) voiceEl.textContent = quotes.merge3;
        if (nextLevel === 6) voiceEl.textContent = quotes.merge6;
        if (nextLevel === 7) voiceEl.textContent = quotes.max;
      }
    }

    function prepareNextFruit() {
      currentFruitIndex = nextFruitIndex;
      nextFruitIndex = Math.floor(Math.random() * 3);

      const cur = FRUITS[currentFruitIndex];
      guideImg.src = cur.img;
      guideEl.style.width = (cur.bubbleRadius * 2) + 'px';
      guideEl.style.height = (cur.bubbleRadius * 2) + 'px';

      nextImg.src = FRUITS[nextFruitIndex].img;
    }

    function updateAimPosition(clientX) {
      const rect = stageEl.getBoundingClientRect();
      let x = clientX - rect.left;
      x = Math.max(20, Math.min(rect.width - 20, x));
      currentAimX = x;
      guideEl.style.left = x + 'px';

      const ratio = (x / rect.width) * 100;
      controlKnob.style.left = ratio + '%';
    }

    function triggerDropAction() {
      if (!canDrop || isGameOver) return;
      const targetX = (currentAimX !== null) ? currentAimX : (stageEl.clientWidth / 2);
      dropFruit(targetX);
    }

    stageEl.addEventListener('pointermove', (e) => updateAimPosition(e.clientX));
    stageEl.addEventListener('pointerup', (e) => {
      updateAimPosition(e.clientX);
      triggerDropAction();
    });

    controlPanel.addEventListener('pointermove', (e) => updateAimPosition(e.clientX));
    controlPanel.addEventListener('pointerup', (e) => {
      updateAimPosition(e.clientX);
      triggerDropAction();
    });

    // 溢れ判定（危険ライン 75px より上で静止した場合）
    setInterval(() => {
      if (isGameOver) return;
      const bodies = Composite.allBodies(engine.world);
      for (let b of bodies) {
        if (b.fruitLevel !== undefined && b.position.y < 75 && Math.abs(b.velocity.y) < 0.15 && Math.abs(b.velocity.x) < 0.15) {
          triggerGameOver();
          break;
        }
      }
    }, 1000);

    function triggerGameOver() {
      isGameOver = true;
      let best = getBestScore();
      if (score > best) {
        best = score;
        localStorage.setItem('my_merge_best', best);
        document.getElementById('best-score-val').textContent = best;
      }

      document.getElementById('overlay-desc').innerHTML = `スコア: <strong style="font-size:22px; color:#FFA500;">${score}</strong> 点！<br>${score >= 500 ? quotes.overHigh : quotes.overLow}`;
      document.getElementById('overlay').style.display = 'flex';
    }

    function restartGame() {
      document.getElementById('overlay').style.display = 'none';
      Composite.clear(engine.world, false, true);
      initPhysicsWalls();
      score = 0;
      document.getElementById('score-val').textContent = 0;
      isGameOver = false;
      canDrop = true;
      currentAimX = stageEl.clientWidth / 2;
      voiceEl.textContent = quotes.start;
      prepareNextFruit();
      guideEl.style.display = 'flex';
    }

    function initPhysicsWalls() {
      const width = stageEl.clientWidth;
      const height = stageEl.clientHeight;
      const wallThickness = 120;
      const ground = Bodies.rectangle(width / 2, height + wallThickness / 2, width * 2, wallThickness, { isStatic: true, friction: 0.15 });
      const ceiling = Bodies.rectangle(width / 2, -wallThickness / 2, width * 2, wallThickness, { isStatic: true });
      const leftWall = Bodies.rectangle(-wallThickness / 2, height / 2, wallThickness, height * 2, { isStatic: true, friction: 0.05 });
      const rightWall = Bodies.rectangle(width + wallThickness / 2, height / 2, wallThickness, height * 2, { isStatic: true, friction: 0.05 });
      Composite.add(engine.world, [ground, ceiling, leftWall, rightWall]);
    }

    function createSparkles(x, y) {
      const colors = ['#FFA500', '#ffffff', '#38bdf8', '#a855f7', '#fbbf24', '#ff4d4f'];
      for (let i = 0; i < 8; i++) {
        const p = document.createElement('div');
        p.className = 'sparkle-particle';
        const size = Math.floor(Math.random() * 8) + 6;
        p.style.width = size + 'px';
        p.style.height = size + 'px';
        p.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        const angle = (Math.PI * 2 / 8) * i + (Math.random() - 0.5);
        const distance = Math.floor(Math.random() * 40) + 20;
        p.style.setProperty('--tx', Math.cos(angle) * distance + 'px');
        p.style.setProperty('--ty', Math.sin(angle) * distance + 'px');
        p.style.left = (x - size / 2) + 'px';
        p.style.top = (y - size / 2) + 'px';
        stageEl.appendChild(p);
        setTimeout(() => { if (p.parentNode) p.parentNode.removeChild(p); }, 450);
      }
    }

    window.onload = () => {
      buildEvolutionChart();
      initPhysics();
      currentFruitIndex = Math.floor(Math.random() * 2);
      nextFruitIndex = Math.floor(Math.random() * 3);
      
      const cur = FRUITS[currentFruitIndex];
      guideImg.src = cur.img;
      guideEl.style.width = (cur.bubbleRadius * 2) + 'px';
      guideEl.style.height = (cur.bubbleRadius * 2) + 'px';

      nextImg.src = FRUITS[nextFruitIndex].img;
      currentAimX = stageEl.clientWidth / 2;
      guideEl.style.left = currentAimX + 'px';
    };
  </script>
</body>
</html>
