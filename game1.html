<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ミニゲーム | アーケード</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }

    html {
      width: 100%;
      height: 100%;
      height: -webkit-fill-available;
      overflow: hidden;
    }

    body {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      height: -webkit-fill-available;
      background-color: #1e293b;
      background-image: linear-gradient(rgba(30, 41, 59, 0.85), rgba(30, 41, 59, 0.85)), url("images/kibana.png");
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
      position: fixed;
      inset: 0;
      padding: 10px 14px;
      padding-top: calc(8px + env(safe-area-inset-top));
      padding-bottom: calc(8px + env(safe-area-inset-bottom));
    }

    .container {
      width: 100%;
      max-width: 400px;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .back-btn {
      color: #ffffff;
      text-decoration: none;
      font-size: 12px;
      font-weight: bold;
      background: rgba(0, 0, 0, 0.4);
      padding: 4px 12px;
      border-radius: 20px;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .score-board {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(8px);
      border-radius: 12px;
      padding: 4px 10px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      border: 1px solid rgba(255, 255, 255, 0.2);
      flex-shrink: 0;
    }
    .score-item { text-align: center; }
    .score-item span { display: block; font-size: 9px; color: #cbd5e1; }
    .score-item strong { font-size: 16px; color: #f59e0b; }

    .voice-bubble {
      background: rgba(15, 23, 42, 0.75);
      border-left: 4px solid #ff8800;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: bold;
      color: #f8fafc;
      min-height: 30px;
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }

    .game-stage {
      flex: 1 1 0%;
      min-height: 0;
      background-color: rgba(0, 0, 0, 0.3);
      background-image: url("images/game-stage-bg.png");
      background-size: cover;
      background-position: center;
      border-radius: 16px;
      position: relative;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.2);
      box-shadow: inset 0 0 20px rgba(0,0,0,0.4);
      touch-action: manipulation;
    }

    .game-stage.miss-shake {
      animation: missEffect 0.25s ease;
      background-color: rgba(239, 68, 68, 0.4) !important;
    }
    @keyframes missEffect {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }

    /* 左端固定・お題アイコン枠 */
    .mission-hud-box {
      position: absolute;
      top: 8px;
      left: 8px;
      width: 54px;
      height: 54px;
      border-radius: 14px;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.95) 0%, rgba(217, 119, 6, 0.6) 70%, rgba(0,0,0,0.4) 100%);
      border: 2px solid #fbbf24;
      display: none;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 14px rgba(245, 158, 11, 0.85);
      z-index: 15;
      animation: hudPulse 1.2s infinite alternate ease-in-out;
    }
    @keyframes hudPulse {
      0% { transform: scale(0.96); box-shadow: 0 0 8px rgba(245, 158, 11, 0.7); }
      100% { transform: scale(1.06); box-shadow: 0 0 18px rgba(245, 158, 11, 1); }
    }
    .mission-hud-img {
      width: 40px;
      height: 40px;
      object-fit: contain;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.6));
    }

    /* ターゲットアイコン */
    .target-circle {
      position: absolute;
      width: 68px;
      height: 68px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: manipulation;
      transform-origin: center center;
      z-index: 5;
    }
    .target-circle img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.35));
      pointer-events: none;
    }

    .target-circle.bounce-mode {
      animation: pikopiko 0.7s infinite alternate ease-in-out;
    }
    @keyframes pikopiko {
      0% { transform: scale(0.92) translateY(0px) rotate(-3deg); }
      100% { transform: scale(1.08) translateY(-3px) rotate(3deg); }
    }

    .target-circle.fade-melt-mode {
      animation: fadeMelt var(--life-time, 2.2s) forwards ease-in-out;
    }
    @keyframes fadeMelt {
      0% { opacity: 0; transform: scale(0.4) translateY(10px) rotate(-6deg); }
      25% { opacity: 1; transform: scale(1.05) translateY(0px) rotate(2deg); }
      70% { opacity: 0.95; transform: scale(1) translateY(-4px) rotate(-2deg); }
      100% { opacity: 0; transform: scale(0.6) translateY(-12px) rotate(8deg); }
    }

    .target-circle.popped {
      animation: popBurst 0.18s forwards ease-out !important;
      pointer-events: none;
    }
    @keyframes popBurst {
      0% { transform: scale(1); opacity: 1; }
      100% { transform: scale(1.8) rotate(30deg); opacity: 0; }
    }

    .mole-grid {
      display: none;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      width: 100%;
      height: 100%;
    }
    .mole-hole {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      border: 1px dashed rgba(255, 255, 255, 0.18);
    }

    .sparkle-particle {
      position: absolute;
      pointer-events: none;
      border-radius: 50%;
      z-index: 20;
      animation: particleFly 0.45s forwards ease-out;
    }
    @keyframes particleFly {
      0% { transform: translate(0, 0) scale(1); opacity: 1; }
      100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
    }

    .confetti-piece {
      position: absolute;
      width: 8px;
      height: 12px;
      pointer-events: none;
      z-index: 30;
      animation: confettiFall 1.2s forwards ease-out;
    }
    @keyframes confettiFall {
      0% { transform: translate(var(--cx), var(--cy)) scale(1) rotate(0deg); opacity: 1; }
      100% { transform: translate(var(--ex), var(--ey)) scale(0.4) rotate(720deg); opacity: 0; }
    }

    .countdown-layer {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(4px);
      z-index: 25;
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .countdown-img {
      max-width: 130px;
      max-height: 130px;
      object-fit: contain;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.5));
    }
    .countdown-text {
      font-size: 26px;
      font-weight: 800;
      color: #f59e0b;
      text-shadow: 0 2px 6px rgba(0,0,0,0.8);
      margin-top: 6px;
    }
    @keyframes popIn {
      0% { transform: scale(0.6); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .overlay-screen {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(8px);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 12px;
      text-align: center;
      z-index: 40;
      overflow-y: auto;
    }
    .overlay-screen h2 { font-size: 18px; color: #f59e0b; }
    .overlay-screen p { font-size: 11px; color: #cbd5e1; line-height: 1.3; }

    .ranking-box {
      width: 100%;
      max-width: 240px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 6px 12px;
      margin: 2px 0;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .ranking-title { font-size: 10px; font-weight: bold; color: #94a3b8; margin-bottom: 4px; }
    .ranking-item { display: flex; justify-content: space-between; font-size: 11px; padding: 1px 0; }
    .rank-1 { color: #facc15; font-weight: bold; }
    .rank-2 { color: #e2e8f0; }
    .rank-3 { color: #f97316; }

    .selector-row { display: flex; gap: 4px; margin: 1px 0; }
    .pill-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #cbd5e1;
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 10px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .pill-btn.active {
      background: #f59e0b;
      color: #111;
      border-color: #f59e0b;
      box-shadow: 0 0 8px rgba(245, 158, 11, 0.5);
    }

    .start-btn-box {
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.1s ease;
      margin-top: 4px;
    }
    .start-btn-box img { max-width: 140px; height: auto; display: block; }
    .start-btn-fallback {
      background: linear-gradient(135deg, #ff8800, #ea580c);
      color: #ffffff;
      font-size: 13px;
      font-weight: bold;
      padding: 8px 22px;
      border-radius: 20px;
      box-shadow: 0 4px 12px rgba(255, 136, 0, 0.4);
    }
    .start-btn-box:active { transform: scale(0.92); }
  </style>
</head>
<body>

  <div class="container">
    
    <div class="top-bar">
      <a href="index.html" class="back-btn">◀ 戻る</a>
      <span style="font-size: 10px; color: #cbd5e1;" id="mode-label">通常タップ・NORMAL</span>
    </div>

    <div class="score-board">
      <div class="score-item">
        <span>⏱️ 残り時間</span>
        <strong id="timer-val">30</strong>
      </div>
      <div class="score-item">
        <span>🔥 スコア</span>
        <strong id="score-val">0</strong>
      </div>
      <div class="score-item">
        <span>👑 ハイスコア</span>
        <strong id="best-score-val">0</strong>
      </div>
    </div>

    <div class="voice-bubble" id="voice-msg">
      「モードと難易度を選んで、準備ができたらスタートだぜ！」
    </div>

    <div class="game-stage" id="stage">
      
      <div class="mission-hud-box" id="mission-hud">
        <img id="mission-target-img" class="mission-hud-img" src="images/target1.png" alt="">
        <span id="mission-target-emoji" style="font-size:22px; display:none;">⭐</span>
      </div>

      <div id="target-container" style="position: absolute; inset: 0;"></div>

      <div class="mole-grid" id="mole-grid">
        <div class="mole-hole"></div>
        <div class="mole-hole"></div>
        <div class="mole-hole"></div>
        <div class="mole-hole"></div>
        <div class="mole-hole"></div>
        <div class="mole-hole"></div>
        <div class="mole-hole"></div>
        <div class="mole-hole"></div>
        <div class="mole-hole"></div>
      </div>

      <div class="countdown-layer" id="countdown-layer">
        <img src="images/ready.png" id="countdown-img" class="countdown-img" alt="" onerror="this.style.display='none';">
        <div class="countdown-text" id="countdown-txt">よーい…</div>
      </div>

      <div class="overlay-screen" id="overlay">
        <h2 id="overlay-title">ゲーム選択</h2>
        <p id="overlay-desc">遊びたいルールを選んで挑戦しろよ！</p>
        
        <div class="ranking-box" id="ranking-container" style="display:none;">
          <div class="ranking-title">🏆 歴代ハイスコア TOP3</div>
          <div class="ranking-item rank-1"><span>1位</span><span id="rank-1-val">0 点</span></div>
          <div class="ranking-item rank-2"><span>2位</span><span id="rank-2-val">0 点</span></div>
          <div class="ranking-item rank-3"><span>3位</span><span id="rank-3-val">0 点</span></div>
        </div>

        <span style="font-size:9px; color:#94a3b8; margin-top:2px;">▼ ゲームルール</span>
        <div class="selector-row" id="mode-selector">
          <button class="pill-btn active" onclick="setGameMode('normal', event)">通常タップ</button>
          <button class="pill-btn" onclick="setGameMode('target', event)">指定狙い</button>
          <button class="pill-btn" onclick="setGameMode('mole', event)">もぐら叩き</button>
        </div>

        <span style="font-size:9px; color:#94a3b8; margin-top:2px;">▼ スピード</span>
        <div class="selector-row" id="diff-selector">
          <button class="pill-btn active" onclick="setDifficulty('normal', event)">ノーマル</button>
          <button class="pill-btn" onclick="setDifficulty('hard', event)">ハード</button>
          <button class="pill-btn" onclick="setDifficulty('veryhard', event)">ベリーハード</button>
        </div>

        <button class="start-btn-box" onclick="triggerCountdown()">
          <img src="images/start-btn.png" alt="スタート" onerror="this.style.display='none'; document.getElementById('start-btn-txt').style.display='block';">
          <div id="start-btn-txt" class="start-btn-fallback" style="display:none;">スタート！</div>
        </button>
      </div>

    </div>

  </div>

  <script>
    const targetImages = [
      { id: 0, src: 'images/target1.png', emoji: '⭐' },
      { id: 1, src: 'images/target2.png', emoji: '🌸' },
      { id: 2, src: 'images/target3.png', emoji: '⚡' },
      { id: 3, src: 'images/target4.png', emoji: '💖' }
    ];

    let gameMode = 'normal';
    let currentDifficulty = 'normal';
    let timeLeft = 30;
    let score = 0;
    let timerId = null;
    let targetSpawnTimer = null;
    let isPlaying = false;
    let currentTargetId = 0;

    const diffSettings = {
      normal: { spawnInterval: 700, lifeTime: 2.2, maxTargets: 4 },
      hard: { spawnInterval: 500, lifeTime: 1.7, maxTargets: 5 },
      veryhard: { spawnInterval: 380, lifeTime: 1.3, maxTargets: 6 }
    };

    function getRankingKey() {
      return `game_ranks_${gameMode}_${currentDifficulty}`;
    }

    function getRankings() {
      return JSON.parse(localStorage.getItem(getRankingKey()) || '[0, 0, 0]');
    }

    function saveScore(newScore) {
      let ranks = getRankings();
      ranks.push(newScore);
      ranks.sort((a, b) => b - a);
      ranks = ranks.slice(0, 3);
      localStorage.setItem(getRankingKey(), JSON.stringify(ranks));
      return ranks;
    }

    function updateBestScoreDisplay() {
      const ranks = getRankings();
      document.getElementById('best-score-val').textContent = ranks[0];
      document.getElementById('rank-1-val').textContent = ranks[0] + ' 点';
      document.getElementById('rank-2-val').textContent = ranks[1] + ' 点';
      document.getElementById('rank-3-val').textContent = ranks[2] + ' 点';
    }
    updateBestScoreDisplay();

    const targetContainer = document.getElementById('target-container');
    const stageEl = document.getElementById('stage');
    const voiceEl = document.getElementById('voice-msg');
    const countLayer = document.getElementById('countdown-layer');
    const countImg = document.getElementById('countdown-img');
    const countTxt = document.getElementById('countdown-txt');
    const missionHud = document.getElementById('mission-hud');
    const missionImg = document.getElementById('mission-target-img');
    const missionEmoji = document.getElementById('mission-target-emoji');
    const moleGrid = document.getElementById('mole-grid');

    const quotes = {
      ready: "「よーし……息を整えて集中しろよ！」",
      start: "「おう！始まったぜ、全力で叩いてこい！」",
      combo10: "「いいテンポだ！まだまだいけんだろ？」",
      combo25: "「やるじゃねえか！そのスピード、嫌いじゃねえぜ！」",
      combo40: "「速すぎだろ！？最高にノッてきたな！」",
      rush: "「後半戦だ！ここからラッシュ仕掛けてくっぞ！」",
      miss: "「おっと！お手つきだぜ、慌てんな！」",
      finishLow: "「お疲れさん！次はもっと上を目指そうぜ！」",
      finishHigh: "「マジかよ、すげえスコア叩き出しやがったな！」"
    };

    function setGameMode(mode, e) {
      gameMode = mode;
      document.querySelectorAll('#mode-selector .pill-btn').forEach(btn => btn.classList.remove('active'));
      if (e && e.target) e.target.classList.add('active');
      updateLabels();
    }

    function setDifficulty(diff, e) {
      currentDifficulty = diff;
      document.querySelectorAll('#diff-selector .pill-btn').forEach(btn => btn.classList.remove('active'));
      if (e && e.target) e.target.classList.add('active');
      updateLabels();
    }

    function updateLabels() {
      const modeNames = { normal: '通常タップ', target: '指定狙い', mole: 'もぐら叩き' };
      document.getElementById('mode-label').textContent = `${modeNames[gameMode]}・${currentDifficulty.toUpperCase()}`;
      updateBestScoreDisplay();
    }

    function fireConfetti() {
      const colors = ['#f59e0b', '#ef4444', '#3b82f6', '#10b981', '#ec4899', '#facc15', '#a855f7'];
      const stageW = stageEl.clientWidth;
      const stageH = stageEl.clientHeight;

      for (let i = 0; i < 40; i++) {
        const c = document.createElement('div');
        c.className = 'confetti-piece';
        c.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        const fromLeft = i % 2 === 0;
        const startX = fromLeft ? 20 : stageW - 20;
        const startY = stageH - 20;

        const endX = startX + (fromLeft ? 1 : -1) * (Math.random() * (stageW * 0.7) + 40);
        const endY = Math.random() * (stageH * 0.8);

        c.style.setProperty('--cx', startX + 'px');
        c.style.setProperty('--cy', startY + 'px');
        c.style.setProperty('--ex', endX + 'px');
        c.style.setProperty('--ey', endY + 'px');

        stageEl.appendChild(c);
        setTimeout(() => { if (c.parentNode) c.parentNode.removeChild(c); }, 1200);
      }
    }

    function triggerCountdown() {
      document.getElementById('overlay').style.display = 'none';
      voiceEl.textContent = quotes.ready;

      countLayer.style.display = 'flex';
      countImg.src = 'images/ready.png';
      countImg.style.display = 'block';
      countTxt.textContent = 'よーい…';

      setTimeout(() => {
        countImg.src = 'images/go.png';
        countTxt.textContent = 'スタート！！';
        countTxt.style.color = '#22c55e';
        fireConfetti();

        setTimeout(() => {
          countLayer.style.display = 'none';
          countTxt.style.color = '#f59e0b';
          startGame();
        }, 600);

      }, 1500);
    }

    function startGame() {
      score = 0;
      timeLeft = 30;
      isPlaying = true;
      document.getElementById('score-val').textContent = score;
      document.getElementById('timer-val').textContent = timeLeft;
      voiceEl.textContent = quotes.start;

      if (gameMode === 'target') {
        missionHud.style.display = 'flex';
        pickNewMission();
      } else {
        missionHud.style.display = 'none';
      }

      if (gameMode === 'mole') {
        moleGrid.style.display = 'grid';
        targetContainer.style.display = 'none';
      } else {
        moleGrid.style.display = 'none';
        targetContainer.style.display = 'block';
      }

      startSpawningLoop();

      clearInterval(timerId);
      timerId = setInterval(() => {
        timeLeft--;
        document.getElementById('timer-val').textContent = timeLeft;

        if (timeLeft === 12 && gameMode === 'mole') {
          voiceEl.textContent = quotes.rush;
        }

        if (timeLeft <= 0) endGame();
      }, 1000);
    }

    function pickNewMission() {
      currentTargetId = Math.floor(Math.random() * targetImages.length);
      const chosen = targetImages[currentTargetId];
      missionImg.onerror = function() {
        this.style.display = 'none';
        missionEmoji.style.display = 'inline';
        missionEmoji.textContent = chosen.emoji;
      };
      missionImg.style.display = 'inline-block';
      missionEmoji.style.display = 'none';
      missionImg.src = chosen.src;
    }

    function startSpawningLoop() {
      if (!isPlaying) return;

      if (gameMode === 'target') {
        spawnFloatingTarget();
        const conf = diffSettings[currentDifficulty];
        targetSpawnTimer = setTimeout(startSpawningLoop, conf.spawnInterval);

      } else if (gameMode === 'mole') {
        spawnMoleTargets();
        const conf = diffSettings[currentDifficulty];
        targetSpawnTimer = setTimeout(startSpawningLoop, conf.spawnInterval * 1.5);

      } else {
        spawnSingleTarget();
      }
    }

    function spawnFloatingTarget() {
      const conf = diffSettings[currentDifficulty];
      if (targetContainer.children.length >= conf.maxTargets) return;

      const stageW = stageEl.clientWidth - 76;
      const stageH = stageEl.clientHeight - 76;

      let randX = Math.max(8, Math.floor(Math.random() * stageW));
      let randY = Math.max(8, Math.floor(Math.random() * stageH));
      if (randX < 75 && randY < 75) {
        randX += 70;
        randY += 70;
      }

      let item = (Math.random() < 0.4) ? targetImages[currentTargetId] : targetImages[Math.floor(Math.random() * targetImages.length)];

      const el = document.createElement('div');
      el.className = 'target-circle fade-melt-mode';
      el.style.setProperty('--life-time', `${conf.lifeTime}s`);
      el.style.left = randX + 'px';
      el.style.top = randY + 'px';

      const img = document.createElement('img');
      img.src = item.src;
      img.onerror = () => { el.textContent = item.emoji; el.style.fontSize = '32px'; };
      el.appendChild(img);

      el.addEventListener('pointerdown', (e) => handleTap(e, el, item.id));
      targetContainer.appendChild(el);

      setTimeout(() => {
        if (el.parentNode && !el.classList.contains('popped')) {
          el.parentNode.removeChild(el);
        }
      }, conf.lifeTime * 1000);
    }

    function spawnSingleTarget() {
      targetContainer.innerHTML = '';
      const item = targetImages[Math.floor(Math.random() * targetImages.length)];
      const el = document.createElement('div');
      el.className = 'target-circle bounce-mode';

      const stageW = stageEl.clientWidth - 76;
      const stageH = stageEl.clientHeight - 76;
      el.style.left = Math.max(8, Math.floor(Math.random() * stageW)) + 'px';
      el.style.top = Math.max(8, Math.floor(Math.random() * stageH)) + 'px';

      const img = document.createElement('img');
      img.src = item.src;
      img.onerror = () => { el.textContent = item.emoji; el.style.fontSize = '36px'; };
      el.appendChild(img);

      el.addEventListener('pointerdown', (e) => handleTap(e, el, item.id));
      targetContainer.appendChild(el);

      const conf = diffSettings[currentDifficulty];
      const speed = Math.max(400, conf.spawnInterval * 2 - score * 10);
      clearTimeout(targetSpawnTimer);
      targetSpawnTimer = setTimeout(() => { if (isPlaying) spawnSingleTarget(); }, speed);
    }

    function spawnMoleTargets() {
      const holes = Array.from(document.querySelectorAll('.mole-hole'));
      holes.forEach(h => h.innerHTML = '');

      let count = 1;
      if (timeLeft <= 10) count = 3;
      else if (timeLeft <= 20) count = 2;

      const shuffled = holes.sort(() => 0.5 - Math.random()).slice(0, count);
      shuffled.forEach(hole => {
        const item = targetImages[Math.floor(Math.random() * targetImages.length)];
        const moleEl = document.createElement('div');
        moleEl.className = 'target-circle bounce-mode';
        moleEl.style.position = 'relative';

        const img = document.createElement('img');
        img.src = item.src;
        img.onerror = () => { moleEl.textContent = item.emoji; moleEl.style.fontSize = '30px'; };
        moleEl.appendChild(img);

        moleEl.addEventListener('pointerdown', (e) => handleTap(e, moleEl, item.id));
        hole.appendChild(moleEl);
      });
    }

    function handleTap(e, elem, clickedId) {
      e.preventDefault();
      if (!isPlaying || elem.classList.contains('popped')) return;

      if (gameMode === 'target' && clickedId !== currentTargetId) {
        score = Math.max(0, score - 1);
        document.getElementById('score-val').textContent = score;
        voiceEl.textContent = quotes.miss;
        stageEl.classList.add('miss-shake');
        setTimeout(() => stageEl.classList.remove('miss-shake'), 250);
        return;
      }

      score++;
      document.getElementById('score-val').textContent = score;

      if (score === 10) voiceEl.textContent = quotes.combo10;
      if (score === 25) voiceEl.textContent = quotes.combo25;
      if (score === 40) voiceEl.textContent = quotes.combo40;

      elem.classList.add('popped');

      const rect = elem.getBoundingClientRect();
      const stageRect = stageEl.getBoundingClientRect();
      createSparkles(rect.left - stageRect.left, rect.top - stageRect.top);

      if (gameMode === 'target') {
        pickNewMission();
        setTimeout(() => { if (elem.parentNode) elem.parentNode.removeChild(elem); }, 180);
      } else if (gameMode === 'normal') {
        clearTimeout(targetSpawnTimer);
        setTimeout(() => { if (isPlaying) spawnSingleTarget(); }, 180);
      }
    }

    function createSparkles(x, y) {
      const colors = ['#f59e0b', '#ec4899', '#38bdf8', '#a855f7', '#fbbf24', '#ffffff'];
      for (let i = 0; i < 10; i++) {
        const p = document.createElement('div');
        p.className = 'sparkle-particle';
        const size = Math.floor(Math.random() * 8) + 6;
        p.style.width = size + 'px';
        p.style.height = size + 'px';
        p.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        const angle = (Math.PI * 2 / 10) * i + (Math.random() - 0.5);
        const distance = Math.floor(Math.random() * 45) + 20;
        p.style.setProperty('--tx', Math.cos(angle) * distance + 'px');
        p.style.setProperty('--ty', Math.sin(angle) * distance + 'px');
        p.style.left = (x + 34 - size / 2) + 'px';
        p.style.top = (y + 34 - size / 2) + 'px';
        stageEl.appendChild(p);
        setTimeout(() => { if (p.parentNode) p.parentNode.removeChild(p); }, 450);
      }
    }

    function endGame() {
      isPlaying = false;
      clearInterval(timerId);
      clearTimeout(targetSpawnTimer);
      targetContainer.innerHTML = '';
      moleGrid.style.display = 'none';
      missionHud.style.display = 'none';

      saveScore(score);
      updateBestScoreDisplay();

      document.getElementById('ranking-container').style.display = 'block';
      document.getElementById('overlay-title').textContent = 'タイムアップ！';
      document.getElementById('overlay-desc').innerHTML = `今回のスコア: <strong style="font-size:22px; color:#f59e0b;">${score}</strong> 点！<br>${score >= 25 ? quotes.finishHigh : quotes.finishLow}`;
      document.getElementById('overlay').style.display = 'flex';
    }
  </script>
</body>
</html>
