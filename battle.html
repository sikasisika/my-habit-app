<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ポケモンタワーバトル | DSスタイル</title>

  <!-- ドットフォント -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'DotGothic16', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #090d16;
    }

    body {
      background: #111827;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 4px 6px;
      padding-top: calc(4px + env(safe-area-inset-top));
      padding-bottom: calc(4px + env(safe-area-inset-bottom));
    }

    .container {
      width: 100%;
      max-width: 420px;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 5px;
      justify-content: space-between;
      position: relative;
    }

    /* 最上部ヘッダー */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      padding: 0 4px;
    }
    .top-btn {
      color: #ffffff;
      text-decoration: none;
      font-size: 11px;
      background: rgba(255, 255, 255, 0.12);
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      cursor: pointer;
    }

    /* DS筐体 */
    .ds-body {
      flex: 1 1 0%;
      min-height: 0;
      background: #1e293b;
      border-radius: 12px;
      padding: 6px;
      border: 2px solid #334155;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* ------------------------------------ */
    /* 📺 上画面：バトルフィールド */
    /* ------------------------------------ */
    .ds-top-screen {
      flex: 1.25;
      min-height: 0;
      background: linear-gradient(180deg, #38bdf8 0%, #6366f1 45%, #1e1b4b 85%, #0f172a 100%);
      border-radius: 8px;
      border: 2px solid #0f172a;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 8px 6px 6px 6px; /* 上部に余白を確保 */
    }

    /* 相手情報＆スプライト */
    .enemy-row-layout {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      z-index: 5;
    }
    .enemy-plate {
      background: rgba(15, 23, 42, 0.88);
      border: 1.5px solid #f87171;
      border-radius: 6px;
      padding: 3px 6px;
      width: 155px;
    }

    /* 相棒情報＆スプライト */
    .player-row-layout {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      z-index: 5;
    }
    .player-plate {
      background: rgba(15, 23, 42, 0.88);
      border: 1.5px solid #38bdf8;
      border-radius: 6px;
      padding: 3px 6px;
      width: 165px;
    }

    .plate-header {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      margin-bottom: 2px;
    }
    .type-badge {
      font-size: 8px;
      padding: 0 3px;
      border-radius: 3px;
      background: #475569;
      color: #fff;
    }
    .hp-gauge-bg {
      width: 100%;
      height: 6px;
      background: #111827;
      border-radius: 3px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .hp-gauge-fill {
      height: 100%;
      background: linear-gradient(90deg, #22c55e, #16a34a);
      transition: width 0.25s ease;
    }
    .hp-gauge-fill.warning { background: #eab308; }
    .hp-gauge-fill.danger { background: #ef4444; }

    /* サイズ別スプライト＆影 */
    .sprite-box {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .sprite-box.size-S { width: 75px; height: 75px; }
    .sprite-box.size-M { width: 90px; height: 90px; }
    .sprite-box.size-L { width: 110px; height: 110px; }
    .sprite-box.size-G { width: 140px; height: 140px; margin-top: -15px; margin-right: -10px; } /* キョダイマックス特大 */

    .sprite-shadow {
      position: absolute;
      bottom: 2px;
      width: 70%;
      height: 14px;
      background: rgba(0, 0, 0, 0.45);
      border-radius: 50%;
      filter: blur(2px);
      z-index: 1;
    }
    .poke-sprite {
      width: 100%;
      height: 100%;
      object-fit: contain;
      position: relative;
      z-index: 2;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
    }

    /* ダメージ数値ポップ（4秒残る） */
    .dmg-indicator {
      position: absolute;
      top: -10px;
      font-size: 16px;
      font-weight: 900;
      color: #ff3344;
      text-shadow: 0 0 4px #000, 0 0 8px #000;
      animation: floatDmg 3.5s forwards ease-out;
      z-index: 20;
      pointer-events: none;
    }
    @keyframes floatDmg {
      0% { opacity: 0; transform: translateY(4px); }
      15% { opacity: 1; transform: translateY(0); }
      80% { opacity: 1; transform: translateY(-3px); }
      100% { opacity: 0; transform: translateY(-8px); }
    }

    /* ------------------------------------ */
    /* 📱 下画面：新レイアウト（イメージ図完全再現） */
    /* ------------------------------------ */
    .ds-bottom-screen {
      flex: 1;
      min-height: 0;
      background: #0f172a;
      border-radius: 8px;
      border: 2px solid #0f172a;
      padding: 5px 6px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 4px;
      position: relative;
    }

    /* メインコマンドビュー */
    .cmd-view-container {
      display: flex;
      flex-direction: column;
      height: 100%;
      justify-content: space-between;
      gap: 4px;
    }

    /* ログウィンドウ ＆ ドット▾アイコン */
    .msg-window-box {
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 10px;
      line-height: 1.35;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #f1f5f9;
      cursor: pointer;
    }
    .pixel-arrow {
      font-size: 12px;
      color: #38bdf8;
      animation: arrowBounce 0.8s infinite alternate ease-in-out;
      flex-shrink: 0;
      margin-left: 4px;
    }
    @keyframes arrowBounce {
      0% { transform: translateY(0); }
      100% { transform: translateY(3px); }
    }

    /* 上段：こうげき / ぼうぎょ */
    .cmd-row-top {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px;
    }
    .btn-main-act {
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      font-size: 13px;
      font-weight: bold;
      padding: 8px 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      box-shadow: 0 2px 0 rgba(0,0,0,0.4);
    }
    .btn-main-act:active { transform: translateY(1px); }
    .btn-main-act:disabled { opacity: 0.3; cursor: not-allowed; }

    .btn-atk { background: linear-gradient(135deg, #f87171, #dc2626); }
    .btn-def { background: linear-gradient(135deg, #60a5fa, #2563eb); }

    /* 下段：こうたい / かくせい（種ストック連動） / Auto */
    .cmd-row-bottom {
      display: flex;
      gap: 4px;
      align-items: center;
    }
    .btn-sub-small {
      width: 58px;
      padding: 8px 0;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      font-size: 10px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      flex-shrink: 0;
    }
    .btn-switch { background: #475569; }
    .btn-auto { background: #059669; }
    .btn-auto.active { background: #d97706; }

    .btn-awaken-box {
      flex: 1;
      padding: 6px 0;
      border-radius: 8px;
      border: 1.5px solid #fbbf24;
      background: rgba(251, 191, 36, 0.15);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      cursor: pointer;
    }
    .btn-awaken-box:disabled { opacity: 0.35; cursor: not-allowed; border-color: #64748b; }
    .btn-awaken-box.ready {
      background: linear-gradient(135deg, #ec4899, #be185d);
      border-color: #f43f5e;
      animation: rainbowGlow 2s infinite linear;
    }
    @keyframes rainbowGlow {
      0% { filter: hue-rotate(0deg); }
      100% { filter: hue-rotate(360deg); }
    }

    .seed-track {
      display: flex;
      gap: 4px;
      font-size: 9px;
    }
    .seed-icon { opacity: 0.25; filter: grayscale(1); }
    .seed-icon.active { opacity: 1; filter: grayscale(0); text-shadow: 0 0 6px #4ade80; }
    .seed-super-icon { opacity: 0.25; filter: grayscale(1); }
    .seed-super-icon.active { opacity: 1; filter: grayscale(0); animation: rainbowGlow 1.5s infinite linear; }

    /* ------------------------------------ */
    /* 🔄 交代画面（イメージ図4枚目の完全再現） */
    /* ------------------------------------ */
    .switch-view-container {
      display: flex;
      flex-direction: column;
      height: 100%;
      justify-content: space-between;
      gap: 4px;
    }
    .party-grid-6 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: repeat(3, 1fr);
      gap: 4px;
      flex: 1;
    }
    .party-slot-card {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      padding: 3px 6px;
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }
    .party-slot-card.empty {
      border: 1px dashed rgba(255, 255, 255, 0.2);
      background: transparent;
      cursor: default;
    }
    .party-slot-card.current { border-color: #38bdf8; background: rgba(56, 189, 248, 0.15); }
    .party-slot-card.fainted { border-color: #ef4444; opacity: 0.45; cursor: not-allowed; }

    /* ------------------------------------ */
    /* 🎰 スロット画面（イメージ図3枚目再現） */
    /* ------------------------------------ */
    .slot-view-overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.95);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px;
      z-index: 30;
    }
    .slot-drum-box {
      width: 140px;
      height: 48px;
      background: linear-gradient(180deg, #1e1b4b 0%, #312e81 50%, #1e1b4b 100%);
      border: 2px solid #fbbf24;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: bold;
      color: #fbbf24;
      box-shadow: 0 0 12px rgba(251, 191, 36, 0.4);
    }
    .btn-slot-push {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      border: 2px solid #fff;
      color: #000;
      font-size: 12px;
      font-weight: 900;
      padding: 6px 18px;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 3px 0 #92400e;
    }
    .btn-slot-push:active { transform: translateY(2px); box-shadow: 0 1px 0 #92400e; }

    /* 📜 履歴ログモーダル */
    .history-modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(2, 6, 23, 0.95);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      padding: 8px;
      gap: 6px;
      z-index: 40;
    }
    .history-log-list {
      flex: 1;
      overflow-y: auto;
      background: rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px;
      padding: 6px;
      font-size: 9px;
      line-height: 1.5;
      color: #cbd5e1;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <div class="top-bar">
      <a href="index.html" class="top-btn">◀ ポータル</a>
      <span style="font-size: 11px; color:#cbd5e1;">階層: <b id="stage-text" style="color:#fbbf24;">1F</b></span>
      <a href="train.html" class="top-btn" style="background:#10b981;">🌱 育成ジム</a>
    </div>

    <div class="ds-body">

      <!-- ========================================================= -->
      <!-- 📺 上画面：バトルフィールド（余白確保・サイズ差分） -->
      <!-- ========================================================= -->
      <div class="ds-top-screen">
        
        <!-- 上段：相手情報 ＆ 相手スプライト -->
        <div class="enemy-row-layout">
          <div class="enemy-plate">
            <div class="plate-header">
              <span id="enemy-name" style="color:#fca5a5;">コラッタ</span>
              <span class="type-badge" id="enemy-type">ノーマル</span>
            </div>
            <div class="hp-gauge-bg">
              <div class="hp-gauge-fill" id="enemy-hp-bar" style="width: 100%;"></div>
            </div>
            <div style="font-size:8px; text-align:right; margin-top:1px;" id="enemy-hp-val">100 / 100</div>
          </div>

          <div class="sprite-box size-S" id="enemy-sprite-box">
            <div class="sprite-shadow"></div>
            <img id="enemy-img" class="poke-sprite" src="images/gacha/p0019.png" alt="" onerror="this.src='images/slot1.png'">
            <div id="enemy-dmg-pop" class="dmg-indicator" style="display: none;">-0</div>
          </div>
        </div>

        <!-- 下段：相棒スプライト ＆ 相棒情報 -->
        <div class="player-row-layout">
          <div class="sprite-box size-S" id="player-sprite-box">
            <div class="sprite-shadow"></div>
            <img id="player-img" class="poke-sprite" src="images/gacha/p0004.png" alt="" onerror="this.src='images/slot1.png'">
            <div id="player-dmg-pop" class="dmg-indicator" style="display: none;">-0</div>
          </div>

          <div class="player-plate">
            <div class="plate-header">
              <span id="player-name" style="color:#93c5fd;">ヒトカゲ</span>
              <span class="type-badge" id="player-type">ほのお</span>
            </div>
            <div class="hp-gauge-bg">
              <div class="hp-gauge-fill" id="player-hp-bar" style="width: 100%;"></div>
            </div>
            <div style="display:flex; justify-content:space-between; font-size:8px; margin-top:1px;">
              <span>ATK:<b id="player-atk-val">25</b> DEF:<b id="player-def-val">18</b></span>
              <span id="player-hp-val">120 / 120</span>
            </div>
          </div>
        </div>

      </div>

      <!-- ========================================================= -->
      <!-- 📱 下画面：手描きイメージ完全再現 -->
      <!-- ========================================================= -->
      <div class="ds-bottom-screen">
        
        <!-- 通常コマンドビュー -->
        <div class="cmd-view-container" id="cmd-view">
          <!-- ログ枠（タップで全ログ表示） -->
          <div class="msg-window-box" onclick="openHistoryModal()">
            <span id="msg-text">野生のポケモンが現れた！ コマンドを選ぼう！</span>
            <span class="pixel-arrow">▾</span>
          </div>

          <!-- 上段：こうげき / ぼうぎょ -->
          <div class="cmd-row-top">
            <button class="btn-main-act btn-atk" id="btn-atk" onclick="playerAction('atk')">⚔️ こうげき</button>
            <button class="btn-main-act btn-def" id="btn-def" onclick="playerAction('def')">🛡️ ぼうぎょ</button>
          </div>

          <!-- 下段：こうたい / かくせい / Auto -->
          <div class="cmd-row-bottom">
            <button class="btn-sub-small btn-switch" onclick="openSwitchView()">こうたい</button>
            
            <button class="btn-awaken-box" id="btn-awaken" onclick="playerAction('awaken')" disabled>
              <span style="font-size:11px; font-weight:bold;">かくせい</span>
              <div class="seed-track">
                <span class="seed-icon" id="seed-1">🌱</span>
                <span class="seed-icon" id="seed-2">🌱</span>
                <span class="seed-icon" id="seed-3">🌱</span>
                <span class="seed-super-icon" id="seed-super">✨</span>
              </div>
            </button>

            <button class="btn-sub-small btn-auto" id="btn-auto" onclick="toggleAuto()">Auto</button>
          </div>
        </div>

        <!-- 🔄 交代選択ビュー（イメージ図4枚目） -->
        <div class="switch-view-container" id="switch-view" style="display: none;">
          <div style="display:flex; justify-content:space-between; align-items:center; font-size:10px;">
            <span style="color:#fbbf24;">👥 手持ちポケモン（タップで交代）</span>
            <button class="top-btn" onclick="closeSwitchView()">◀ もどる</button>
          </div>
          <div class="party-grid-6" id="switch-party-grid"></div>
        </div>

        <!-- 🎰 スロットオーバーレイ（イメージ図3枚目） -->
        <div class="slot-view-overlay" id="slot-modal" style="display: none;">
          <span style="font-size:11px; color:#fbbf24;">🎰 スロット援護ルーレット！</span>
          <div class="slot-drum-box" id="slot-drum-text">🌱 進化の種</div>
          <button class="btn-slot-push" id="btn-slot-push" onclick="stopSlot()">プッシュ！</button>
        </div>

        <!-- 📜 階層履歴ログモーダル -->
        <div class="history-modal-overlay" id="history-modal" style="display: none;">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <span style="font-size:10px; color:#38bdf8;">📜 戦闘ログ履歴</span>
            <button class="top-btn" onclick="closeHistoryModal()">とじる</button>
          </div>
          <div class="history-log-list" id="history-log-content"></div>
        </div>

      </div>

    </div>

  </div>

  <script src="pokemonData.js"></script>

  <script>
    // タイプ相性マップ
    const TYPE_CHART = {
      'ほのお':   { weak: ['みず', 'じめん', 'いわ'], resist: ['くさ', 'こおり', 'むし', 'はがね'] },
      'みず':     { weak: ['でんき', 'くさ'], resist: ['ほのお', 'みず', 'こおり', 'はがね'] },
      'くさ':     { weak: ['ほのお', 'こおり', 'どく', 'ひこう', 'むし'], resist: ['みず', 'でんき', 'くさ', 'じめん'] },
      'でんき':   { weak: ['じめん'], resist: ['でんき', 'ひこう', 'はがね'] },
      'ノーマル': { weak: ['かくとう'], resist: ['ゴースト'] },
      'ゴースト': { weak: ['ゴースト', 'あく'], resist: ['ノーマル', 'かくとう', 'どく', 'むし'] }
    };

    let coins = parseInt(localStorage.getItem('my_casino_coins') || '1000');
    let party = JSON.parse(localStorage.getItem('my_battle_party') || '["p0004"]');
    let inventory = JSON.parse(localStorage.getItem('my_gacha_inventory') || '{"p0004":1}');
    let levels = JSON.parse(localStorage.getItem('my_partner_levels') || '{}');
    let fainted = JSON.parse(localStorage.getItem('my_fainted_pokemon') || '{}');
    let stage = parseInt(localStorage.getItem('my_tower_stage') || '1');

    // 種ストック
    let seedStock = parseInt(localStorage.getItem('my_battle_seeds') || '0');
    let superSeed = localStorage.getItem('my_super_seed') === 'true';

    let currentPartyIdx = 0;
    let turnCount = 0;
    let isAuto = false;
    let turnInProgress = false;
    let battleLogs = [];

    // プレイヤー状態
    let playerMaxHp = 100, playerHp = 100, playerAtk = 20, playerDef = 15;
    let isDefending = false;
    let isPlayerAwakened = false;

    // 敵状態
    let enemyPokemon = null;
    let enemyMaxHp = 100, enemyHp = 100, enemyAtk = 15, enemyDef = 10;
    let isEnemyBoss = false;

    function getPoke(id) {
      if (typeof POKEMON_DATA !== 'undefined') {
        const found = POKEMON_DATA.find(p => p.id === id);
        if (found) return found;
      }
      return { id, name: 'ポケモン', type: 'ノーマル', size: 'S', img: 'images/gacha/' + id + '.png' };
    }

    function initBattle() {
      const aliveIdx = party.findIndex(id => !fainted[id]);
      if (aliveIdx === -1) {
        alert('手持ちのポケモンが全員ひんしだ！\n育成ジムで回復するか、明日になるのを待とう！');
        window.location.href = 'train.html';
        return;
      }

      currentPartyIdx = aliveIdx;
      loadPlayerStats();
      loadOrSpawnEnemy();
      updateUI();
    }

    function loadPlayerStats() {
      const baseId = party[currentPartyIdx];
      const poke = getPoke(baseId);
      const lv = levels[baseId] || 1;

      let evoMulti = 1.0;
      if (seedStock >= 3) evoMulti = 1.6;
      else if (seedStock >= 1) evoMulti = 1.3;

      playerMaxHp = Math.floor((110 + lv * 18) * evoMulti);
      playerHp = playerMaxHp;
      playerAtk = Math.floor((22 + lv * 5) * evoMulti);
      playerDef = Math.floor((16 + lv * 4) * evoMulti);
      isPlayerAwakened = false;

      document.getElementById('player-name').textContent = `${poke.name} Lv.${lv}`;
      document.getElementById('player-type').textContent = poke.type;
      document.getElementById('player-img').src = poke.img;
      document.getElementById('player-atk-val').textContent = playerAtk;
      document.getElementById('player-def-val').textContent = playerDef;

      // サイズ適用
      const pBox = document.getElementById('player-sprite-box');
      pBox.className = `sprite-box size-${poke.size || 'S'}`;
    }

    // ★ 敵がポータルに戻っても変わらないよう保存＆復元
    function loadOrSpawnEnemy() {
      const savedEnemy = localStorage.getItem('my_current_enemy');
      if (savedEnemy) {
        const data = JSON.parse(savedEnemy);
        if (data.stage === stage) {
          enemyPokemon = getPoke(data.id);
          enemyMaxHp = data.maxHp;
          enemyHp = data.hp;
          enemyAtk = data.atk;
          enemyDef = data.def;
          isEnemyBoss = data.isBoss;
          applyEnemyUI();
          return;
        }
      }
      spawnNewEnemy();
    }

    function spawnNewEnemy() {
      const pool = (typeof POKEMON_DATA !== 'undefined') ? POKEMON_DATA : [];
      // 10・20F等の節目はボス限定
      isEnemyBoss = (stage % 10 === 0);

      if (isEnemyBoss) {
        // メガ・キョダイ・伝説枠
        const bosses = pool.filter(p => p.isBossOnly || p.rarity === 'UR' || p.rarity === 'SSR');
        enemyPokemon = bosses.length > 0 ? bosses[Math.floor(Math.random() * bosses.length)] : pool[0];
      } else {
        // 通常階層：ボス限定・伝説を除外
        const regulars = pool.filter(p => !p.isBossOnly && !p.isLegend);
        enemyPokemon = regulars.length > 0 ? regulars[Math.floor(Math.random() * regulars.length)] : pool[0];
      }

      enemyMaxHp = Math.floor((75 + stage * 22) * (isEnemyBoss ? 2.2 : 1.0));
      enemyHp = enemyMaxHp;
      enemyAtk = Math.floor((14 + stage * 4.2) * (isEnemyBoss ? 1.4 : 1.0));
      enemyDef = Math.floor(10 + stage * 3);

      saveCurrentEnemy();
      applyEnemyUI();
      addLog(isEnemyBoss ? `⚠️ 強敵【${enemyPokemon.name}】が立ち塞がった！` : `野生の【${enemyPokemon.name}】が現れた！`);
    }

    function saveCurrentEnemy() {
      localStorage.setItem('my_current_enemy', JSON.stringify({
        stage,
        id: enemyPokemon.id,
        maxHp: enemyMaxHp,
        hp: enemyHp,
        atk: enemyAtk,
        def: enemyDef,
        isBoss: isEnemyBoss
      }));
    }

    function applyEnemyUI() {
      document.getElementById('stage-text').textContent = `${stage}F` + (isEnemyBoss ? ' 👑' : '');
      document.getElementById('enemy-name').textContent = `${enemyPokemon.name} Lv.${stage}`;
      document.getElementById('enemy-type').textContent = enemyPokemon.type;
      document.getElementById('enemy-img').src = enemyPokemon.img;

      // サイズ適用
      const eBox = document.getElementById('enemy-sprite-box');
      eBox.className = `sprite-box size-${enemyPokemon.size || 'S'}`;
    }

    function updateUI() {
      const pRate = Math.max(0, (playerHp / playerMaxHp) * 100);
      const pBar = document.getElementById('player-hp-bar');
      pBar.style.width = `${pRate}%`;
      pBar.className = `hp-gauge-fill ${pRate < 25 ? 'danger' : pRate < 50 ? 'warning' : ''}`;
      document.getElementById('player-hp-val').textContent = `${Math.max(0, playerHp)} / ${playerMaxHp}`;

      const eRate = Math.max(0, (enemyHp / enemyMaxHp) * 100);
      const eBar = document.getElementById('enemy-hp-bar');
      eBar.style.width = `${eRate}%`;
      eBar.className = `hp-gauge-fill ${eRate < 25 ? 'danger' : eRate < 50 ? 'warning' : ''}`;
      document.getElementById('enemy-hp-val').textContent = `${Math.max(0, enemyHp)} / ${enemyMaxHp}`;

      // 種ストック表示（かくせいボタン内部）
      for (let i = 1; i <= 3; i++) {
        document.getElementById(`seed-${i}`).classList.toggle('active', seedStock >= i);
      }
      document.getElementById('seed-super').classList.toggle('active', superSeed);

      // 覚醒ボタン点灯判定（超進化種所持 ＋ 図鑑でメガ/キョダイ所持）
      const awakenBtn = document.getElementById('btn-awaken');
      const baseId = party[currentPartyIdx];
      const hasAwakenForm = Object.keys(inventory).some(id => id.startsWith(baseId + '-') && inventory[id] > 0);

      if (superSeed && hasAwakenForm && !isPlayerAwakened) {
        awakenBtn.disabled = false;
        awakenBtn.classList.add('ready');
      } else {
        awakenBtn.disabled = true;
        awakenBtn.classList.remove('ready');
      }

      ['btn-atk', 'btn-def'].forEach(id => document.getElementById(id).disabled = turnInProgress);
    }

    function addLog(txt) {
      document.getElementById('msg-text').textContent = txt;
      battleLogs.unshift(`[${stage}F] ${txt}`);
    }

    function showDmgPop(target, dmg, isCrit = false) {
      const popEl = document.getElementById(target === 'enemy' ? 'enemy-dmg-pop' : 'player-dmg-pop');
      popEl.textContent = (isCrit ? '💥会心! -' : '-') + dmg;
      popEl.style.display = 'block';
      popEl.style.animation = 'none';
      void popEl.offsetWidth;
      popEl.style.animation = 'floatDmg 3.5s forwards ease-out';
    }

    function calcTypeMulti(atkType, defType) {
      if (TYPE_CHART[atkType]) {
        if (TYPE_CHART[atkType].weak && TYPE_CHART[atkType].weak.includes(defType)) return 0.7;
        if (TYPE_CHART[atkType].resist && TYPE_CHART[atkType].resist.includes(defType)) return 1.5;
      }
      return 1.0;
    }

    // プレイヤーコマンド
    function playerAction(type) {
      if (turnInProgress) return;
      turnInProgress = true;
      isDefending = (type === 'def');

      const pType = document.getElementById('player-type').textContent;
      const eType = enemyPokemon.type;

      if (type === 'awaken') {
        isPlayerAwakened = true;
        superSeed = false;
        localStorage.setItem('my_super_seed', 'false');
        playerAtk = Math.floor(playerAtk * 2.0);
        playerHp = playerMaxHp;
        addLog('✨ 超進化の種が輝き、真の姿へ覚醒した！');
        updateUI();
        setTimeout(() => {
          turnInProgress = false;
          if (isAuto) playerAction('atk');
        }, 800);
        return;
      }

      if (type === 'atk') {
        const typeMulti = calcTypeMulti(pType, eType);
        let baseDmg = Math.max(5, playerAtk - enemyDef * 0.4);
        let dmg = Math.floor(baseDmg * (Math.random() * 0.3 + 0.85) * typeMulti);

        enemyHp -= dmg;
        saveCurrentEnemy();
        showDmgPop('enemy', dmg);

        let comment = typeMulti > 1.0 ? '（ばつぐん！）' : (typeMulti < 1.0 ? '（いまひとつ…）' : '');
        addLog(`相棒のこうげき！ ${dmg} ダメージ！ ${comment}`);
      } else if (type === 'def') {
        addLog('🛡️ 相棒はしっかりと身を守っている！');
      }

      updateUI();
      if (enemyHp <= 0) { setTimeout(winBattle, 600); return; }

      setTimeout(enemyTurn, 700);
    }

    function enemyTurn() {
      const pType = document.getElementById('player-type').textContent;
      const eType = enemyPokemon.type;
      const typeMulti = calcTypeMulti(eType, pType);

      const isCrit = Math.random() < 0.15;
      let baseDmg = Math.max(4, enemyAtk - playerDef * 0.4);
      let dmg = Math.floor(baseDmg * (Math.random() * 0.3 + 0.85) * typeMulti * (isCrit ? 1.8 : 1.0));

      if (isDefending) dmg = Math.floor(dmg * 0.3); // 防御で70%カット

      playerHp -= dmg;
      saveCurrentEnemy();
      showDmgPop('player', dmg, isCrit);
      addLog(`相手のこうげき！ ${dmg} ダメージ！` + (isCrit ? '（急所に当たった！）' : ''));

      updateUI();

      if (playerHp <= 0) {
        const baseId = party[currentPartyIdx];
        fainted[baseId] = true;
        localStorage.setItem('my_fainted_pokemon', JSON.stringify(fainted));
        addLog(`💀 相棒は たおれてしまった！`);

        setTimeout(() => {
          turnInProgress = false;
          initBattle();
        }, 1200);
        return;
      }

      turnCount++;
      // 3ターンごとにスロット発動
      if (turnCount % 3 === 0) {
        triggerSlot();
      } else {
        turnInProgress = false;
        updateUI();
        if (isAuto) setTimeout(() => playerAction('atk'), 500);
      }
    }

    // ------------------------------------
    // 🎰 スロット処理（手動 / AUTO）
    // ------------------------------------
    let slotTimer;
    const SLOT_REWARDS = ['🌱 進化の種', '💖 HP回復(小)', '💖 HP回復(中)', '💖 HP回復(大)', '⚔️ 攻撃力UP', '✨ 超進化の種'];

    function triggerSlot() {
      if (isAuto) {
        // AUTO時は自動で即時決定してログに流す
        const r = SLOT_REWARDS[Math.floor(Math.random() * SLOT_REWARDS.length)];
        applySlotReward(r);
        addLog(`🎰 スロット自動発動: 【${r}】を獲得！`);
        turnInProgress = false;
        updateUI();
        setTimeout(() => playerAction('atk'), 600);
      } else {
        // 手動時はスロット画面を展開
        document.getElementById('slot-modal').style.display = 'flex';
        let idx = 0;
        slotTimer = setInterval(() => {
          idx = (idx + 1) % SLOT_REWARDS.length;
          document.getElementById('slot-drum-text').textContent = SLOT_REWARDS[idx];
        }, 80);
      }
    }

    function stopSlot() {
      clearInterval(slotTimer);
      const chosen = document.getElementById('slot-drum-text').textContent;
      applySlotReward(chosen);
      document.getElementById('btn-slot-push').disabled = true;

      setTimeout(() => {
        document.getElementById('slot-modal').style.display = 'none';
        document.getElementById('btn-slot-push').disabled = false;
        addLog(`🎰 スロット結果: 【${chosen}】を獲得！`);
        turnInProgress = false;
        updateUI();
      }, 700);
    }

    function applySlotReward(r) {
      if (r === '🌱 進化の種') {
        if (seedStock < 3) seedStock++;
        localStorage.setItem('my_battle_seeds', seedStock);
      } else if (r === '💖 HP回復(小)') {
        playerHp = Math.min(playerMaxHp, playerHp + Math.floor(playerMaxHp * 0.2));
      } else if (r === '💖 HP回復(中)') {
        playerHp = Math.min(playerMaxHp, playerHp + Math.floor(playerMaxHp * 0.4));
      } else if (r === '💖 HP回復(大)') {
        playerHp = playerMaxHp;
      } else if (r === '⚔️ 攻撃力UP') {
        playerAtk += 8;
      } else if (r === '✨ 超進化の種') {
        superSeed = true;
        localStorage.setItem('my_super_seed', 'true');
      }
    }

    function winBattle() {
      const reward = isEnemyBoss ? 300 : 50;
      coins += reward;
      localStorage.setItem('my_casino_coins', coins);
      localStorage.removeItem('my_current_enemy'); // 撃破したので敵データ破棄

      stage++;
      localStorage.setItem('my_tower_stage', stage);

      addLog(`🎉 撃破！ STAGE ${stage - 1} クリア！ +${reward}G`);
      setTimeout(() => {
        turnInProgress = false;
        spawnNewEnemy();
        updateUI();
        if (isAuto) playerAction('atk');
      }, 1000);
    }

    function toggleAuto() {
      isAuto = !isAuto;
      document.getElementById('btn-auto').classList.toggle('active', isAuto);
      document.getElementById('btn-auto').textContent = isAuto ? 'Auto中' : 'Auto';
      if (isAuto && !turnInProgress) playerAction('atk');
    }

    // ------------------------------------
    // 🔄 交代画面（手描き4枚目）
    // ------------------------------------
    function openSwitchView() {
      document.getElementById('cmd-view').style.display = 'none';
      document.getElementById('switch-view').style.display = 'flex';
      const grid = document.getElementById('switch-party-grid');
      grid.innerHTML = '';

      for (let i = 0; i < 6; i++) {
        const id = party[i];
        const card = document.createElement('div');

        if (!id) {
          // 空枠
          card.className = 'party-slot-card empty';
          card.innerHTML = `<span style="font-size:8px; color:#64748b;">(あき枠)</span>`;
        } else {
          const p = getPoke(id);
          const lv = levels[id] || 1;
          const isFaint = !!fainted[id];
          const isCur = (i === currentPartyIdx);

          card.className = `party-slot-card ${isCur ? 'current' : ''} ${isFaint ? 'fainted' : ''}`;
          card.innerHTML = `
            <img src="${p.img}" style="width:26px; height:26px; object-fit:contain;" onerror="this.src='images/slot1.png'">
            <div style="font-size:8px;">
              <b>${p.name}</b> Lv.${lv}<br>
              <span class="type-badge">${p.type}</span> ${isFaint ? '<span style="color:#ef4444;">ひんし</span>' : '<span style="color:#22c55e;">げんき</span>'}
            </div>
          `;

          if (!isFaint && !isCur) {
            card.onclick = () => {
              if (confirm(`【${p.name}】に交代するかい？`)) {
                currentPartyIdx = i;
                closeSwitchView();
                loadPlayerStats();
                addLog(`行けっ！ 【${p.name}】！`);
                updateUI();
                setTimeout(enemyTurn, 600);
              }
            };
          }
        }
        grid.appendChild(card);
      }
    }

    function closeSwitchView() {
      document.getElementById('switch-view').style.display = 'none';
      document.getElementById('cmd-view').style.display = 'flex';
    }

    // 📜 履歴ログ
    function openHistoryModal() {
      document.getElementById('history-modal').style.display = 'flex';
      const container = document.getElementById('history-log-content');
      container.innerHTML = battleLogs.length > 0 ? battleLogs.map(l => `<div>• ${l}</div>`).join('') : 'まだログはありません。';
    }

    function closeHistoryModal() {
      document.getElementById('history-modal').style.display = 'none';
    }

    window.addEventListener('DOMContentLoaded', initBattle);
  </script>
</body>
</html>
