<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ポケモンDSタワーバトル | コレクションスタジオ</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f172a;
    }

    body {
      background: #1e1b4b;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 4px 6px;
      padding-top: calc(4px + env(safe-area-inset-top));
      padding-bottom: calc(4px + env(safe-area-inset-bottom));
    }

    .container {
      width: 100%;
      max-width: 420px;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 4px;
      justify-content: space-between;
      position: relative;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      padding: 0 4px;
    }
    .top-btn {
      color: #ffffff;
      text-decoration: none;
      font-size: 10px;
      font-weight: bold;
      background: rgba(255, 255, 255, 0.15);
      padding: 3px 8px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      cursor: pointer;
    }

    .ds-body {
      flex: 1 1 0%;
      min-height: 0;
      background: #334155;
      border-radius: 16px;
      padding: 6px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5), inset 0 2px 3px rgba(255,255,255,0.3);
      border: 2px solid #475569;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* 上画面 */
    .ds-top-screen {
      flex: 1.15;
      min-height: 0;
      background: linear-gradient(180deg, #38bdf8 0%, #818cf8 40%, #1e293b 85%, #0f172a 100%);
      border-radius: 10px;
      border: 2px solid #0f172a;
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.6);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 6px;
    }

    .enemy-plate {
      align-self: flex-start;
      background: rgba(15, 23, 42, 0.85);
      border: 1.5px solid #94a3b8;
      border-radius: 6px 14px 6px 14px;
      padding: 4px 8px;
      width: 170px;
      box-shadow: 0 3px 6px rgba(0,0,0,0.4);
      z-index: 5;
    }
    .enemy-sprite-box {
      position: absolute;
      right: 18px;
      top: 24px;
      width: 100px;
      height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }
    .enemy-sprite {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.6));
    }

    .player-sprite-box {
      position: absolute;
      left: 12px;
      bottom: 24px;
      width: 110px;
      height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 3;
    }
    .player-sprite {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 6px 12px rgba(0,0,0,0.7));
    }

    .player-plate {
      align-self: flex-end;
      background: rgba(15, 23, 42, 0.85);
      border: 1.5px solid #38bdf8;
      border-radius: 14px 6px 14px 6px;
      padding: 4px 8px;
      width: 180px;
      box-shadow: 0 3px 6px rgba(0,0,0,0.4);
      z-index: 5;
    }
    .plate-name-row {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      font-weight: 900;
      margin-bottom: 2px;
    }
    .hp-bar-bg {
      width: 100%;
      height: 6px;
      background: #334155;
      border-radius: 3px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .hp-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #22c55e, #16a34a);
      transition: width 0.25s ease;
    }
    .sp-bar-fill {
      height: 3px;
      background: linear-gradient(90deg, #f59e0b, #ec4899);
      width: 0%;
      transition: width 0.2s ease;
    }

    .battle-msg-bar {
      position: absolute;
      bottom: 2px;
      left: 6px;
      right: 6px;
      background: rgba(0, 0, 0, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      padding: 3px 6px;
      font-size: 9px;
      color: #fff;
      font-weight: bold;
      z-index: 10;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 下画面 */
    .ds-bottom-screen {
      flex: 1;
      min-height: 0;
      background: #0f172a;
      border-radius: 10px;
      border: 2px solid #0f172a;
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.6);
      padding: 6px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 4px;
    }

    .touch-sub-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255,255,255,0.06);
      border-radius: 8px;
      padding: 3px 8px;
      font-size: 10px;
    }

    .touch-cmd-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 5px;
      flex: 1;
    }
    .touch-btn {
      border-radius: 10px;
      font-size: 12px;
      font-weight: 900;
      color: #fff;
      border: 1.5px solid rgba(255, 255, 255, 0.3);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 3px 0 rgba(0,0,0,0.4);
    }
    .touch-btn:active { transform: translateY(2px); }
    .touch-btn:disabled { opacity: 0.35; cursor: not-allowed; }

    .btn-fight { background: linear-gradient(135deg, #ef4444, #b91c1c); }
    .btn-awaken { background: linear-gradient(135deg, #ec4899, #be185d); }
    .btn-def   { background: linear-gradient(135deg, #3b82f6, #1d4ed8); }
    .btn-auto  { background: linear-gradient(135deg, #10b981, #047857); }
    .btn-auto.active { background: linear-gradient(135deg, #f59e0b, #d97706); }
  </style>
</head>
<body>

  <div class="container">
    
    <div class="top-bar">
      <a href="index.html" class="top-btn">◀ ポータル</a>
      <span style="font-size: 11px; font-weight: bold; color: #cbd5e1;">POKÉMON BATTLE</span>
      <a href="train.html" class="top-btn" style="background:#10b981;">🌱 育成ジム</a>
    </div>

    <div class="ds-body">

      <!-- 上画面 -->
      <div class="ds-top-screen">
        <div class="enemy-plate">
          <div class="plate-name-row">
            <span id="enemy-name" style="color:#fca5a5;">Lv.1 コラッタ</span>
            <span id="enemy-form-badge" style="color:#f43f5e; font-size:8px;"></span>
          </div>
          <div class="hp-bar-bg">
            <div class="hp-bar-fill" id="enemy-hp-bar" style="width: 100%;"></div>
          </div>
        </div>

        <div class="enemy-sprite-box">
          <img id="enemy-img" class="enemy-sprite" src="images/gacha/p0019.png" alt="" onerror="this.src='images/slot1.png'">
        </div>

        <div class="player-sprite-box">
          <img id="player-img" class="player-sprite" src="images/gacha/p0004.png" alt="" onerror="this.src='images/slot1.png'">
        </div>

        <div class="player-plate">
          <div class="plate-name-row">
            <span id="player-name" style="color:#93c5fd;">Lv.1 ヒトカゲ</span>
            <span id="player-hp-num" style="font-size:9px;">120/120</span>
          </div>
          <div class="hp-bar-bg">
            <div class="hp-bar-fill" id="player-hp-bar" style="width: 100%;"></div>
          </div>
          <div class="hp-bar-bg" style="height:3px; margin-top:2px;">
            <div class="sp-bar-fill" id="player-sp-bar"></div>
          </div>
        </div>

        <div class="battle-msg-bar" id="battle-msg">野生のポケモンが現れた！</div>
      </div>

      <!-- 下画面 -->
      <div class="ds-bottom-screen">
        <div class="touch-sub-bar">
          <div>階層: <b id="stage-disp" style="color:#fbbf24;">1F</b> | 残り: <b id="remain-disp" style="color:#38bdf8;">6/6</b> 体</div>
          <div>🪙 <b id="coin-disp" style="color:#fbbf24;">1,000</b></div>
        </div>

        <div class="touch-cmd-grid">
          <button class="touch-btn btn-fight" id="btn-atk" onclick="playerAction('atk')">
            <span>⚔️ たたかう</span>
          </button>
          <button class="touch-btn btn-awaken" id="btn-awaken" onclick="playerAction('awaken')" disabled>
            <span id="awaken-btn-label">✨ 覚醒準備中</span>
          </button>
          <button class="touch-btn btn-def" id="btn-def" onclick="playerAction('def')">
            <span>🛡️ ぼうぎょ</span>
          </button>
          <button class="touch-btn btn-auto" id="btn-auto" onclick="toggleAuto()">
            <span id="auto-label">🤖 AUTO</span>
          </button>
        </div>
      </div>

    </div>

  </div>

  <script src="pokemonData.js"></script>

  <script>
    let coins = parseInt(localStorage.getItem('my_casino_coins') || '1000');
    let party = JSON.parse(localStorage.getItem('my_battle_party') || '["p0004"]');
    let forms = JSON.parse(localStorage.getItem('my_pokemon_forms') || '{}');
    let levels = JSON.parse(localStorage.getItem('my_partner_levels') || '{}');
    let fainted = JSON.parse(localStorage.getItem('my_fainted_pokemon') || '{}');
    let stage = parseInt(localStorage.getItem('my_tower_stage') || '1');

    // 日付チェック（翌日自動回復）
    const today = new Date().toDateString();
    const lastDate = localStorage.getItem('my_last_battle_date');
    if (lastDate !== today) {
      fainted = {}; // ひんしリセット
      localStorage.setItem('my_fainted_pokemon', JSON.stringify(fainted));
      localStorage.setItem('my_last_battle_date', today);
    }

    let currentPartyIdx = 0;
    let isAuto = false;
    let turnInProgress = false;

    // 現在の出撃ポケモン
    let playerMaxHp = 100;
    let playerHp = 100;
    let playerAtk = 20;
    let playerSp = 0;
    let isDefending = false;

    // 敵
    let enemyPokemon = null;
    let enemyHp = 100;
    let enemyMaxHp = 100;
    let enemyAtk = 15;
    let isEnemyBoss = false;

    function getPoke(id) {
      if (typeof POKEMON_DATA !== 'undefined') {
        const found = POKEMON_DATA.find(p => p.id === id);
        if (found) return found;
      }
      return { id, name: 'ポケモン', img: 'images/gacha/' + id + '.png' };
    }

    function initBattle() {
      // 生存している次のポケモンを探す
      const aliveIdx = party.findIndex(baseId => !fainted[baseId]);
      if (aliveIdx === -1) {
        alert('手持ちのポケモンが全員ひんしだ！\n育成ジムでアイテムを使うか、明日になるのを待とう！');
        window.location.href = 'train.html';
        return;
      }

      currentPartyIdx = aliveIdx;
      const baseId = party[currentPartyIdx];
      const formId = forms[baseId] || baseId;
      const poke = getPoke(formId);
      const lv = levels[baseId] || 1;

      playerMaxHp = 100 + (lv * 20);
      playerHp = playerMaxHp;
      playerAtk = 22 + (lv * 6);
      playerSp = 0;

      document.getElementById('player-name').textContent = `Lv.${lv} ${poke.name}`;
      document.getElementById('player-img').src = poke.img;

      spawnEnemy();
      updateUI();
    }

    function spawnEnemy() {
      const pool = (typeof POKEMON_DATA !== 'undefined') ? POKEMON_DATA : [{ id: 'p0019', name: 'コラッタ', img: 'images/gacha/p0019.png' }];
      enemyPokemon = pool[Math.floor(Math.random() * pool.length)];
      isEnemyBoss = (stage % 5 === 0);

      enemyMaxHp = Math.floor((80 + (stage * 24)) * (isEnemyBoss ? 2.0 : 1.0));
      enemyHp = enemyMaxHp;
      enemyAtk = Math.floor((14 + (stage * 4.5)) * (isEnemyBoss ? 1.3 : 1.0));

      document.getElementById('stage-disp').textContent = `${stage}F` + (isEnemyBoss ? ' 👑' : '');
      document.getElementById('enemy-name').textContent = `Lv.${stage} ${enemyPokemon.name}`;
      document.getElementById('enemy-img').src = enemyPokemon.img;
      document.getElementById('enemy-form-badge').textContent = isEnemyBoss ? '【強敵】' : '';
      showMsg(isEnemyBoss ? `⚠️ 強敵【${enemyPokemon.name}】出現！` : `野生の【${enemyPokemon.name}】が現れた！`);
    }

    function updateUI() {
      document.getElementById('coin-disp').textContent = coins.toLocaleString();
      const aliveCount = party.filter(id => !fainted[id]).length;
      document.getElementById('remain-disp').textContent = `${aliveCount}/${party.length}`;

      document.getElementById('player-hp-bar').style.width = `${Math.max(0, (playerHp / playerMaxHp) * 100)}%`;
      document.getElementById('player-hp-num').textContent = `${Math.max(0, playerHp)}/${playerMaxHp}`;
      document.getElementById('player-sp-bar').style.width = `${Math.min(100, playerSp)}%`;

      document.getElementById('enemy-hp-bar').style.width = `${Math.max(0, (enemyHp / enemyMaxHp) * 100)}%`;
      document.getElementById('btn-awaken').disabled = (playerSp < 100);
      ['btn-atk', 'btn-def'].forEach(id => document.getElementById(id).disabled = turnInProgress);
    }

    function showMsg(txt) {
      document.getElementById('battle-msg').textContent = txt;
    }

    function playerAction(type) {
      if (turnInProgress) return;
      turnInProgress = true;
      isDefending = (type === 'def');

      if (type === 'awaken') {
        playerSp = 0;
        const dmg = Math.floor(enemyHp * 0.8) + 40;
        enemyHp -= dmg;
        showMsg(`⚡ 覚醒必殺技！ ${dmg} の大ダメージ！`);
        updateUI();
        if (enemyHp <= 0) { setTimeout(winBattle, 600); return; }
        setTimeout(enemyTurn, 650);
        return;
      }

      if (type === 'atk') {
        const dmg = Math.floor(playerAtk * (Math.random() * 0.3 + 0.85));
        enemyHp -= dmg;
        playerSp = Math.min(100, playerSp + 35);
        showMsg(`相棒の攻撃！ ${dmg} のダメージ！`);
      } else if (type === 'def') {
        showMsg(`🛡️ 相棒は身を守っている！`);
      }

      updateUI();
      if (enemyHp <= 0) { setTimeout(winBattle, 600); return; }
      setTimeout(enemyTurn, 650);
    }

    function enemyTurn() {
      let dmg = Math.floor(enemyAtk * (Math.random() * 0.3 + 0.85));
      if (isDefending) dmg = Math.floor(dmg * 0.4);

      playerHp -= dmg;
      showMsg(`敵の攻撃！ ${dmg} のダメージを受けた！`);
      updateUI();

      if (playerHp <= 0) {
        // ひんし判定
        const currentBaseId = party[currentPartyIdx];
        fainted[currentBaseId] = true;
        localStorage.setItem('my_fainted_pokemon', JSON.stringify(fainted));
        showMsg(`💀 相棒は たおれてしまった！`);

        setTimeout(() => {
          initBattle(); // 次のポケモンへ交代
        }, 1200);
        return;
      }

      turnInProgress = false;
      updateUI();
      if (isAuto) setTimeout(() => playerAction(playerSp >= 100 ? 'awaken' : 'atk'), 500);
    }

    function winBattle() {
      const reward = isEnemyBoss ? 300 : 60;
      coins += reward;
      localStorage.setItem('my_casino_coins', coins);
      stage++;
      localStorage.setItem('my_tower_stage', stage);

      showMsg(`🎉 勝利！ STAGE ${stage - 1} クリア！ +${reward}G`);
      setTimeout(() => {
        turnInProgress = false;
        spawnEnemy();
        updateUI();
        if (isAuto) playerAction('atk');
      }, 1100);
    }

    function toggleAuto() {
      isAuto = !isAuto;
      document.getElementById('btn-auto').classList.toggle('active', isAuto);
      document.getElementById('auto-label').textContent = isAuto ? '🤖 AUTO中' : '🤖 AUTO';
      if (isAuto && !turnInProgress) playerAction(playerSp >= 100 ? 'awaken' : 'atk');
    }

    window.addEventListener('DOMContentLoaded', initBattle);
  </script>
</body>
</html>
