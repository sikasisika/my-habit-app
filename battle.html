<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ポケモンタワーバトル | DSスタイル</title>

  <!-- レトロドットフォント -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'DotGothic16', sans-serif !important;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #090d16;
    }

    body {
      background: #0f172a;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 6px;
      padding-top: calc(6px + env(safe-area-inset-top));
      padding-bottom: calc(6px + env(safe-area-inset-bottom));
      user-select: none;
      -webkit-user-select: none;
    }

    .container {
      width: 100%;
      max-width: 420px;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 6px;
      position: relative;
    }

    /* 最上部ヘッダー */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      padding: 0 4px;
      height: 30px;
      position: relative;
      z-index: 99999 !important;
      pointer-events: auto !important;
    }
    .top-btn {
      color: #ffffff !important;
      text-decoration: none !important;
      font-size: 11px;
      font-weight: bold;
      background: rgba(255, 255, 255, 0.22);
      padding: 5px 10px;
      border-radius: 6px;
      border: 1.5px solid rgba(255, 255, 255, 0.45);
      cursor: pointer !important;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .top-btn:active { transform: scale(0.92); }

    /* DS本体フレーム */
    .ds-body {
      flex: 1 1 0%;
      min-height: 0;
      background: #1e293b;
      border-radius: 12px;
      padding: 6px;
      border: 2px solid #334155;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* ------------------------------------ */
    /* 📺 上画面：バトルフィールド（完全1:1） */
    /* ------------------------------------ */
    .ds-top-screen {
      flex: 1 1 0%;
      min-height: 0;
      background: linear-gradient(180deg, #38bdf8 0%, #6366f1 45%, #1e1b4b 85%, #0f172a 100%);
      border-radius: 8px;
      border: 2px solid #0f172a;
      position: relative;
      overflow: hidden;
    }

    /* 相手情報プレート */
    .enemy-plate {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(15, 23, 42, 0.92);
      border: 1.5px solid #f87171;
      border-radius: 6px;
      padding: 4px 8px;
      width: 150px;
      z-index: 10;
    }

    /* スプライト枠 */
    .enemy-sprite-box {
      position: absolute;
      top: 10px;
      right: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
    }
    .player-sprite-box {
      position: absolute;
      bottom: 15px;
      left: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
    }

    /* 相棒情報プレート */
    .player-plate {
      position: absolute;
      bottom: 10px;
      right: 10px;
      background: rgba(15, 23, 42, 0.92);
      border: 1.5px solid #38bdf8;
      border-radius: 6px;
      padding: 4px 8px;
      width: 160px;
      z-index: 10;
    }

    .plate-header {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      margin-bottom: 2px;
    }

    /* タイプ別カラーバッジ */
    .type-badge {
      font-size: 8px;
      font-weight: 900;
      padding: 1px 5px;
      border-radius: 4px;
      color: #fff;
    }
    .type-ほのお   { background: linear-gradient(135deg, #ef4444, #ea580c); }
    .type-みず     { background: linear-gradient(135deg, #3b82f6, #0284c7); }
    .type-くさ     { background: linear-gradient(135deg, #22c55e, #16a34a); }
    .type-でんき   { background: linear-gradient(135deg, #eab308, #ca8a04); color: #000 !important; }
    .type-ノーマル { background: linear-gradient(135deg, #94a3b8, #64748b); }
    .type-ゴースト { background: linear-gradient(135deg, #8b5cf6, #6d28d9); }
    .type-むし     { background: linear-gradient(135deg, #84cc16, #65a30d); }
    .type-ひこう   { background: linear-gradient(135deg, #38bdf8, #0ea5e9); }
    .type-こおり   { background: linear-gradient(135deg, #06b6d4, #0891b2); }
    .type-エスパー { background: linear-gradient(135deg, #ec4899, #db2777); }
    .type-かくとう { background: linear-gradient(135deg, #b91c1c, #991b1b); }
    .type-どく     { background: linear-gradient(135deg, #9333ea, #7e22ce); }
    .type-じめん   { background: linear-gradient(135deg, #d97706, #b45309); }
    .type-いわ     { background: linear-gradient(135deg, #78716c, #57534e); }
    .type-ドラゴン { background: linear-gradient(135deg, #4f46e5, #3730a3); }
    .type-はがね   { background: linear-gradient(135deg, #64748b, #475569); }
    .type-あく     { background: linear-gradient(135deg, #334155, #1e293b); }
    .type-フェアリー { background: linear-gradient(135deg, #f472b6, #db2777); }

    .hp-gauge-bg {
      width: 100%;
      height: 6px;
      background: #111827;
      border-radius: 3px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .hp-gauge-fill {
      height: 100%;
      background: linear-gradient(90deg, #22c55e, #16a34a);
      transition: width 0.25s ease;
    }
    .hp-gauge-fill.warning { background: #eab308; }
    .hp-gauge-fill.danger { background: #ef4444; }

    .poke-sprite {
      object-fit: contain !important;
      filter: drop-shadow(0 6px 12px rgba(0,0,0,0.65));
      transition: transform 0.15s ease, filter 0.3s ease;
      display: block;
    }

    /* 👑 敵のメガ・キョダイ常時キラキラオーラ */
    .aura-mega {
      animation: megaGlow 1.8s infinite alternate ease-in-out;
    }
    @keyframes megaGlow {
      0% { filter: drop-shadow(0 0 8px #f43f5e) drop-shadow(0 0 16px #38bdf8); }
      100% { filter: drop-shadow(0 0 16px #ec4899) drop-shadow(0 0 28px #a855f7); }
    }
    .aura-kyodai {
      animation: kyodaiGlow 1.5s infinite alternate ease-in-out;
    }
    @keyframes kyodaiGlow {
      0% { filter: drop-shadow(0 0 12px #ef4444) drop-shadow(0 0 24px #991b1b); }
      100% { filter: drop-shadow(0 0 24px #ff0055) drop-shadow(0 0 36px #ff0000); }
    }

    /* ✨ 進化・覚醒エフェクト用オーバーレイ */
    .evo-flash-overlay {
      position: absolute;
      inset: 0;
      opacity: 0;
      pointer-events: none;
      z-index: 50;
    }
    .flash-silver { animation: silverFlash 0.7s ease-out forwards; }
    @keyframes silverFlash {
      0% { background: rgba(226, 232, 240, 0.9); opacity: 1; }
      100% { background: transparent; opacity: 0; }
    }
    .flash-gold { animation: goldFlash 0.8s ease-out forwards; }
    @keyframes goldFlash {
      0% { background: rgba(251, 191, 36, 0.95); opacity: 1; }
      100% { background: transparent; opacity: 0; }
    }
    .flash-rainbow { animation: rainbowFlash 0.9s ease-out forwards; }
    @keyframes rainbowFlash {
      0% { background: linear-gradient(45deg, rgba(236,72,153,0.9), rgba(56,189,248,0.9), rgba(250,204,21,0.9)); opacity: 1; }
      100% { background: transparent; opacity: 0; }
    }
    .flash-red { animation: redFlash 0.9s ease-out forwards; }
    @keyframes redFlash {
      0% { background: rgba(239, 68, 68, 0.95); opacity: 1; }
      100% { background: transparent; opacity: 0; }
    }

    /* 📊 上画面：半透明コンティニュー・リザルトオーバーレイ */
    .top-result-overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.82);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
      gap: 10px;
      z-index: 60;
    }
    .result-card {
      width: 90%;
      background: rgba(30, 41, 59, 0.9);
      border: 2px solid #fbbf24;
      border-radius: 10px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 11px;
    }
    .result-row {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px dashed rgba(255, 255, 255, 0.2);
      padding-bottom: 4px;
    }

    /* 階層選択オーバーレイ */
    .floor-select-overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.95);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      padding: 10px;
      gap: 8px;
      z-index: 70;
    }
    .floor-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      flex: 1;
      overflow-y: auto;
    }
    .floor-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1.5px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      border-radius: 6px;
      padding: 8px 4px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }
    .floor-btn:active { transform: scale(0.95); }
    .floor-btn.locked { opacity: 0.3; cursor: not-allowed; border-color: #475569; }

    /* アクションアニメ */
    .anim-atk-player { animation: pAtkAnim 0.35s ease forwards; }
    @keyframes pAtkAnim {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(45px, -30px) scale(1.1); }
      100% { transform: translate(0, 0) scale(1); }
    }
    .anim-atk-enemy { animation: eAtkAnim 0.35s ease forwards; }
    @keyframes eAtkAnim {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(-45px, 30px) scale(1.1); }
      100% { transform: translate(0, 0) scale(1); }
    }
    .anim-hit { animation: hitShake 0.4s ease forwards; }
    @keyframes hitShake {
      0% { transform: translate(0, 0); filter: brightness(1) drop-shadow(0 0 10px #ef4444); }
      20% { transform: translate(-6px, 4px); filter: brightness(2) drop-shadow(0 0 12px #ef4444); }
      40% { transform: translate(6px, -4px); }
      60% { transform: translate(-4px, 2px); }
      80% { transform: translate(4px, -2px); }
      100% { transform: translate(0, 0); filter: brightness(1); }
    }

    .dmg-indicator {
      position: absolute;
      top: -10px;
      font-size: 18px;
      font-weight: 900;
      color: #ff3344;
      text-shadow: 0 0 4px #000, 0 0 8px #000;
      animation: floatDmg 3.5s forwards ease-out;
      z-index: 20;
      pointer-events: none;
    }
    @keyframes floatDmg {
      0% { opacity: 0; transform: translateY(4px); }
      15% { opacity: 1; transform: translateY(0); }
      80% { opacity: 1; transform: translateY(-3px); }
      100% { opacity: 0; transform: translateY(-8px); }
    }

    /* ------------------------------------ */
    /* 📱 下画面：コマンド（完全1:1・余白ゼロ） */
    /* ------------------------------------ */
    .ds-bottom-screen {
      flex: 1 1 0%;
      min-height: 0;
      background: #0f172a;
      border-radius: 8px;
      border: 2px solid #0f172a;
      padding: 6px;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .cmd-view-container {
      display: flex;
      flex-direction: column;
      height: 100%;
      justify-content: space-between;
      gap: 6px;
    }

    /* ログ枠 */
    .msg-window-box {
      height: 42px;
      flex-shrink: 0;
      background: rgba(0, 0, 0, 0.65);
      border: 1.5px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      padding: 4px 10px;
      font-size: 11px;
      line-height: 1.4;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #f1f5f9;
      cursor: pointer;
    }
    .pixel-arrow {
      font-size: 13px;
      color: #38bdf8;
      animation: arrowBounce 0.8s infinite alternate ease-in-out;
      flex-shrink: 0;
      margin-left: 6px;
    }
    @keyframes arrowBounce {
      0% { transform: translateY(0); }
      100% { transform: translateY(3px); }
    }

    /* 上段：こうげき / ぼうぎょ */
    .cmd-row-top {
      flex: 1.5;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .btn-main-act {
      height: 100%;
      border-radius: 8px;
      border: 1.5px solid rgba(255, 255, 255, 0.35);
      color: #fff;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 1px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 0 rgba(0,0,0,0.4);
    }
    .btn-main-act:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,0.4); }
    .btn-main-act:disabled { opacity: 0.3; cursor: not-allowed; }

    .btn-atk { background: linear-gradient(135deg, #f87171, #dc2626); }
    .btn-def { background: linear-gradient(135deg, #60a5fa, #2563eb); }

    /* 下段：こうたい / しんか・かくせい / Auto */
    .cmd-row-bottom {
      flex: 1;
      display: flex;
      gap: 6px;
      align-items: stretch;
    }
    .btn-sub-small {
      width: 65px;
      height: 100%;
      border-radius: 8px;
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      font-size: 11px;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 4px 0 rgba(0,0,0,0.4);
    }
    .btn-sub-small:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,0.4); }
    .btn-switch { background: #475569; }
    .btn-auto { background: #059669; }
    .btn-auto.active { background: #d97706; }

    /* 進化・覚醒ボタン */
    .btn-evo-awaken {
      flex: 1;
      height: 100%;
      border-radius: 8px;
      border: 2px solid #64748b;
      background: rgba(255, 255, 255, 0.05);
      color: #cbd5e1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 0 rgba(0,0,0,0.4);
    }
    .btn-evo-awaken:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,0.4); }
    .btn-evo-awaken:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn-evo-awaken.ready-evo {
      background: linear-gradient(135deg, #10b981, #059669);
      border-color: #34d399;
      color: #fff;
      animation: pulseEvo 1.5s infinite;
    }
    .btn-evo-awaken.ready-awaken {
      background: linear-gradient(135deg, #ec4899, #be185d);
      border-color: #f43f5e;
      color: #fff;
      animation: pulseAwaken 1.5s infinite;
    }
    @keyframes pulseEvo { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.02); } }
    @keyframes pulseAwaken { 0%, 100% { filter: hue-rotate(0deg); } 100% { filter: hue-rotate(360deg); } }

    .seed-track {
      display: flex;
      gap: 5px;
      font-size: 11px;
      margin-top: 2px;
    }
    .seed-icon { opacity: 0.25; filter: grayscale(1); }
    .seed-icon.active { opacity: 1; filter: grayscale(0); text-shadow: 0 0 6px #4ade80; }
    .seed-super-icon { opacity: 0.25; filter: grayscale(1); }
    .seed-super-icon.active { opacity: 1; filter: grayscale(0); animation: pulseAwaken 1.5s infinite linear; }

    /* 交代画面 */
    .switch-view-container {
      display: flex;
      flex-direction: column;
      height: 100%;
      justify-content: space-between;
      gap: 6px;
    }
    .party-grid-6 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: repeat(3, 1fr);
      gap: 6px;
      flex: 1;
    }
    .party-slot-card {
      background: rgba(0, 0, 0, 0.45);
      border: 1.5px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      padding: 4px 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }
    .party-slot-card.empty { border: 1.5px dashed rgba(255,255,255,0.2); background: transparent; cursor: default; justify-content: center; }
    .party-slot-card.current { border-color: #38bdf8; background: rgba(56, 189, 248, 0.15); box-shadow: 0 0 8px rgba(56, 189, 248, 0.3); }
    .party-slot-card.fainted { border-color: #ef4444; opacity: 0.45; cursor: not-allowed; }

    /* スロット画面 */
    .slot-view-overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.95);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 10px;
      z-index: 30;
    }
    .slot-drum-box {
      width: 170px;
      height: 48px;
      background: linear-gradient(180deg, #1e1b4b 0%, #312e81 50%, #1e1b4b 100%);
      border: 2px solid #fbbf24;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: bold;
      color: #fbbf24;
    }
    .btn-slot-push {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      border: 2px solid #fff;
      color: #000;
      font-size: 12px;
      font-weight: 900;
      padding: 6px 20px;
      border-radius: 20px;
      cursor: pointer;
    }

    /* 履歴ログモーダル */
    .history-modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(2, 6, 23, 0.95);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      padding: 8px;
      gap: 6px;
      z-index: 40;
    }
    .history-log-list {
      flex: 1;
      overflow-y: auto;
      background: rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px;
      padding: 6px;
      font-size: 10px;
      line-height: 1.5;
      color: #cbd5e1;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- 最上部バー -->
    <div class="top-bar">
      <a href="index.html" class="top-btn" onclick="window.location.href='index.html'; return false;">◀ ポータル</a>
      <span style="font-size: 11px; color:#cbd5e1; cursor:pointer;" onclick="openFloorSelectModal()">階層: <b id="stage-text" style="color:#fbbf24;">1F</b> ▾</span>
      <button class="top-btn" style="background:#ef4444; border-color:#f87171;" onclick="openResultModal(false)">🚩 帰還確認</button>
    </div>

    <div class="ds-body">

      <!-- ========================================================= -->
      <!-- 📺 上画面：バトルフィールド（50%） -->
      <!-- ========================================================= -->
      <div class="ds-top-screen">
        <div id="evo-flash" class="evo-flash-overlay"></div>

        <!-- 相手プレート -->
        <div class="enemy-plate">
          <div class="plate-header">
            <span id="enemy-name" style="color:#fca5a5;">コラッタ</span>
            <span class="type-badge" id="enemy-type">ノーマル</span>
          </div>
          <div class="hp-gauge-bg">
            <div class="hp-gauge-fill" id="enemy-hp-bar" style="width: 100%;"></div>
          </div>
          <div style="font-size:8px; text-align:right; margin-top:1px;" id="enemy-hp-val">100 / 100</div>
        </div>

        <!-- 相手スプライト -->
        <div class="enemy-sprite-box" id="enemy-sprite-box">
          <img id="enemy-img" class="poke-sprite" src="images/gacha/p0019.png" alt="" onerror="this.src='images/slot1.png'">
          <div id="enemy-dmg-pop" class="dmg-indicator" style="display: none;">-0</div>
        </div>

        <!-- 相棒スプライト -->
        <div class="player-sprite-box" id="player-sprite-box">
          <img id="player-img" class="poke-sprite" src="images/gacha/p0004.png" alt="" onerror="this.src='images/slot1.png'">
          <div id="player-dmg-pop" class="dmg-indicator" style="display: none;">-0</div>
        </div>

        <!-- 相棒プレート -->
        <div class="player-plate">
          <div class="plate-header">
            <span id="player-name" style="color:#93c5fd;">ヒトカゲ</span>
            <span class="type-badge" id="player-type">ほのお</span>
          </div>
          <div class="hp-gauge-bg">
            <div class="hp-gauge-fill" id="player-hp-bar" style="width: 100%;"></div>
          </div>
          <div style="display:flex; justify-content:space-between; font-size:8px; margin-top:1px;">
            <span>ATK:<b id="player-atk-val">25</b> DEF:<b id="player-def-val">18</b></span>
            <span id="player-hp-val">120 / 120</span>
          </div>
        </div>

        <!-- 📊 上画面：半透明コンティニュー・リザルト画面 -->
        <div class="top-result-overlay" id="top-result-overlay" style="display: none;">

    function getAwakenCandidates(id) {

      if (typeof POKEMON_DATA !== 'undefined') {
        const found = POKEMON_DATA.find(p => p.id === id);

      }
      return { id, name: 'ポケモン', subName: '', type: 'ノーマル', size: 'S', img: 'images/gacha/' + id + '.png' };
    }

    function validateParty() {
      const validParty = [];
      party.forEach(id => {
        const baseId = getBasePokemonId(id);
        if (inventory[baseId] > 0) {
          validParty.push(baseId);
        }
      });
      if (validParty.length === 0) validParty.push('p0004');
      party = validParty;
      localStorage.setItem('my_battle_party', JSON.stringify(party));

      // 初回なら partyForms を初期化
      if (partyForms.length !== party.length) {
        partyForms = [...party];
      }

      currentPartyIdx = party.findIndex(id => !fainted[id]);
      if (currentPartyIdx === -1) {
        openResultModal(true); // 全滅時リザルト表示
        return false;
      }
      return true;
    }

    function initBattle() {
      if (!validateParty()) return;
      loadPlayerStats();
      loadOrSpawnEnemy();
      updateUI();
    }

    function loadPlayerStats() {
      const currentFormId = partyForms[currentPartyIdx] || party[currentPartyIdx];
      const poke = getPoke(currentFormId);
      const baseId = getBasePokemonId(currentFormId);
      const lv = levels[baseId] || 1;

      let statMulti = 1.0;
      if (currentFormId.includes('-z')) statMulti = 2.8;
      else if (currentFormId.includes('-k')) statMulti = 2.5;
      else if (currentFormId.includes('-m') || currentFormId.includes('-x') || currentFormId.includes('-y')) statMulti = 2.2;
      else if (poke.size === 'L') statMulti = 1.7;
      else if (poke.size === 'M') statMulti = 1.35;

      playerMaxHp = Math.floor((110 + lv * 20) * statMulti);
      playerHp = playerMaxHp;
      playerAtk = Math.floor((22 + lv * 5) * statMulti);
      playerDef = Math.floor((16 + lv * 4) * statMulti);

      const titleName = poke.subName ? `${poke.name} (${poke.subName})` : poke.name;
      document.getElementById('player-name').textContent = `${titleName} Lv.${lv}`;
      
      const pTypeEl = document.getElementById('player-type');
      pTypeEl.textContent = poke.type;
      pTypeEl.className = `type-badge type-${poke.type}`;

      const pImg = document.getElementById('player-img');
      pImg.src = poke.img;
      const px = getSizePx(poke.size || 'S');
      pImg.style.width = px + 'px';
      pImg.style.height = px + 'px';

      document.getElementById('player-atk-val').textContent = playerAtk;
      document.getElementById('player-def-val').textContent = playerDef;
    }

    function loadOrSpawnEnemy() {
      const savedEnemy = localStorage.getItem('my_current_enemy');

          enemyPokemon = getPoke(data.id);
          enemyMaxHp = data.maxHp;
          enemyHp = data.hp;
          enemyAtk = data.atk;
          enemyDef = data.def;
          isEnemyBoss = data.isBoss;
          applyEnemyUI();
          return;
        }
      }
      spawnNewEnemy();
    }

    function spawnNewEnemy() {
      const pool = (typeof POKEMON_DATA !== 'undefined') ? POKEMON_DATA : [];
      isEnemyBoss = (stage % 10 === 0);

      if (isEnemyBoss) {
        const bosses = pool.filter(p => p.id.includes('-m') || p.id.includes('-k') || p.id.includes('-x') || p.id.includes('-y') || p.id.includes('-z') || p.rarity === 'UR');
        enemyPokemon = bosses.length > 0 ? bosses[Math.floor(Math.random() * bosses.length)] : pool[0];
      } else {
        const regulars = pool.filter(p => !p.id.includes('-m') && !p.id.includes('-k') && !p.id.includes('-x') && !p.id.includes('-y') && !p.id.includes('-z') && p.rarity !== 'UR');
        enemyPokemon = regulars.length > 0 ? regulars[Math.floor(Math.random() * regulars.length)] : pool[0];
      }

      enemyMaxHp = Math.floor((75 + stage * 22) * (isEnemyBoss ? 2.5 : 1.0));
      enemyHp = enemyMaxHp;
      enemyAtk = Math.floor((14 + stage * 4.2) * (isEnemyBoss ? 1.5 : 1.0));
      enemyDef = Math.floor(10 + stage * 3);

      saveCurrentEnemy();
      applyEnemyUI();
      addLog(isEnemyBoss ? `👑 BOSS【${enemyPokemon.name}】が立ち塞がった！` : `野生の【${enemyPokemon.name}】が現れた！`);
    }

    function saveCurrentEnemy() {
      localStorage.setItem('my_current_enemy', JSON.stringify({
        stage,
        id: enemyPokemon.id,
        maxHp: enemyMaxHp,
        hp: enemyHp,
        atk: enemyAtk,
        def: enemyDef,
        isBoss: isEnemyBoss
      }));
    }

    function applyEnemyUI() {
      document.getElementById('stage-text').textContent = `${stage}F` + (isEnemyBoss ? ' 👑' : '');
      const eTitle = enemyPokemon.subName ? `${enemyPokemon.name} (${enemyPokemon.subName})` : enemyPokemon.name;
      document.getElementById('enemy-name').textContent = `${eTitle} Lv.${stage}`;
      
      const eTypeEl = document.getElementById('enemy-type');
      eTypeEl.textContent = enemyPokemon.type;
      eTypeEl.className = `type-badge type-${enemyPokemon.type}`;

      const eImg = document.getElementById('enemy-img');
      eImg.src = enemyPokemon.img;
      const px = getSizePx(enemyPokemon.size || 'S');
      eImg.style.width = px + 'px';
      eImg.style.height = px + 'px';

      eImg.classList.remove('aura-mega', 'aura-kyodai');
      if (enemyPokemon.id.includes('-k')) eImg.classList.add('aura-kyodai');
      else if (enemyPokemon.id.includes('-m') || enemyPokemon.id.includes('-x') || enemyPokemon.id.includes('-y') || enemyPokemon.id.includes('-z')) eImg.classList.add('aura-mega');
    }

    function updateUI() {
      const pRate = Math.max(0, (playerHp / playerMaxHp) * 100);
      const pBar = document.getElementById('player-hp-bar');
      pBar.style.width = `${pRate}%`;
      pBar.className = `hp-gauge-fill ${pRate < 25 ? 'danger' : pRate < 50 ? 'warning' : ''}`;
      document.getElementById('player-hp-val').textContent = `${Math.max(0, playerHp)} / ${playerMaxHp}`;

      const eRate = Math.max(0, (enemyHp / enemyMaxHp) * 100);
      const eBar = document.getElementById('enemy-hp-bar');
      eBar.style.width = `${eRate}%`;
      eBar.className = `hp-gauge-fill ${eRate < 25 ? 'danger' : eRate < 50 ? 'warning' : ''}`;
      document.getElementById('enemy-hp-val').textContent = `${Math.max(0, enemyHp)} / ${enemyMaxHp}`;

      for (let i = 1; i <= 3; i++) {
        document.getElementById(`seed-${i}`).classList.toggle('active', seedStock >= i);
      }
      document.getElementById('seed-super').classList.toggle('active', superSeed);

      checkEvoAwakenStatus();

      ['btn-atk', 'btn-def'].forEach(id => document.getElementById(id).disabled = turnInProgress);
    }

    let nextEvoTarget = null;
    let nextAwakenTarget = null;

    function checkEvoAwakenStatus() {
      const currentFormId = partyForms[currentPartyIdx] || party[currentPartyIdx];
      const btn = document.getElementById('btn-evo-awaken');
      const btnTxt = document.getElementById('evo-btn-text');

      nextEvoTarget = null;
      nextAwakenTarget = null;
      btn.className = 'btn-evo-awaken';
      btn.disabled = true;

      // 1. 通常進化チェック
      const evoInfo = getEvoInfo(currentFormId);
      if (evoInfo && inventory[evoInfo.next] > 0) {
        if (seedStock >= evoInfo.cost) {
          nextEvoTarget = evoInfo;
          btn.disabled = false;
          btn.classList.add('ready-evo');
          btnTxt.textContent = `しんか(${evoInfo.cost}個)`;
          return;
        }
      }

      // 2. 覚醒チェック
      if (superSeed && !currentFormId.includes('-m') && !currentFormId.includes('-k') && !currentFormId.includes('-z')) {
        const candidates = getAwakenCandidates(currentFormId);
        const available = candidates.filter(aid => inventory[aid] > 0);
        if (available.length > 0) {
          nextAwakenTarget = available[0];
          btn.disabled = false;
          btn.classList.add('ready-awaken');
          btnTxt.textContent = 'かくせい！';
          return;
        }
      }

      btnTxt.textContent = (currentFormId.includes('-m') || currentFormId.includes('-k') || currentFormId.includes('-z')) ? '覚醒中' : (evoInfo ? 'しんか' : '最大形態');
    }

    function triggerEvoOrAwaken() {
      if (turnInProgress) return;

      if (nextEvoTarget) {
        const nextPoke = getPoke(nextEvoTarget.next);
        seedStock -= nextEvoTarget.cost;
        localStorage.setItem('my_battle_seeds', seedStock);

        partyForms[currentPartyIdx] = nextEvoTarget.next; // 進化状態を保存
        const isSecond = (nextEvoTarget.cost === 3);
        playFlashEffect(isSecond ? 'gold' : 'silver');

        addLog(`🌟 相棒は【${nextPoke.name}】へ進化した！ HP全快！`);
        loadPlayerStats();
        updateUI();
      } else if (nextAwakenTarget) {
        const targetPoke = getPoke(nextAwakenTarget);
        superSeed = false;
        localStorage.setItem('my_super_seed', 'false');

        partyForms[currentPartyIdx] = nextAwakenTarget;
        const isKyodai = targetPoke.id.includes('-k');
        playFlashEffect(isKyodai ? 'red' : 'rainbow');

        addLog(`🌈 相棒は【${targetPoke.name}】へ覚醒した！ パワー全開！`);
        loadPlayerStats();
        updateUI();
      }
    }

    function playFlashEffect(type) {
      const flashEl = document.getElementById('evo-flash');
      flashEl.className = `evo-flash-overlay flash-${type}`;
      setTimeout(() => { flashEl.className = 'evo-flash-overlay'; }, 900);
    }

    function addLog(txt) {
      document.getElementById('msg-text').textContent = txt;
      battleLogs.unshift(`[${stage}F] ${txt}`);
    }

    function showDmgPop(target, dmg, isCrit = false) {
      const popEl = document.getElementById(target === 'enemy' ? 'enemy-dmg-pop' : 'player-dmg-pop');
      popEl.textContent = (isCrit ? '💥会心! -' : '-') + dmg;
      popEl.style.display = 'block';
      popEl.style.animation = 'none';
      void popEl.offsetWidth;
      popEl.style.animation = 'floatDmg 3.5s forwards ease-out';
    }

    function calcTypeMulti(atkType, defType) {
      if (TYPE_CHART[atkType]) {
        if (TYPE_CHART[atkType].weak && TYPE_CHART[atkType].weak.includes(defType)) return 0.7;
        if (TYPE_CHART[atkType].resist && TYPE_CHART[atkType].resist.includes(defType)) return 1.5;
      }
      return 1.0;
    }

    function playerAction(type) {
      if (turnInProgress) return;
      turnInProgress = true;
      isDefending = (type === 'def');

      const pType = document.getElementById('player-type').textContent;
      const eType = enemyPokemon.type;

      if (type === 'atk') {
        const pImg = document.getElementById('player-img');
        pImg.classList.add('anim-atk-player');
        setTimeout(() => pImg.classList.remove('anim-atk-player'), 350);

        setTimeout(() => {
          const eImg = document.getElementById('enemy-img');
          eImg.classList.add('anim-hit');
          setTimeout(() => eImg.classList.remove('anim-hit'), 400);

          const typeMulti = calcTypeMulti(pType, eType);
          let baseDmg = Math.max(5, playerAtk - enemyDef * 0.4);
          let dmg = Math.floor(baseDmg * (Math.random() * 0.3 + 0.85) * typeMulti);

          enemyHp -= dmg;
          saveCurrentEnemy();
          showDmgPop('enemy', dmg);

          let comment = typeMulti > 1.0 ? '（ばつぐん！）' : (typeMulti < 1.0 ? '（いまひとつ…）' : '');
          addLog(`相棒のこうげき！ ${dmg} ダメージ！ ${comment}`);

          updateUI();
          if (enemyHp <= 0) { setTimeout(winBattle, 600); return; }

          setTimeout(enemyTurn, 700);
        }, 200);
      } else if (type === 'def') {
        addLog('🛡️ 相棒はしっかりと身を守っている！');
        updateUI();
        setTimeout(enemyTurn, 700);
      }
    }

    function enemyTurn() {
      const eImg = document.getElementById('enemy-img');
      eImg.classList.add('anim-atk-enemy');
      setTimeout(() => eImg.classList.remove('anim-atk-enemy'), 350);

      setTimeout(() => {
        const pImg = document.getElementById('player-img');
        pImg.classList.add('anim-hit');
        setTimeout(() => pImg.classList.remove('anim-hit'), 400);

        const pType = document.getElementById('player-type').textContent;
        const eType = enemyPokemon.type;
        const typeMulti = calcTypeMulti(eType, pType);

        const isCrit = Math.random() < 0.15;
        let baseDmg = Math.max(4, enemyAtk - playerDef * 0.4);
        let dmg = Math.floor(baseDmg * (Math.random() * 0.3 + 0.85) * typeMulti * (isCrit ? 1.8 : 1.0));

        if (isDefending) dmg = Math.floor(dmg * 0.3);

        playerHp -= dmg;
        saveCurrentEnemy();
        showDmgPop('player', dmg, isCrit);
        addLog(`相手のこうげき！ ${dmg} ダメージ！` + (isCrit ? '（急所！）' : ''));

        updateUI();

        if (playerHp <= 0) {
          const baseId = getBasePokemonId(party[currentPartyIdx]);
          fainted[baseId] = true;
          localStorage.setItem('my_fainted_pokemon', JSON.stringify(fainted));
          addLog(`💀 相棒は たおれてしまった！`);

          setTimeout(() => {
            turnInProgress = false;
            // 次の元気な仲間へ
            const nextAlive = party.findIndex(id => !fainted[id]);
            if (nextAlive === -1) {
              openResultModal(true); // 全滅
            } else {
              currentPartyIdx = nextAlive;
              loadPlayerStats();
              updateUI();
            }
          }, 1200);
          return;
        }

        turnCount++;
        if (turnCount % 3 === 0) {
          triggerSlot(false);
        } else {
          turnInProgress = false;
          updateUI();
          if (isAuto) setTimeout(() => playerAction('atk'), 500);
        }
      }, 200);
    }

    // スロット（通常＆ボス豪華版）
    let slotTimer;
    const SLOT_REWARDS_NORMAL = ['🌱 進化の種', '💖 HP回復(小)', '💖 HP回復(中)', '💖 HP回復(大)', '⚔️ 攻撃力UP', '✨ 超進化の種'];
    const SLOT_REWARDS_BOSS = ['🌱 進化の種×2', '✨ 超進化の種', '💰 1000 G', '💖 全員HP全快', '⚔️ 永久ATK+20'];

    function triggerSlot(isBoss = false) {
      isBossRoulette = isBoss;
      const rewards = isBoss ? SLOT_REWARDS_BOSS : SLOT_REWARDS_NORMAL;
      document.getElementById('slot-modal-title').textContent = isBoss ? '👑 BOSS撃破！ 豪華ボーナスルーレット！' : '🎰 スロット援護ルーレット！';

      if (isAuto) {
        const r = rewards[Math.floor(Math.random() * rewards.length)];
        applySlotReward(r);
        addLog(`🎰 スロット自動発動: 【${r}】を獲得！`);
        turnInProgress = false;
        updateUI();
        if (!isBoss) setTimeout(() => playerAction('atk'), 600);
      } else {
        document.getElementById('slot-modal').style.display = 'flex';
        let idx = 0;
        slotTimer = setInterval(() => {
          idx = (idx + 1) % rewards.length;
          document.getElementById('slot-drum-text').textContent = rewards[idx];
        }, 70);
      }
    }

    function stopSlot() {
      clearInterval(slotTimer);
      const chosen = document.getElementById('slot-drum-text').textContent;
      applySlotReward(chosen);
      document.getElementById('btn-slot-push').disabled = true;

      setTimeout(() => {
        document.getElementById('slot-modal').style.display = 'none';
        document.getElementById('btn-slot-push').disabled = false;
        addLog(`🎰 スロット結果: 【${chosen}】を獲得！`);
        turnInProgress = false;
        updateUI();
      }, 700);
    }

    function applySlotReward(r) {
      if (r === '🌱 進化の種') {
        if (seedStock < 3) seedStock++;
      } else if (r === '🌱 進化の種×2') {
        seedStock = Math.min(3, seedStock + 2);
      } else if (r === '💖 HP回復(小)') {
        playerHp = Math.min(playerMaxHp, playerHp + Math.floor(playerMaxHp * 0.25));
      } else if (r === '💖 HP回復(中)') {
        playerHp = Math.min(playerMaxHp, playerHp + Math.floor(playerMaxHp * 0.5));
      } else if (r === '💖 HP回復(大)') {
        playerHp = playerMaxHp;
      } else if (r === '💖 全員HP全快') {
        playerHp = playerMaxHp;
        fainted = {};
        localStorage.setItem('my_fainted_pokemon', JSON.stringify(fainted));
      } else if (r === '⚔️ 攻撃力UP') {
        playerAtk += 10;
      } else if (r === '⚔️ 永久ATK+20') {
        playerAtk += 20;
      } else if (r === '✨ 超進化の種') {
        superSeed = true;
        localStorage.setItem('my_super_seed', 'true');
      } else if (r === '💰 1000 G') {
        coins += 1000;
        localStorage.setItem('my_casino_coins', coins);
      }
      localStorage.setItem('my_battle_seeds', seedStock);
    }

    function winBattle() {
      const reward = isEnemyBoss ? 300 : 50;
      coins += reward;
      localStorage.setItem('my_casino_coins', coins);
      localStorage.removeItem('my_current_enemy');

      // 覚醒はその階層限定なので解除（通常進化はそのままキープ！）
      const curForm = partyForms[currentPartyIdx] || '';
      if (curForm.includes('-m') || curForm.includes('-k') || curForm.includes('-z')) {
        partyForms[currentPartyIdx] = curForm.split('-')[0];
        loadPlayerStats();
      }

      // 到達階層更新
      if (stage > maxClearedStage) {
        maxClearedStage = stage;
        localStorage.setItem('my_tower_max_stage', maxClearedStage);
      }

      const prevStage = stage;
      stage++;
      localStorage.setItem('my_tower_stage', stage);

      addLog(`🎉 撃破！ STAGE ${prevStage} クリア！ +${reward}G`);

      // ★ 10Fボス撃破時は豪華ルーレット発動！
      if (prevStage % 10 === 0) {
        setTimeout(() => {
          triggerSlot(true);
        }, 500);
      }

      setTimeout(() => {
        turnInProgress = false;
        spawnNewEnemy();
        updateUI();
        if (isAuto && prevStage % 10 !== 0) playerAction('atk');
      }, 1000);
    }

    // 📊 半透明リザルト／コンティニューモーダル
    function openResultModal(isWipeout = false) {
      document.getElementById('result-title').textContent = isWipeout ? '💀 全滅してしまった…' : '🚩 帰還リザルト確認';
      document.getElementById('res-stage').textContent = `${stage}F`;
      document.getElementById('res-coins').textContent = `${coins} G`;
      document.getElementById('res-seeds').textContent = `${seedStock} / 3 個`;
      document.getElementById('res-super').textContent = superSeed ? 'あり ✨' : 'なし';
      document.getElementById('top-result-overlay').style.display = 'flex';
    }

    function closeResultModal() {
      document.getElementById('top-result-overlay').style.display = 'none';
    }

    function executeReturnToFloor(targetFloor) {
      stage = targetFloor;
      localStorage.setItem('my_tower_stage', stage);
      localStorage.removeItem('my_current_enemy');

      // 帰還時はたねポケモン状態にリセット
      partyForms = [...party];
      fainted = {};
      localStorage.setItem('my_fainted_pokemon', JSON.stringify(fainted));

      closeResultModal();
      closeFloorSelectModal();
      initBattle();
      addLog(`🚩 ${targetFloor}Fから再スタート！ 資材を活用して頂上を目指そう！`);
    }

    // 🚀 10階層区切りのフロア選択
    function openFloorSelectModal() {
      const container = document.getElementById('floor-grid-container');
      container.innerHTML = '';

      // 1F, 11F, 21F, 31F...
      for (let f = 1; f <= 101; f += 10) {
        const btn = document.createElement('button');
        const isUnlocked = (f === 1 || f <= maxClearedStage);
        btn.className = `floor-btn ${isUnlocked ? '' : 'locked'}`;
        btn.innerHTML = `${f}F` + (isUnlocked ? '' : '<br><span style="font-size:8px;">未到達</span>');
        if (isUnlocked) {
          btn.onclick = () => {
            if (confirm(`${f}Fから出発しますか？`)) {
              executeReturnToFloor(f);
            }
          };
        }
        container.appendChild(btn);
      }
      document.getElementById('floor-select-overlay').style.display = 'flex';
    }

    function closeFloorSelectModal() {
      document.getElementById('floor-select-overlay').style.display = 'none';
    }

    function toggleAuto() {
      isAuto = !isAuto;
      document.getElementById('btn-auto').classList.toggle('active', isAuto);
      document.getElementById('btn-auto').textContent = isAuto ? 'Auto中' : 'Auto';
      if (isAuto && !turnInProgress) playerAction('atk');
    }

    // 交代画面
    function openSwitchView() {
      document.getElementById('cmd-view').style.display = 'none';
      document.getElementById('switch-view').style.display = 'flex';
      const grid = document.getElementById('switch-party-grid');
      grid.innerHTML = '';

      for (let i = 0; i < 6; i++) {
        const baseId = party[i];
        const card = document.createElement('div');

        if (!baseId) {
          card.className = 'party-slot-card empty';
          card.innerHTML = `<span style="font-size:10px; color:#64748b;">(あき枠)</span>`;
        } else {
          const curFormId = partyForms[i] || baseId; // 進化した姿で表示
          const p = getPoke(curFormId);
          const lv = levels[baseId] || 1;
          const isFaint = !!fainted[baseId];
          const isCur = (i === currentPartyIdx);

          card.className = `party-slot-card ${isCur ? 'current' : ''} ${isFaint ? 'fainted' : ''}`;
          card.innerHTML = `
            <img src="${p.img}" style="width:42px; height:42px; object-fit:contain;" onerror="this.src='images/slot1.png'">
            <div style="font-size:10px; flex:1;">
              <b style="font-size:11px;">${p.name}</b> Lv.${lv}<br>
              <span class="type-badge type-${p.type}">${p.type}</span> ${isFaint ? '<span style="color:#ef4444; font-weight:bold; margin-left:3px;">ひんし</span>' : '<span style="color:#22c55e; font-weight:bold; margin-left:3px;">げんき</span>'}
            </div>
          `;

          if (!isFaint && !isCur) {
            card.onclick = () => {
              if (confirm(`【${p.name}】に交代するかい？`)) {
                currentPartyIdx = i;
                closeSwitchView();
                loadPlayerStats();
                addLog(`行けっ！ 【${p.name}】！`);
                updateUI();
                setTimeout(enemyTurn, 600);
              }
            };
          }
        }
        grid.appendChild(card);
      }
    }

    function closeSwitchView() {
      document.getElementById('switch-view').style.display = 'none';
      document.getElementById('cmd-view').style.display = 'flex';
    }

    function openHistoryModal() {
      document.getElementById('history-modal').style.display = 'flex';
      const container = document.getElementById('history-log-content');
      container.innerHTML = battleLogs.length > 0 ? battleLogs.map(l => `<div>• ${l}</div>`).join('') : 'まだログはありません。';
    }

    function closeHistoryModal() {
      document.getElementById('history-modal').style.display = 'none';
    }

    window.addEventListener('DOMContentLoaded', initBattle);
  </script>
</body>
</html>
