<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>バッグ | どうぐ・持ち物確認</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">

  <!-- Firebase SDK (v9 compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'DotGothic16', sans-serif !important;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #090d16;
    }

    body {
      background: #0f172a;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 12px;
      padding-top: calc(6px + env(safe-area-inset-top));
      padding-bottom: calc(6px + env(safe-area-inset-bottom));
    }

    .container {
      width: 100%;
      max-width: 420px;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 6px;
      justify-content: flex-start;
      position: relative;
    }

    /* ヘッダー */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .top-btn {
      color: #ffffff;
      text-decoration: none;
      font-size: 11px;
      font-weight: bold;
      background: rgba(255, 255, 255, 0.15);
      padding: 4px 10px;
      border-radius: 20px;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      cursor: pointer;
    }
    .top-btn:active { transform: scale(0.95); }

    /* ナビゲーションリンク */
    .nav-links {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }
    .nav-btn {
      flex: 1;
      padding: 6px 0;
      border-radius: 10px;
      font-size: 11px;
      font-weight: bold;
      text-decoration: none;
      text-align: center;
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      transition: all 0.15s ease;
    }
    .nav-btn.active {
      background: linear-gradient(135deg, #eab308, #ca8a04);
      border-color: #fde047;
      color: #000;
      box-shadow: 0 2px 8px rgba(234, 179, 8, 0.4);
    }
    .nav-btn:active { transform: scale(0.96); }

    /* ステータスバー */
    .status-bar {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(8px);
      border-radius: 12px;
      padding: 6px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid rgba(255, 255, 255, 0.15);
      flex-shrink: 0;
      font-size: 11px;
    }

    /* アイテムカテゴリタブ */
    .cat-tab-group {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }
    .cat-tab-btn {
      flex: 1;
      padding: 4px 0;
      border-radius: 6px;
      font-size: 10px;
      font-weight: bold;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(0, 0, 0, 0.3);
      color: #94a3b8;
      cursor: pointer;
    }
    .cat-tab-btn.active {
      background: #3b82f6;
      border-color: #60a5fa;
      color: #fff;
    }

    /* アイテムリストコンテナ */
    .bag-container {
      flex: 1 1 0%;
      min-height: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(10px);
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 8px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .item-card {
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
      transition: transform 0.1s ease;
    }
    .item-card:active { transform: scale(0.98); }

    .item-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .item-icon {
      font-size: 24px;
      width: 36px;
      height: 36px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .item-name {
      font-size: 12px;
      font-weight: bold;
      color: #f1f5f9;
    }
    .item-sub {
      font-size: 9px;
      color: #94a3b8;
      margin-top: 2px;
    }
    .item-count {
      font-size: 14px;
      font-weight: 900;
      color: #fbbf24;
      text-align: right;
      white-space: nowrap;
    }

    /* 詳細モーダル */
    .detail-overlay {
      position: absolute;
      inset: 0;
      background: rgba(2, 6, 23, 0.94);
      backdrop-filter: blur(16px);
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .detail-card {
      width: 100%;
      max-width: 300px;
      background: rgba(15, 23, 42, 0.95);
      border: 1.5px solid #fbbf24;
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      text-align: center;
    }
    .detail-icon { font-size: 40px; margin-bottom: 4px; }
    .detail-title { font-size: 15px; font-weight: 900; color: #fbbf24; }
    .detail-desc {
      font-size: 11px;
      color: #cbd5e1;
      line-height: 1.5;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 8px;
      padding: 8px 10px;
      width: 100%;
      text-align: left;
    }
    .detail-btn {
      width: 100%;
      padding: 8px 0;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <div class="top-bar">
      <a href="index.html" class="top-btn">◀ ポータル</a>
      <span style="font-size: 11px; font-weight: bold; color: #fbbf24;">ITEM BAG</span>
      <a href="tower_home.html" class="top-btn" style="background:#4338ca;">🏰 塔へ</a>
    </div>

    <!-- ページリンク -->
    <div class="nav-links">
      <a href="tower_home.html" class="nav-btn">🏰 塔</a>
      <a href="train.html" class="nav-btn">🌱 育成</a>
      <a href="dex.html" class="nav-btn">📖 図鑑</a>
      <a href="bag.html" class="nav-btn active">🎒 道具</a>
      <a href="gacha.html" class="nav-btn">✨ ガチャ</a>
    </div>

    <!-- ステータスバー -->
    <div class="status-bar">
      <div>🪙 所持コイン: <b id="coin-disp" style="color:#fbbf24;">0</b> G</div>
      <div>📦 総アイテム種: <b id="total-items-disp" style="color:#38bdf8;">0</b></div>
    </div>

    <!-- カテゴリタブ -->
    <div class="cat-tab-group">
      <button class="cat-tab-btn active" id="tab-all" onclick="filterCategory('all')">すべて</button>
      <button class="cat-tab-btn" id="tab-battle" onclick="filterCategory('battle')">育成・進化</button>
      <button class="cat-tab-btn" id="tab-recovery" onclick="filterCategory('recovery')">回復</button>
      <button class="cat-tab-btn" id="tab-valuable" onclick="filterCategory('valuable')">貴重品</button>
    </div>

    <!-- 道具リスト -->
    <div class="bag-container" id="bag-list"></div>

    <!-- 詳細ポップアップモーダル -->
    <div class="detail-overlay" id="detail-modal" style="display: none;" onclick="closeModal()">
      <div class="detail-card" onclick="event.stopPropagation()">
        <div class="detail-icon" id="modal-icon">🌱</div>
        <div class="detail-title" id="modal-title">進化の種</div>
        <div style="font-size: 12px; color:#38bdf8;" id="modal-count">所持数: 0個</div>
        <div class="detail-desc" id="modal-desc">説明テキスト</div>
        <button class="detail-btn" onclick="closeModal()">とじる</button>
      </div>
    </div>

  </div>

  <!-- クラウド同期モジュール -->
  <script src="cloudSync.js"></script>

  <script>
    // 道具マスタデータ（今後増やすアイテムもここに追加するだけでOK！）
    const ITEM_MASTER = [
      {
        id: 'seed',
        name: '進化の種',
        icon: '🌱',
        cat: 'battle',
        desc: 'タワーバトル中にポケモンを進化させる不思議な種。1進化に1個、2進化に3個消費する。',
        getQty: () => parseInt(localStorage.getItem('my_battle_seeds') || '0')
      },
      {
        id: 'super_seed',
        name: '超進化の種',
        icon: '✨',
        cat: 'battle',
        desc: 'メガシンカやキョダイマックスへと覚醒させる伝説の種。その階層の間、圧倒的なパワーを得る。',
        getQty: () => (localStorage.getItem('my_super_seed') === 'true' ? 1 : 0)
      },
      {
        id: 'revive',
        name: 'げんきのかけら',
        icon: '💊',
        cat: 'recovery',
        desc: '育成ジムでひんし状態のポケモンを治療し、再び元気にする回復アイテム。',
        getQty: () => parseInt(localStorage.getItem('my_revive_items') || '2')
      },
      {
        id: 'casino_coin',
        name: 'カジノコイン',
        icon: '🪙',
        cat: 'valuable',
        desc: 'ガチャを引いたり、ポケモンの育成・強化、カジノのBETに使用する共通通貨。',
        getQty: () => parseInt(localStorage.getItem('my_casino_coins') || '1000')
      },
      {
        id: 'mega_ring',
        name: 'メガリング (絆の証)',
        icon: '💍',
        cat: 'valuable',
        desc: 'ポケモンとの深い絆を結び、メガシンカを引き出すトレーナーの秘宝。',
        getQty: () => 1
      }
    ];

    let currentCat = 'all';

    function renderBag() {
      const coins = parseInt(localStorage.getItem('my_casino_coins') || '1000');
      document.getElementById('coin-disp').textContent = coins.toLocaleString();

      const container = document.getElementById('bag-list');
      container.innerHTML = '';

      let filtered = ITEM_MASTER.filter(item => {
        if (currentCat === 'all') return true;
        return item.cat === currentCat;
      });

      document.getElementById('total-items-disp').textContent = `${filtered.length} 種`;

      filtered.forEach(item => {
        const qty = item.getQty();
        const card = document.createElement('div');
        card.className = 'item-card';
        card.innerHTML = `
          <div class="item-left">
            <div class="item-icon">${item.icon}</div>
            <div>
              <div class="item-name">${item.name}</div>
              <div class="item-sub">${item.cat === 'battle' ? '育成・進化' : (item.cat === 'recovery' ? '回復' : '貴重品')}</div>
            </div>
          </div>
          <div class="item-count">${qty.toLocaleString()} ${item.id === 'casino_coin' ? 'G' : '個'}</div>
        `;
        card.onclick = () => openModal(item, qty);
        container.appendChild(card);
      });
    }

    function filterCategory(cat) {
      currentCat = cat;
      ['all', 'battle', 'recovery', 'valuable'].forEach(c => {
        document.getElementById(`tab-${c}`).classList.toggle('active', c === cat);
      });
      renderBag();
    }

    function openModal(item, qty) {
      document.getElementById('modal-icon').textContent = item.icon;
      document.getElementById('modal-title').textContent = item.name;
      document.getElementById('modal-count').textContent = `所持数: ${qty.toLocaleString()} ${item.id === 'casino_coin' ? 'G' : '個'}`;
      document.getElementById('modal-desc').textContent = item.desc;
      document.getElementById('detail-modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('detail-modal').style.display = 'none';
    }

    // クラウド側更新時の自動再描画
    window.onCloudSyncUpdated = function() {
      renderBag();
    };

    window.addEventListener('DOMContentLoaded', renderBag);
  </script>
</body>
</html>
