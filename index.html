<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ハッピーライフ</title>
  
  <!-- PWA設定 -->
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="images/ichigo.jpg">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #e0f2fe 0%, #f0fdf4 50%, #fef3c7 100%);
      min-height: 100vh;
      min-height: 100dvh;
      color: #333;
      padding: 20px 16px;
      padding-top: calc(20px + env(safe-area-inset-top));
      padding-bottom: calc(20px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* ヘッダー */
    .portal-header {
      text-align: center;
      padding: 8px 0 2px;
    }
    .portal-header h1 {
      font-size: 22px;
      font-weight: 800;
      color: #1e293b;
      letter-spacing: 0.5px;
    }
    .portal-header p {
      font-size: 12px;
      color: #64748b;
      margin-top: 4px;
    }

    /* タップエフェクト */
    .press-effect {
      transition: transform 0.12s ease, box-shadow 0.12s ease, opacity 0.12s ease;
      -webkit-tap-highlight-color: transparent;
      text-decoration: none;
      user-select: none;
    }
    .press-effect:active {
      transform: scale(0.95);
      opacity: 0.88;
    }

    /* クイックステータス枠 */
    .status-panel {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(8px);
      border-radius: 14px;
      padding: 10px 16px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      border: 1px solid rgba(255, 255, 255, 0.4);
      cursor: pointer;
    }
    .status-item {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .status-item span {
      display: block;
      font-size: 11px;
      color: #64748b;
    }

    .blur-value {
      font-size: 15px;
      color: #1e293b;
      margin-top: 2px;
      display: block;
      filter: blur(6px);
      transition: filter 0.2s ease;
      cursor: pointer;
      user-select: none;
    }
    .blur-value.revealed {
      filter: blur(0px);
    }

    /* メインツールカード一覧 */
    .app-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .app-card {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.6);
    }

    .app-icon-box {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }

    .icon-money { background: linear-gradient(135deg, #34d399, #059669); color: #fff; }
    .icon-chat { background: linear-gradient(135deg, #60a5fa, #2563eb); color: #fff; }
    .icon-health { background: linear-gradient(135deg, #f87171, #dc2626); color: #fff; }

    .app-info { flex: 1; }
    .app-info h2 { font-size: 15px; font-weight: 700; color: #1e293b; margin-bottom: 2px; }
    .app-info p { font-size: 11px; color: #64748b; line-height: 1.3; }

    .arrow-icon { font-size: 15px; color: #94a3b8; font-weight: bold; }

    /* ミニゲーム・アイコンセクション */
    .game-section {
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(8px);
      border-radius: 16px;
      padding: 12px 16px;
      border: 1px solid rgba(255, 255, 255, 0.5);
    }
    .game-section-title {
      font-size: 11px;
      font-weight: 800;
      color: #64748b;
      margin-bottom: 10px;
      letter-spacing: 0.5px;
    }
    .game-icon-grid {
      display: flex;
      gap: 16px;
      align-items: center;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .game-icon-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      flex-shrink: 0;
    }
    .game-circle-icon {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.5);
    }
    .icon-game1 { background: linear-gradient(135deg, #f59e0b, #d97706); color: #fff; }
    .icon-game2 { background: linear-gradient(135deg, #ec4899, #be185d); color: #fff; }
    .icon-game3 { background: linear-gradient(135deg, #8b5cf6, #4f46e5); color: #fff; }
    .icon-game4 { background: linear-gradient(135deg, #10b981, #047857); color: #fff; }

    .game-icon-label {
      font-size: 10px;
      font-weight: bold;
      color: #1e293b;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <header class="portal-header">
      <h1>My Private Portal</h1>
      <p>日常の管理・記録をひとつに集約</p>
    </header>

    <!-- クイックサマリー（タップでぼかし切り替え） -->
    <div class="status-panel press-effect" onclick="toggleBlur()" title="タップで表示/非表示">
      <div class="status-item">
        <span>💰 総資産 <small style="font-size:9px; color:#94a3b8;">(タップ)</small></span>
        <strong id="dash-total-assets" class="blur-value">--- 円</strong>
      </div>
      <div class="status-item">
        <span>🐧 Suica <small style="font-size:9px; color:#94a3b8;">(タップ)</small></span>
        <strong id="dash-suica-assets" class="blur-value">--- 円</strong>
      </div>
    </div>

    <!-- メインアプリ一覧 -->
    <div class="app-grid">
      
      <!-- 1. お小遣い＆資産管理 -->
      <a href="money.html" class="app-card press-effect">
        <div class="app-icon-box icon-money">💰</div>
        <div class="app-info">
          <h2>お小遣い・資産管理</h2>
          <p>現金・銀行・Suica残高とワンタップ通勤記録</p>
        </div>
        <div class="arrow-icon">❯</div>
      </a>

      <!-- 2. プライベートチャット＆メモ -->
      <a href="message.html" class="app-card press-effect">
        <div class="app-icon-box icon-chat">💬</div>
        <div class="app-info">
          <h2>メッセージ＆メモ</h2>
          <p>複数端末のリアルタイム共有・固定メモ帳</p>
        </div>
        <div class="arrow-icon">❯</div>
      </a>

      <!-- 3. 健康・運動管理 -->
      <a href="health.html" class="app-card press-effect">
        <div class="app-icon-box icon-health">💪</div>
        <div class="app-info">
          <h2>健康・運動管理</h2>
          <p>日々の運動習慣や体調のクイック記録</p>
        </div>
        <div class="arrow-icon">❯</div>
      </a>

    </div>

    <!-- ミニゲーム（4つ横スクロール対応） -->
    <div class="game-section">
      <div class="game-section-title">🎮 MINI GAMES</div>
      <div class="game-icon-grid">
        
        <a href="game1.html" class="game-icon-item press-effect">
          <div class="game-circle-icon icon-game1">⚡</div>
          <span class="game-icon-label">スピードタップ</span>
        </a>

        <a href="game2.html" class="game-icon-item press-effect">
          <div class="game-circle-icon icon-game2">🍉</div>
          <span class="game-icon-label">マージパズル</span>
        </a>

        <a href="game3.html" class="game-icon-item press-effect">
          <div class="game-circle-icon icon-game3">🎰</div>
          <span class="game-icon-label">目押しスロット</span>
        </a>

        <!-- 4. トランプゲーム（ソリティア＆ブラックジャック） -->
        <a href="game4.html" class="game-icon-item press-effect">
          <div class="game-circle-icon icon-game4">🃏</div>
          <span class="game-icon-label">トランプ</span>
        </a>

      </div>
    </div>

  </div>

  <script>
    function loadQuickData() {
      const cash = Number(localStorage.getItem('myCashBalance')) || 0;
      const bank = Number(localStorage.getItem('myBankBalance')) || 0;
      const suica = Number(localStorage.getItem('mySuicaBalance')) || 0;
      
      const total = cash + bank + suica;
      document.getElementById('dash-total-assets').textContent = total.toLocaleString() + ' 円';
      document.getElementById('dash-suica-assets').textContent = suica.toLocaleString() + ' 円';
    }

    function toggleBlur() {
      const totalEl = document.getElementById('dash-total-assets');
      const suicaEl = document.getElementById('dash-suica-assets');

      totalEl.classList.toggle('revealed');
      suicaEl.classList.toggle('revealed');
    }

    window.addEventListener('DOMContentLoaded', loadQuickData);
  </script>

</body>
</html>
