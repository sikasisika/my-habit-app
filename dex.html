<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ポケモン図鑑 | コレクションスタジオ</title>

  <!-- Firebase SDK (v9 compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f172a;
    }

    body {
      background-image: radial-gradient(circle at 50% 20%, #312e81 0%, #0f172a 70%, #022c22 100%);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 6px 10px;
      padding-top: calc(6px + env(safe-area-inset-top));
      padding-bottom: calc(6px + env(safe-area-inset-bottom));
    }

    .container {
      width: 100%;
      max-width: 440px;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 6px;
      justify-content: flex-start;
      position: relative;
    }

    /* ヘッダー */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .top-btn {
      color: #ffffff;
      text-decoration: none;
      font-size: 11px;
      font-weight: bold;
      background: rgba(255, 255, 255, 0.12);
      padding: 4px 10px;
      border-radius: 20px;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    /* ナビゲーションリンク */
    .nav-links {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }
    .nav-btn {
      flex: 1;
      padding: 5px 0;
      border-radius: 8px;
      font-size: 11px;
      font-weight: bold;
      text-decoration: none;
      text-align: center;
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      transition: all 0.15s ease;
    }
    .nav-btn.active {
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      border-color: #818cf8;
      box-shadow: 0 2px 8px rgba(99, 102, 241, 0.4);
    }

    /* 手持ち6枠プレビューバー（タップでショートカット詳細） */
    .party-preview-bar {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(8px);
      border-radius: 10px;
      padding: 4px 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid rgba(255, 255, 255, 0.15);
      flex-shrink: 0;
    }
    .party-slots {
      display: flex;
      gap: 4px;
    }
    .party-slot {
      width: 30px;
      height: 30px;
      border-radius: 6px;
      background: rgba(0,0,0,0.4);
      border: 1.5px solid rgba(255,255,255,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.1s ease;
    }
    .party-slot:active { transform: scale(0.9); }
    .party-slot img { width: 100%; height: 100%; object-fit: contain; }

    /* 検索＆ソートコントローラー */
    .filter-box {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      padding: 6px 8px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      flex-shrink: 0;
    }
    .search-input {
      width: 100%;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      padding: 5px 8px;
      color: #fff;
      font-size: 11px;
      user-select: text;
      -webkit-user-select: text;
    }
    .search-input::placeholder { color: #94a3b8; }
    
    .sort-controls {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .sort-select {
      flex: 1;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 4px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: bold;
    }
    .sort-order-btn {
      padding: 4px 8px;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      font-size: 10px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }

    /* 図鑑一覧グリッド */
    .dex-card-container {
      flex: 1 1 0%;
      min-height: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(10px);
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 8px;
      overflow-y: auto;
    }

    .dex-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .dex-item {
      border-radius: 10px;
      padding: 6px 3px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      position: relative;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.1);
      cursor: pointer;
      transition: transform 0.1s ease;
    }
    .dex-item:active { transform: scale(0.96); }

    .dex-item.in-party {
      border: 1.5px solid #38bdf8 !important;
      background: rgba(56, 189, 248, 0.15) !important;
    }
    .party-tag {
      position: absolute;
      top: 2px;
      left: 2px;
      font-size: 7px;
      font-weight: 900;
      background: #0284c7;
      color: #fff;
      padding: 1px 4px;
      border-radius: 3px;
    }
    .fav-tag {
      position: absolute;
      top: 2px;
      right: 2px;
      font-size: 9px;
      color: #fbbf24;
      text-shadow: 0 0 4px #000;
    }

    .dex-item.locked {
      background: rgba(0, 0, 0, 0.6) !important;
      border: 1px dashed rgba(255, 255, 255, 0.15) !important;
      cursor: not-allowed;
    }
    .dex-item.locked img {
      filter: brightness(0) !important;
      opacity: 0.28;
    }

    .dex-item img {
      width: 48px;
      height: 48px;
      object-fit: contain;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }

    .dex-name {
      font-size: 9px;
      font-weight: 800;
      color: #fff;
      text-align: center;
      line-height: 1.1;
    }
    .dex-subname {
      font-size: 7px;
      color: #94a3b8;
      text-align: center;
      line-height: 1.0;
    }
    .dex-lv-tag {
      font-size: 8px;
      color: #facc15;
      font-weight: bold;
      margin-top: 1px;
    }

    .dex-rarity { font-size: 7px; font-weight: 900; padding: 1px 4px; border-radius: 3px; }
    .badge-UR  { background: linear-gradient(90deg, #f59e0b, #ef4444); color: #fff; }
    .badge-SSR { background: #ec4899; color: #fff; }
    .badge-SR  { background: #a855f7; color: #fff; }
    .badge-R   { background: #38bdf8; color: #fff; }
    .badge-N   { background: #64748b; color: #fff; }

    /* ========================================================= */
    /* 🔍 ポップアップ拡大＆詳細モーダル */
    /* ========================================================= */
    .detail-overlay {
      position: absolute;
      inset: 0;
      background: rgba(2, 6, 23, 0.94);
      backdrop-filter: blur(20px);
      z-index: 60;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 14px;
      animation: modalFade 0.15s ease;
    }
    @keyframes modalFade {
      0% { opacity: 0; transform: scale(0.96); }
      100% { opacity: 1; transform: scale(1); }
    }

    .detail-card {
      width: 100%;
      max-width: 320px;
      background: rgba(15, 23, 42, 0.95);
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      border-radius: 18px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
    }
    .detail-card img {
      width: 100px;
      height: 100px;
      object-fit: contain;
      filter: drop-shadow(0 6px 12px rgba(0,0,0,0.6));
    }

    .modal-tabs {
      display: flex;
      width: 100%;
      gap: 6px;
      margin-top: 4px;
    }
    .modal-tab-btn {
      flex: 1;
      padding: 5px 0;
      border-radius: 6px;
      font-size: 10px;
      font-weight: bold;
      color: #94a3b8;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      cursor: pointer;
    }
    .modal-tab-btn.active {
      background: #3b82f6;
      color: #fff;
      border-color: #60a5fa;
    }

    .tab-content {
      width: 100%;
      min-height: 75px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 11px;
      line-height: 1.4;
      color: #cbd5e1;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px dashed rgba(255, 255, 255, 0.1);
      padding: 2px 0;
      font-size: 10px;
    }
    .stat-val { color: #38bdf8; font-weight: bold; }

    .modal-actions {
      display: flex;
      flex-direction: column;
      gap: 5px;
      width: 100%;
      margin-top: 4px;
    }

    .btn-action-row {
      display: flex;
      gap: 6px;
      width: 100%;
    }

    .btn-train-inline {
      flex: 1;
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
      font-size: 11px;
      font-weight: bold;
      padding: 7px 0;
      border-radius: 8px;
      border: 1px solid #34d399;
      cursor: pointer;
    }
    .btn-train-inline:active { transform: scale(0.96); }

    .btn-fav-toggle {
      width: 38px;
      background: rgba(255, 255, 255, 0.1);
      border: 1.5px solid #fbbf24;
      color: #fbbf24;
      font-size: 15px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .btn-fav-toggle.active {
      background: #fbbf24;
      color: #000;
    }

    .party-toggle-btn {
      width: 100%;
      padding: 8px 0;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 900;
      color: #fff;
      border: none;
      cursor: pointer;
    }
    .btn-add-party { background: linear-gradient(135deg, #0284c7, #0369a1); }
    .btn-remove-party { background: linear-gradient(135deg, #ef4444, #b91c1c); }
    .btn-disabled-party { background: #475569; opacity: 0.5; cursor: not-allowed; }

    .modal-close-btn {
      width: 100%;
      padding: 6px 0;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      font-size: 10px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <div class="top-bar">
      <a href="index.html" class="top-btn">◀ ポータル</a>
      <span style="font-size: 11px; font-weight: bold; color: #cbd5e1;">COLLECTION DEX</span>
      <span style="font-size: 11px; color:#fbbf24;">所持: <b id="top-coins">0</b> G</span>
    </div>

    <!-- ページリンク -->
    <div class="nav-links">
      <a href="tower_home.html" class="nav-btn">🏰 塔へ</a>
      <a href="train.html" class="nav-btn">🌱 育成</a>
      <a href="dex.html" class="nav-btn active">📖 図鑑</a>
      <a href="gacha.html" class="nav-btn">✨ ガチャ</a>
    </div>

    <!-- 手持ち6体プレビュー（タップでショートカット） -->
    <div class="party-preview-bar">
      <span style="font-size:9px; color:#cbd5e1;">出撃手持ち (タップで詳細):</span>
      <div class="party-slots" id="party-slots"></div>
    </div>

    <!-- 検索＆ソートバー -->
    <div class="filter-box">
      <input type="text" class="search-input" id="search-input" placeholder="🔍 なまえ・番号で検索..." oninput="filterAndRender()">
      
      <div class="sort-controls">
        <select class="sort-select" id="sort-type" onchange="filterAndRender()">
          <option value="id">図鑑No.順</option>
          <option value="name">名前五十音順</option>
          <option value="lv">レベル順</option>
          <option value="atk">こうげき力順</option>
          <option value="def">ぼうぎょ力順</option>
          <option value="hp">HP順</option>
        </select>
        <button class="sort-order-btn" id="btn-sort-order" onclick="toggleSortOrder()">▲ 昇順</button>
      </div>
    </div>

    <!-- 図鑑グリッド -->
    <div class="dex-card-container">
      <div class="dex-grid" id="dex-grid"></div>
    </div>

    <!-- 🔍 タップ拡大＆詳細モーダル -->
    <div class="detail-overlay" id="detail-modal" style="display: none;" onclick="closeModal()">
      <div class="detail-card" onclick="event.stopPropagation()">
        <span class="dex-rarity" id="modal-rarity">SR</span>
        <img id="modal-img" src="" alt="">
        <div style="font-size:14px; font-weight:900; color:#fff; text-align:center;" id="modal-name">ポケモン名</div>
        <div style="font-size:9px; color:#94a3b8; margin-top:-4px;" id="modal-subname"></div>

        <!-- タブ切り替えボタン -->
        <div class="modal-tabs">
          <button class="modal-tab-btn active" id="tab-stat-btn" onclick="switchTab('stat')">📊 ステータス</button>
          <button class="modal-tab-btn" id="tab-desc-btn" onclick="switchTab('desc')">📖 ずかん説明</button>
        </div>

        <!-- タブ1: ステータス -->
        <div class="tab-content" id="tab-stat-content">
          <div class="stat-row"><span>レベル</span><span class="stat-val" id="modal-lv">Lv.1</span></div>
          <div class="stat-row"><span>タイプ / サイズ</span><span class="stat-val" id="modal-type-size">ほのお / S</span></div>
          <div class="stat-row"><span>HP (たいりょく)</span><span class="stat-val" id="modal-hp">120</span></div>
          <div class="stat-row"><span>ATK (こうげき)</span><span class="stat-val" id="modal-atk">25</span></div>
          <div class="stat-row"><span>DEF (ぼうぎょ)</span><span class="stat-val" id="modal-def">18</span></div>
          <div class="stat-row"><span>所持数</span><span class="stat-val" id="modal-count">x1</span></div>
        </div>

        <!-- タブ2: 説明文 -->
        <div class="tab-content" id="tab-desc-content" style="display: none;">
          <div id="modal-desc-text" style="font-size:10px; color:#e2e8f0; line-height:1.5;"></div>
        </div>

        <!-- アクションボタン群 -->
        <div class="modal-actions">
          <div class="btn-action-row">
            <button class="btn-train-inline" onclick="levelUpFromModal()">🌱 100Gでレベルアップ</button>
            <button class="btn-fav-toggle" id="btn-fav-toggle" onclick="toggleFavoriteFromModal()" title="お気に入り登録（ポータル表示）">★</button>
          </div>

          <button class="party-toggle-btn" id="btn-party-toggle" onclick="togglePartyFromModal()">手持ちに入れる</button>
          <button class="modal-close-btn" onclick="closeModal()">閉じる</button>
        </div>

      </div>
    </div>

  </div>

  <!-- 外部データ ＆ クラウド同期モジュール -->
  <script src="pokemonData.js"></script>
  <script src="cloudSync.js"></script>

  <script>
    function getBasePokemonId(id) {
      if (id.startsWith('p0001') || id.startsWith('p0002') || id.startsWith('p0003')) return 'p0001';
      if (id.startsWith('p0004') || id.startsWith('p0005') || id.startsWith('p0006')) return 'p0004';
      if (id.startsWith('p0007') || id.startsWith('p0008') || id.startsWith('p0009')) return 'p0007';

      if (id.startsWith('p0016') || id.startsWith('p0017') || id.startsWith('p0018')) return 'p0016';

      if (id.startsWith('p0140') || id.startsWith('p0141')) return 'p0140';
      if (id.startsWith('p0147') || id.startsWith('p0148') || id.startsWith('p0149')) return 'p0147';
      if (id.startsWith('p0443') || id.startsWith('p0444') || id.startsWith('p0445')) return 'p0443';
      if (id.startsWith('p0447') || id.startsWith('p0448')) return 'p0447';
      return id.split('-')[0];
    }

    let inventory = JSON.parse(localStorage.getItem('my_gacha_inventory') || '{}');
    let party = JSON.parse(localStorage.getItem('my_battle_party') || '["p0004"]');
    let levels = JSON.parse(localStorage.getItem('my_partner_levels') || '{}');
    let coins = parseInt(localStorage.getItem('my_casino_coins') || '1000');
    let favoriteId = localStorage.getItem('my_favorite_pokemon') || 'p0004';

    let currentSortOrder = 'asc'; 
    let selectedPokemon = null;

    function getPokeStats(card) {
      const baseId = getBasePokemonId(card.id);
      const lv = levels[baseId] || 1;
      const count = inventory[card.id] || 0;

      let multi = 1.0;
      if (card.rarity === 'R') multi = 1.2;
      if (card.rarity === 'SR') multi = 1.5;
      if (card.rarity === 'SSR') multi = 2.0;
      if (card.rarity === 'UR') multi = 2.8;

      const hp = Math.floor((100 + lv * 20) * multi);
      const atk = Math.floor((20 + lv * 6) * multi);
      const def = Math.floor((15 + lv * 4) * multi);

      return { lv, hp, atk, def, count };
    }

    // クラウド側でデータ更新時の自動同期
    window.onCloudSyncUpdated = function() {
      inventory = JSON.parse(localStorage.getItem('my_gacha_inventory') || '{}');
      party = JSON.parse(localStorage.getItem('my_battle_party') || '["p0004"]');
      levels = JSON.parse(localStorage.getItem('my_partner_levels') || '{}');
      coins = parseInt(localStorage.getItem('my_casino_coins') || '1000');
      favoriteId = localStorage.getItem('my_favorite_pokemon') || 'p0004';
      filterAndRender();
    };

    function renderSlots() {
      const container = document.getElementById('party-slots');
      container.innerHTML = '';
      for (let i = 0; i < 6; i++) {
        const slot = document.createElement('div');
        slot.className = 'party-slot';
        const pid = party[i];
        if (pid) {
          const p = (typeof POKEMON_DATA !== 'undefined' ? POKEMON_DATA.find(x => x.id === pid) : null) || { id: pid, img: 'images/gacha/' + pid + '.png' };
          slot.innerHTML = `<img src="${p.img}" onerror="this.src='images/slot1.png'">`;
          slot.onclick = () => {
            const found = POKEMON_DATA.find(x => x.id === pid);
            if (found) openModal(found);
          };
        } else {
          slot.innerHTML = `<span style="font-size:8px; color:#64748b;">(空)</span>`;
        }
        container.appendChild(slot);
      }
      document.getElementById('top-coins').textContent = coins.toLocaleString();
    }

    function toggleSortOrder() {
      currentSortOrder = (currentSortOrder === 'asc') ? 'desc' : 'asc';
      document.getElementById('btn-sort-order').textContent = (currentSortOrder === 'asc') ? '▲ 昇順' : '▼ 降順';
      filterAndRender();
    }

    function filterAndRender() {
      renderSlots();
      const grid = document.getElementById('dex-grid');
      grid.innerHTML = '';

      const query = document.getElementById('search-input').value.trim().toLowerCase();
      const sortType = document.getElementById('sort-type').value;
      const pool = (typeof POKEMON_DATA !== 'undefined') ? [...POKEMON_DATA] : [];

      let list = pool.filter(card => {
        if (!query) return true;
        const sub = card.subName || '';
        return card.name.toLowerCase().includes(query) || sub.toLowerCase().includes(query) || card.id.toLowerCase().includes(query);
      });

      list.sort((a, b) => {
        const statA = getPokeStats(a);
        const statB = getPokeStats(b);

        let valA, valB;
        if (sortType === 'name') {
          return currentSortOrder === 'asc' ? a.name.localeCompare(b.name, 'ja') : b.name.localeCompare(a.name, 'ja');
        } else if (sortType === 'lv') {
          valA = statA.lv; valB = statB.lv;
        } else if (sortType === 'atk') {
          valA = statA.atk; valB = statB.atk;
        } else if (sortType === 'def') {
          valA = statA.def; valB = statB.def;
        } else if (sortType === 'hp') {
          valA = statA.hp; valB = statB.hp;
        } else {
          valA = a.id; valB = b.id;
          return currentSortOrder === 'asc' ? valA.localeCompare(valB) : valB.localeCompare(valA);
        }

        return currentSortOrder === 'asc' ? (valA - valB) : (valB - valA);
      });

      list.forEach(card => {
        const count = inventory[card.id] || 0;
        const isOwned = count > 0;
        const inParty = party.includes(card.id);
        const isFav = (favoriteId === card.id);
        const stats = getPokeStats(card);

        const el = document.createElement('div');
        el.className = `dex-item ${isOwned ? '' : 'locked'} ${inParty ? 'in-party' : ''}`;
        el.innerHTML = `
          ${inParty ? '<span class="party-tag">手持ち</span>' : ''}
          ${isFav ? '<span class="fav-tag">★</span>' : ''}
          <span class="dex-rarity badge-${card.rarity}">${card.rarity}</span>
          <img src="${card.img}" loading="lazy" onerror="this.src='images/slot1.png'">
          <span class="dex-name">${isOwned ? card.name : '???'}</span>
          ${card.subName && isOwned ? `<span class="dex-subname">${card.subName}</span>` : ''}
          ${isOwned ? `<span class="dex-lv-tag">Lv.${stats.lv}</span>` : '<span style="font-size:7px; color:#64748b;">未所持</span>'}
        `;

        if (isOwned) {
          el.onclick = () => openModal(card);
        }
        grid.appendChild(el);
      });
    }

    function openModal(card) {
      selectedPokemon = card;
      const stats = getPokeStats(card);
      const inParty = party.includes(card.id);
      const isFav = (favoriteId === card.id);

      document.getElementById('modal-rarity').className = `dex-rarity badge-${card.rarity}`;
      document.getElementById('modal-rarity').textContent = card.rarity;
      document.getElementById('modal-img').src = card.img;
      document.getElementById('modal-name').textContent = card.name;
      document.getElementById('modal-subname').textContent = card.subName || '';

      document.getElementById('modal-lv').textContent = `Lv.${stats.lv}`;
      document.getElementById('modal-type-size').textContent = `${card.type || 'ノーマル'} / ${card.size || 'S'}`;
      document.getElementById('modal-hp').textContent = stats.hp;
      document.getElementById('modal-atk').textContent = stats.atk;
      document.getElementById('modal-def').textContent = stats.def;
      document.getElementById('modal-count').textContent = `x${stats.count}`;

      document.getElementById('modal-desc-text').textContent = card.desc 
        ? card.desc 
        : `【${card.name}】${card.subName ? `(${card.subName})` : ''}\n図鑑ID: ${card.id.toUpperCase()}\nタイプ: ${card.type || 'ノーマル'}\nサイズ: ${card.size || 'S'}\nレアリティ: ${card.rarity}`;

      const favBtn = document.getElementById('btn-fav-toggle');
      favBtn.className = `btn-fav-toggle ${isFav ? 'active' : ''}`;

      updatePartyBtnUI(card, inParty);

      switchTab('stat');
      document.getElementById('detail-modal').style.display = 'flex';
    }

    function switchTab(type) {
      document.getElementById('tab-stat-btn').classList.toggle('active', type === 'stat');
      document.getElementById('tab-desc-btn').classList.toggle('active', type === 'desc');
      document.getElementById('tab-stat-content').style.display = (type === 'stat') ? 'block' : 'none';
      document.getElementById('tab-desc-content').style.display = (type === 'desc') ? 'block' : 'none';
    }

    function updatePartyBtnUI(card, inParty) {
      const btn = document.getElementById('btn-party-toggle');
      const baseId = getBasePokemonId(card.id);
      const hasBase = (inventory[baseId] > 0);

      if (inParty) {
        btn.className = 'party-toggle-btn btn-remove-party';
        btn.textContent = '手持ちから外す';
        btn.disabled = false;
      } else {
        if (!hasBase) {
          btn.className = 'party-toggle-btn btn-disabled-party';
          btn.textContent = '⚠️ たねポケモン未所持 (編成不可)';
          btn.disabled = true;
        } else {
          btn.className = 'party-toggle-btn btn-add-party';
          btn.textContent = '手持ちに入れる (出撃枠)';
          btn.disabled = false;
        }
      }
    }

    function togglePartyFromModal() {
      if (!selectedPokemon) return;
      const id = selectedPokemon.id;
      const inParty = party.includes(id);

      if (inParty) {
        party = party.filter(x => x !== id);
      } else {
        if (party.length >= 6) {
          alert('手持ちは最大6体までだぜ！');
          return;
        }
        party.push(id);
      }

      localStorage.setItem('my_battle_party', JSON.stringify(party));
      if (typeof window.saveGameDataToCloud === 'function') {
        window.saveGameDataToCloud();
      }
      updatePartyBtnUI(selectedPokemon, !inParty);
      filterAndRender();
    }

    function toggleFavoriteFromModal() {
      if (!selectedPokemon) return;
      const id = selectedPokemon.id;
      if (favoriteId === id) {
        favoriteId = '';
        localStorage.removeItem('my_favorite_pokemon');
      } else {
        favoriteId = id;
        localStorage.setItem('my_favorite_pokemon', id);
      }
      if (typeof window.saveGameDataToCloud === 'function') {
        window.saveGameDataToCloud();
      }
      document.getElementById('btn-fav-toggle').classList.toggle('active', favoriteId === id);
      filterAndRender();
    }

    function levelUpFromModal() {
      if (!selectedPokemon) return;
      if (coins < 100) {
        alert('コインが足りないぜ！ (必要: 100G)');
        return;
      }

      coins -= 100;
      localStorage.setItem('my_casino_coins', coins);

      const baseId = getBasePokemonId(selectedPokemon.id);
      const curLv = levels[baseId] || 1;
      levels[baseId] = curLv + 1;
      localStorage.setItem('my_partner_levels', JSON.stringify(levels));

      if (typeof window.saveGameDataToCloud === 'function') {
        window.saveGameDataToCloud();
      }

      const stats = getPokeStats(selectedPokemon);
      document.getElementById('modal-lv').textContent = `Lv.${stats.lv}`;
      document.getElementById('modal-hp').textContent = stats.hp;
      document.getElementById('modal-atk').textContent = stats.atk;
      document.getElementById('modal-def').textContent = stats.def;
      document.getElementById('top-coins').textContent = coins.toLocaleString();

      filterAndRender();
    }

    function closeModal() {
      document.getElementById('detail-modal').style.display = 'none';
    }

    window.addEventListener('DOMContentLoaded', filterAndRender);
  </script>
</body>
</html>
