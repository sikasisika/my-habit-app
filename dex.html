<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ポケモン図鑑 | コレクションスタジオ</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f172a;
    }

    body {
      background-image: radial-gradient(circle at 50% 20%, #312e81 0%, #0f172a 70%, #022c22 100%);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 12px;
      padding-top: calc(6px + env(safe-area-inset-top));
      padding-bottom: calc(6px + env(safe-area-inset-bottom));
    }

    .container {
      width: 100%;
      max-width: 420px;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 6px;
      justify-content: flex-start;
      position: relative;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .top-btn {
      color: #ffffff;
      text-decoration: none;
      font-size: 11px;
      font-weight: bold;
      background: rgba(255, 255, 255, 0.12);
      padding: 4px 10px;
      border-radius: 20px;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .nav-links {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }
    .nav-btn {
      flex: 1;
      padding: 6px 0;
      border-radius: 10px;
      font-size: 11px;
      font-weight: bold;
      text-decoration: none;
      text-align: center;
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      transition: all 0.15s ease;
    }
    .nav-btn.active {
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      border-color: #818cf8;
      box-shadow: 0 2px 8px rgba(99, 102, 241, 0.4);
    }

    /* 手持ち6体プレビュー枠 */
    .party-preview-bar {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(8px);
      border-radius: 12px;
      padding: 4px 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid rgba(255, 255, 255, 0.15);
      flex-shrink: 0;
    }
    .party-slots {
      display: flex;
      gap: 4px;
    }
    .party-slot {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .party-slot img { width: 100%; height: 100%; object-fit: contain; }

    .dex-card-container {
      flex: 1 1 0%;
      min-height: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 10px;
      overflow-y: auto;
    }

    .dex-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .dex-item {
      border-radius: 12px;
      padding: 8px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      position: relative;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.1);
      cursor: pointer;
    }
    .dex-item.in-party {
      border: 2px solid #38bdf8;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
    }
    .dex-item.locked {
      background: rgba(0, 0, 0, 0.6) !important;
      border: 1px dashed rgba(255, 255, 255, 0.15) !important;
      cursor: not-allowed;
    }
    .dex-item.locked img { filter: brightness(0) !important; opacity: 0.28; }

    .dex-item img { width: 56px; height: 56px; object-fit: contain; }
    .dex-name { font-size: 10px; font-weight: 800; color: #fff; text-align: center; }
    .dex-rarity { font-size: 8px; font-weight: 900; padding: 1px 5px; border-radius: 4px; }
    .badge-N { background: #64748b; color: #fff; }
    .badge-R { background: #38bdf8; color: #fff; }
    .badge-SR { background: #a855f7; color: #fff; }
    .badge-SSR { background: #ec4899; color: #fff; }
    .badge-UR { background: linear-gradient(90deg, #f59e0b, #ef4444); color: #fff; }
  </style>
</head>
<body>

  <div class="container">
    
    <div class="top-bar">
      <a href="index.html" class="top-btn">◀ ポータル</a>
      <span style="font-size: 11px; font-weight: bold; color: #cbd5e1;">COLLECTION DEX</span>
      <a href="train.html" class="top-btn" style="background:#10b981;">🌱 育成ジム</a>
    </div>

    <div class="nav-links">
      <a href="battle.html" class="nav-btn">⚔️ バトル</a>
      <a href="train.html" class="nav-btn">🌱 育成</a>
      <a href="dex.html" class="nav-btn active">📖 図鑑</a>
      <a href="gacha.html" class="nav-btn">✨ ガチャ</a>
    </div>

    <!-- 手持ち6枠プレビュー（タップで登録/解除） -->
    <div class="party-preview-bar">
      <span style="font-size:10px; color:#cbd5e1;">手持ち (最大6体):</span>
      <div class="party-slots" id="party-slots"></div>
    </div>

    <div class="dex-card-container">
      <div class="dex-grid" id="dex-grid"></div>
    </div>

  </div>

  <script src="pokemonData.js"></script>

  <script>
    const inventory = JSON.parse(localStorage.getItem('my_gacha_inventory') || '{}');
    let party = JSON.parse(localStorage.getItem('my_battle_party') || '["p0004"]');

    function renderSlots() {
      const slotsContainer = document.getElementById('party-slots');
      slotsContainer.innerHTML = '';
      for (let i = 0; i < 6; i++) {
        const slot = document.createElement('div');
        slot.className = 'party-slot';
        if (party[i]) {
          const p = (typeof POKEMON_DATA !== 'undefined' ? POKEMON_DATA.find(x => x.id === party[i]) : null) || { img: 'images/gacha/p0004.png' };
          slot.innerHTML = `<img src="${p.img}" onerror="this.src='images/slot1.png'">`;
        }
        slotsContainer.appendChild(slot);
      }
    }

    function renderDex() {
      renderSlots();
      const grid = document.getElementById('dex-grid');
      grid.innerHTML = '';
      const pool = (typeof POKEMON_DATA !== 'undefined') ? POKEMON_DATA : [];

      pool.forEach(card => {
        const count = inventory[card.id] || 0;
        const isOwned = count > 0;
        const inParty = party.includes(card.id);

        const el = document.createElement('div');
        el.className = `dex-item ${isOwned ? '' : 'locked'} ${inParty ? 'in-party' : ''}`;
        el.innerHTML = `
          <span class="dex-rarity badge-${card.rarity}">${card.rarity}</span>
          <img src="${card.img}" onerror="this.src='images/slot1.png'">
          <span class="dex-name">${isOwned ? card.name : '???'}</span>
          ${inParty ? '<span style="font-size:8px; color:#38bdf8; font-weight:bold;">手持ち中</span>' : ''}
        `;

        if (isOwned) {
          el.onclick = () => {
            if (inParty) {
              party = party.filter(id => id !== card.id);
            } else {
              if (party.length >= 6) { alert('手持ちは最大6体までだぜ！'); return; }
              party.push(card.id);
            }
            localStorage.setItem('my_battle_party', JSON.stringify(party));
            renderDex();
          };
        }
        grid.appendChild(el);
      });
    }

    window.addEventListener('DOMContentLoaded', renderDex);
  </script>
</body>
</html>
