<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ポケモン図鑑 | コレクションスタジオ</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f172a;
    }

    body {
      background-image: radial-gradient(circle at 50% 20%, #312e81 0%, #0f172a 70%, #020617 100%);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 12px;
      padding-top: calc(6px + env(safe-area-inset-top));
      padding-bottom: calc(6px + env(safe-area-inset-bottom));
    }

    .container {
      width: 100%;
      max-width: 420px;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 6px;
      justify-content: flex-start;
      position: relative;
    }

    /* ヘッダー */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .top-btn {
      color: #ffffff;
      text-decoration: none;
      font-size: 11px;
      font-weight: bold;
      background: rgba(255, 255, 255, 0.12);
      padding: 4px 10px;
      border-radius: 20px;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    /* ナビゲーション */
    .nav-links {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }
    .nav-btn {
      flex: 1;
      padding: 6px 0;
      border-radius: 10px;
      font-size: 11px;
      font-weight: bold;
      text-decoration: none;
      text-align: center;
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      transition: all 0.15s ease;
    }
    .nav-btn.active {
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      border-color: #818cf8;
      box-shadow: 0 2px 8px rgba(99, 102, 241, 0.4);
    }
    .nav-btn:active { transform: scale(0.96); }

    /* 図鑑進捗バー */
    .progress-bar {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(8px);
      border-radius: 12px;
      padding: 6px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid rgba(255, 255, 255, 0.15);
      flex-shrink: 0;
    }
    .progress-val {
      font-size: 15px;
      font-weight: 900;
      color: #38bdf8;
    }

    /* 図鑑グリッドカード */
    .dex-card-container {
      flex: 1 1 0%;
      min-height: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 10px;
      overflow-y: auto;
    }

    .dex-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .dex-item {
      border-radius: 12px;
      padding: 8px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      position: relative;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: transform 0.1s ease;
    }
    .dex-item:active { transform: scale(0.96); }

    .dex-item img {
      width: 58px;
      height: 58px;
      object-fit: contain;
      filter: drop-shadow(0 3px 6px rgba(0,0,0,0.5));
    }

    /* 未所持（ブラックアウト・シルエット） */
    .dex-item.locked {
      background: rgba(0, 0, 0, 0.6) !important;
      border: 1px dashed rgba(255, 255, 255, 0.15) !important;
      box-shadow: none !important;
    }
    .dex-item.locked img {
      filter: brightness(0) !important;
      opacity: 0.28;
    }
    .dex-item.locked .dex-name {
      color: #64748b;
    }
    .dex-item.locked .dex-rarity {
      background: #334155 !important;
      color: #94a3b8 !important;
    }

    /* 所持状態・レアリティ別後光エフェクト */
    .halo-N {
      border: 1px solid rgba(255, 255, 255, 0.25);
    }
    .halo-R {
      background: radial-gradient(circle, rgba(226, 232, 240, 0.2) 0%, rgba(15, 23, 42, 0.6) 80%);
      border: 1.5px solid #cbd5e1;
      box-shadow: 0 0 10px rgba(226, 232, 240, 0.4);
    }
    .halo-SR {
      background: radial-gradient(circle, rgba(251, 191, 36, 0.25) 0%, rgba(15, 23, 42, 0.6) 80%);
      border: 1.5px solid #fbbf24;
      box-shadow: 0 0 12px rgba(251, 191, 36, 0.5);
    }
    .halo-SSR {
      background: radial-gradient(circle, rgba(168, 85, 247, 0.3) 0%, rgba(15, 23, 42, 0.6) 80%);
      border: 1.5px solid #c084fc;
      box-shadow: 0 0 14px rgba(168, 85, 247, 0.6);
    }
    .halo-UR {
      background: radial-gradient(circle, rgba(244, 63, 94, 0.25) 0%, rgba(56, 189, 248, 0.25) 50%, rgba(15, 23, 42, 0.7) 100%);
      border: 1.5px solid #f43f5e;
      box-shadow: 0 0 16px rgba(244, 63, 94, 0.7);
      animation: rainbowBorder 3s infinite linear;
    }
    @keyframes rainbowBorder {
      0% { filter: hue-rotate(0deg); }
      100% { filter: hue-rotate(360deg); }
    }

    .dex-name {
      font-size: 10px;
      font-weight: 800;
      color: #fff;
      text-align: center;
      line-height: 1.2;
    }

    .dex-count {
      font-size: 9px;
      color: #facc15;
      font-weight: bold;
    }

    .dex-rarity { font-size: 8px; font-weight: 900; padding: 1px 5px; border-radius: 4px; }
    .badge-UR  { background: linear-gradient(90deg, #f59e0b, #ef4444); color: #fff; }
    .badge-SSR { background: #ec4899; color: #fff; }
    .badge-SR  { background: #a855f7; color: #fff; }
    .badge-R   { background: #38bdf8; color: #fff; }
    .badge-N   { background: #64748b; color: #fff; }
  </style>
</head>
<body>

  <div class="container">
    
    <div class="top-bar">
      <a href="index.html" class="top-btn">◀ ポータル</a>
      <span style="font-size: 11px; font-weight: bold; color: #cbd5e1;">COLLECTION DEX</span>
      <span style="width: 50px;"></span>
    </div>

    <!-- ナビゲーション -->
    <div class="nav-links">
      <a href="game3.html" class="nav-btn">🎰 スロット</a>
      <a href="gacha.html" class="nav-btn">✨ ガチャ</a>
      <a href="dex.html" class="nav-btn active">📖 図鑑</a>
    </div>

    <!-- コンプリート率 -->
    <div class="progress-bar">
      <span style="font-size:11px; color:#cbd5e1;">🏆 図鑑完成度:</span>
      <span class="progress-val" id="progress-text">0 / 0 (0%)</span>
    </div>

    <!-- 図鑑一覧 -->
    <div class="dex-card-container">
      <div class="dex-grid" id="dex-grid"></div>
    </div>

  </div>

  <script>
    // ガチャと完全に一致させたポケモン図鑑リスト
    const DEX_POOL = [
      { id: 'p0001', name: 'フシギダネ', rarity: 'N', img: 'images/gacha/p0001.png' },
      { id: 'p0002', name: 'フシギソウ', rarity: 'R', img: 'images/gacha/p0002.png' },
      { id: 'p0003', name: 'フシギバナ', rarity: 'SR', img: 'images/gacha/p0003.png' },
      { id: 'p0003-3', name: 'メガフシギバナ', rarity: 'SSR', img: 'images/gacha/p0003-3.png' },
      { id: 'p0003-33', name: 'キョダイフシギバナ', rarity: 'UR', img: 'images/gacha/p0003-33.png' },
      { id: 'p0004', name: 'ヒトカゲ', rarity: 'N', img: 'images/gacha/p0004.png' },
      { id: 'p0005', name: 'リザード', rarity: 'R', img: 'images/gacha/p0005.png' },
      { id: 'p0006', name: 'リザードン', rarity: 'SR', img: 'images/gacha/p0006.png' },
      { id: 'p0006-6x', name: 'メガリザードンX', rarity: 'SSR', img: 'images/gacha/p0006-6x.png' },
      { id: 'p0006-6y', name: 'メガリザードンY', rarity: 'SSR', img: 'images/gacha/p0006-6y.png' },
      { id: 'p0006-66', name: 'キョダイリザードン', rarity: 'UR', img: 'images/gacha/p0006-66.png' },
      { id: 'p0007', name: 'ゼニガメ', rarity: 'N', img: 'images/gacha/p0007.png' },
      { id: 'p0008', name: 'カメール', rarity: 'R', img: 'images/gacha/p0008.png' },
      { id: 'p0009', name: 'カメックス', rarity: 'SR', img: 'images/gacha/p0009.png' },
      { id: 'p0009-9', name: 'メガカメックス', rarity: 'SSR', img: 'images/gacha/p0009-9.png' },
      { id: 'p0009-99', name: 'キョダイカメックス', rarity: 'UR', img: 'images/gacha/p0009-99.png' },
      { id: 'p0015', name: 'スピアー', rarity: 'SR', img: 'images/gacha/p0015.png' },
      { id: 'p0018', name: 'ピジョット', rarity: 'SR', img: 'images/gacha/p0018.png' },
      { id: 'p0038', name: 'キュウコン', rarity: 'SR', img: 'images/gacha/p0038.png' },
      { id: 'p0059', name: 'ウィンディ', rarity: 'SR', img: 'images/gacha/p0059.png' },
      { id: 'p0094', name: 'ゲンガー', rarity: 'SR', img: 'images/gacha/p0094.png' },
      { id: 'p0445', name: 'ガブリアス', rarity: 'SR', img: 'images/gacha/p0445.png' },
      { id: 'p0448', name: 'ルカリオ', rarity: 'SR', img: 'images/gacha/p0448.png' }
    ];

    function renderDex() {
      const inventory = JSON.parse(localStorage.getItem('my_gacha_inventory') || '{}');
      const grid = document.getElementById('dex-grid');
      grid.innerHTML = '';

      let ownedCount = 0;

      DEX_POOL.forEach(card => {
        const count = inventory[card.id] || 0;
        const isOwned = count > 0;
        if (isOwned) ownedCount++;

        const el = document.createElement('div');
        el.className = `dex-item ${isOwned ? 'halo-' + card.rarity : 'locked'}`;

        el.innerHTML = `
          <span class="dex-rarity badge-${card.rarity}">${card.rarity}</span>
          <img src="${card.img}" alt="" onerror="this.src='images/slot1.png'">
          <span class="dex-name">${isOwned ? card.name : '???'}</span>
          ${isOwned ? `<span class="dex-count">x${count}</span>` : '<span style="font-size:8px; color:#64748b;">未所持</span>'}
        `;
        grid.appendChild(el);
      });

      const rate = Math.round((ownedCount / DEX_POOL.length) * 100);
      document.getElementById('progress-text').textContent = `${ownedCount} / ${DEX_POOL.length} (${rate}%)`;
    }

    window.addEventListener('DOMContentLoaded', renderDex);
  </script>
</body>
</html>
