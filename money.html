<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>お小遣い＆資産管理</title>

  <!-- Firebase SDK (v9 compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent !important;
      outline: none !important;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f7f9fa;
      padding: 16px;
      color: #333;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
    }

    /* 上部ナビゲーション＆設定バー */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .back-nav a {
      color: #0070f3;
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
    }

    .top-right-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* 同期ステータスバッジ */
    .sync-status-badge {
      font-size: 10px;
      font-weight: bold;
      color: #059669;
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      padding: 3px 6px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 3px;
    }
    .sync-status-badge.syncing {
      color: #d97706;
      background: #fffbeb;
      border-color: #fde68a;
    }

    .top-action-btn {
      font-size: 11px;
      color: #555;
      background: #fff;
      padding: 3px 8px;
      border-radius: 20px;
      border: 1px solid #ddd;
      cursor: pointer;
      font-weight: bold;
    }
    .top-action-btn:active { opacity: 0.7; }

    /* 確認通知トグルスイッチ */
    .confirm-toggle-label {
      font-size: 11px;
      color: #555;
      display: flex;
      align-items: center;
      gap: 4px;
      background: #fff;
      padding: 3px 8px;
      border-radius: 20px;
      border: 1px solid #ddd;
      cursor: pointer;
    }

    .card {
      background: #ffffff;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    .card-suica {
      border: 2px solid #28a745;
    }

    h1 {
      font-size: 20px;
      margin-top: 0;
      margin-bottom: 16px;
      text-align: center;
    }

    h2 {
      font-size: 16px;
      margin-top: 0;
      margin-bottom: 12px;
      border-left: 4px solid #0070f3;
      padding-left: 8px;
    }

    .suica-title {
      border-left-color: #28a745;
      color: #1e7e34;
    }

    /* メイン資産サマリー */
    .total-summary {
      background: linear-gradient(135deg, #0070f3, #00c6ff);
      color: white;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      margin-bottom: 16px;
    }
    .total-summary p {
      margin: 0;
      font-size: 13px;
      opacity: 0.9;
    }
    .total-summary .grand-total {
      font-size: 28px;
      font-weight: bold;
      margin: 4px 0;
    }

    .balance-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
    }
    .balance-item {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      padding: 8px 4px;
      text-align: center;
    }
    .balance-item span {
      font-size: 11px;
      display: block;
      white-space: nowrap;
    }
    .balance-item strong {
      font-size: 14px;
      display: block;
      margin-top: 2px;
    }

    /* Suica専用サマリー */
    .suica-summary {
      background: #e8f5e9;
      border: 1px solid #c8e6c9;
      border-radius: 8px;
      padding: 10px;
      text-align: center;
      margin-bottom: 10px;
    }
    .suica-summary p {
      margin: 0;
      font-size: 12px;
      color: #2e7d32;
    }
    .suica-summary .suica-total {
      font-size: 22px;
      font-weight: bold;
      color: #1b5e20;
    }

    /* 🚆 通勤クイックボタン */
    .commute-box {
      background: #f1f8f3;
      border: 1px dashed #28a745;
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 12px;
    }
    .commute-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      font-size: 12px;
      font-weight: bold;
      color: #1e7e34;
    }
    .commute-config-btn {
      background: none;
      border: none;
      color: #666;
      font-size: 12px;
      cursor: pointer;
      padding: 0;
      text-decoration: underline;
    }
    .commute-route-select {
      font-size: 11px;
      padding: 2px 4px;
      border-radius: 4px;
      border: 1px solid #ccc;
    }
    .commute-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .btn-quick {
      padding: 8px 4px;
      font-size: 12px;
      font-weight: bold;
      color: #fff;
      background-color: #28a745;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-quick:active { opacity: 0.8; }

    .commute-settings {
      display: none;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 8px;
      margin-top: 6px;
      font-size: 11px;
    }
    .commute-settings input {
      width: 60px;
      padding: 2px 4px;
      font-size: 11px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    /* 入力フォーム共通 */
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
    }
    .input-group select, .input-group input {
      padding: 10px;
      font-size: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
      width: 100%;
    }

    .btn {
      width: 100%;
      padding: 10px;
      font-size: 15px;
      font-weight: bold;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .btn-main { background-color: #0070f3; }
    .btn-suica { background-color: #28a745; }
    .btn:active { opacity: 0.8; }

    /* 履歴リスト */
    .expense-list {
      list-style: none;
      padding: 0;
      margin: 0;
      max-height: 180px;
      overflow-y: auto;
    }
    .expense-list li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px dashed #eee;
      font-size: 13px;
    }
    .badge {
      display: inline-block;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      margin-right: 4px;
      color: white;
    }
    .badge-cash { background-color: #ff9800; }
    .badge-bank { background-color: #00bcd4; }
    
    .amount-plus { color: #28a745; font-weight: bold; margin-right: 8px; }
    .amount-minus { color: #333; font-weight: bold; margin-right: 8px; }

    .delete-btn {
      background-color: #ff4d4f;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 3px 6px;
      font-size: 11px;
      cursor: pointer;
    }

    /* ========================================================= */
    /* 🔒 PINコード（暗証番号）ロック画面オーバーレイ */
    /* ========================================================= */
    .lock-overlay {
      position: fixed;
      inset: 0;
      background: #0f172a;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #fff;
    }
    .lock-icon {
      font-size: 44px;
      margin-bottom: 10px;
    }
    .lock-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 6px;
    }
    .lock-subtitle {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 24px;
    }
    .pin-dots {
      display: flex;
      gap: 16px;
      margin-bottom: 30px;
    }
    .pin-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid #38bdf8;
      background: transparent;
      transition: background 0.15s ease, transform 0.15s ease;
    }
    .pin-dot.filled {
      background: #38bdf8;
      transform: scale(1.15);
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.8);
    }
    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px 24px;
      width: 100%;
      max-width: 280px;
    }
    .key-btn {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      font-size: 24px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      margin: 0 auto;
      transition: transform 0.08s ease, background 0.08s ease;
    }
    .key-btn:active {
      transform: scale(0.9);
      background: rgba(56, 189, 248, 0.4);
    }
    .key-btn.action-key {
      font-size: 13px;
      background: transparent;
      border-color: transparent;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <!-- 🔒 ロック画面オーバーレイ（初期状態で完全表示） -->
  <div class="lock-overlay" id="lock-screen">
    <div class="lock-icon">🔐</div>
    <div class="lock-title" id="lock-msg-title">暗証番号を入力</div>
    <div class="lock-subtitle" id="lock-msg-sub">4桁のパスコードを入力してください</div>
    
    <div class="pin-dots">
      <div class="pin-dot" id="dot-0"></div>
      <div class="pin-dot" id="dot-1"></div>
      <div class="pin-dot" id="dot-2"></div>
      <div class="pin-dot" id="dot-3"></div>
    </div>

    <div class="keypad">
      <button class="key-btn" onclick="pressKey('1')">1</button>
      <button class="key-btn" onclick="pressKey('2')">2</button>
      <button class="key-btn" onclick="pressKey('3')">3</button>
      <button class="key-btn" onclick="pressKey('4')">4</button>
      <button class="key-btn" onclick="pressKey('5')">5</button>
      <button class="key-btn" onclick="pressKey('6')">6</button>
      <button class="key-btn" onclick="pressKey('7')">7</button>
      <button class="key-btn" onclick="pressKey('8')">8</button>
      <button class="key-btn" onclick="pressKey('9')">9</button>
      <button class="key-btn action-key" onclick="location.href='index.html'">◀ 戻る</button>
      <button class="key-btn" onclick="pressKey('0')">0</button>
      <button class="key-btn action-key" onclick="deleteKey()">⌫ 消す</button>
    </div>
  </div>

  <div class="container" id="main-content">
    
    <!-- ナビ ＆ 同期ステータス ＆ 設定 -->
    <div class="top-bar">
      <div class="back-nav">
        <a href="index.html">◀ ポータルへ戻る</a>
      </div>
      <div class="top-right-group">
        <span id="sync-status" class="sync-status-badge">☁️ クラウド同期中...</span>
        <button class="top-action-btn" onclick="openLockSettings()">🔒 PIN設定</button>
        <label class="confirm-toggle-label">
          <input type="checkbox" id="confirm-toggle" onchange="toggleConfirmSetting()">
          <span>🔔 確認</span>
        </label>
      </div>
    </div>

    <h1>💰 お小遣い・資産管理</h1>

    <!-- 1. 総資産サマリー -->
    <div class="total-summary">
      <p>現在の総資産合計（現金＋銀行＋Suica）</p>
      <div class="grand-total"><span id="total-assets">0</span> 円</div>
      
      <div class="balance-grid">
        <div class="balance-item">
          <span>💵 手持ち現金</span>
          <strong><span id="cash-balance">0</span> 円</strong>
        </div>
        <div class="balance-item">
          <span>🏦 銀行・通帳</span>
          <strong><span id="bank-balance">0</span> 円</strong>
        </div>
        <div class="balance-item">
          <span>🐧 Suica残高</span>
          <strong><span id="top-suica-balance">0</span> 円</strong>
        </div>
      </div>
    </div>

    <!-- 2. 現金・銀行の記録 -->
    <div class="card">
      <h2>📝 現金・銀行の記録</h2>
      <div class="input-group">
        <select id="main-direction">
          <option value="expense">🔻 支出・引き落とし（減らす）</option>
          <option value="income">🔺 入金・チャージ（増やす）</option>
        </select>
        <select id="main-account">
          <option value="cash">💵 手持ち現金</option>
          <option value="bank">🏦 銀行・通帳</option>
        </select>
        <input type="number" id="main-amount" placeholder="金額 (円) ※必須" min="1">
        <input type="text" id="main-memo" placeholder="内容 (例: おやつ、携帯代)">
      </div>
      <button type="button" class="btn btn-main" onclick="recordMainTransaction()">記録する</button>

      <h3 style="font-size: 13px; margin: 14px 0 6px; color: #666;">最近の現金・銀行履歴</h3>
      <ul id="main-log-list" class="expense-list"></ul>
    </div>

    <!-- 3. Suica専用管理 ＆ 通勤クイックボタン -->
    <div class="card card-suica">
      <h2 class="suica-title">🐧 Suica残高管理</h2>
      
      <div class="suica-summary">
        <p>現在のSuica残高</p>
        <div class="suica-total"><span id="suica-balance">0</span> 円</div>
      </div>

      <!-- 通勤ワンタップ -->
      <div class="commute-box">
        <div class="commute-header">
          <div>
            <span>🚆 通勤ワンタップ: </span>
            <select id="route-select" class="commute-route-select" onchange="switchRoute()">
              <option value="A">ルートA</option>
              <option value="B">ルートB</option>
            </select>
          </div>
          <button type="button" class="commute-config-btn" onclick="toggleCommuteSettings()">⚙️ 運賃設定</button>
        </div>

        <div class="commute-actions">
          <button type="button" class="btn-quick" onclick="quickCommute('行き')">
            行き (<span id="btn-fare-go">0</span>円)
          </button>
          <button type="button" class="btn-quick" onclick="quickCommute('帰り')">
            帰り (<span id="btn-fare-back">0</span>円)
          </button>
        </div>

        <div id="commute-settings-panel" class="commute-settings">
          <div style="display: flex; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 4px;">
            <span>Aルート:</span>
            <span>行き <input type="number" id="fare-a-go">円</span>
            <span>帰り <input type="number" id="fare-a-back">円</span>
          </div>
          <div style="display: flex; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 6px;">
            <span>Bルート:</span>
            <span>行き <input type="number" id="fare-b-go">円</span>
            <span>帰り <input type="number" id="fare-b-back">円</span>
          </div>
          <button type="button" style="width: 100%; font-size: 11px; padding: 3px;" onclick="saveFares()">運賃を保存</button>
        </div>
      </div>

      <!-- Suica手動記録 -->
      <div class="input-group">
        <select id="suica-direction">
          <option value="expense">🔻 支払い・買い物（減らす）</option>
          <option value="income">🔺 チャージ（増やす）</option>
        </select>
        <input type="number" id="suica-amount" placeholder="金額 (円) ※必須" min="1">
        <input type="text" id="suica-memo" placeholder="内容 (例: 自販機、コンビニ)">
      </div>
      <button type="button" class="btn btn-suica" onclick="recordSuicaTransaction()">Suicaを記録する</button>

      <h3 style="font-size: 13px; margin: 14px 0 6px; color: #666;">最近のSuica履歴</h3>
      <ul id="suica-log-list" class="expense-list"></ul>
    </div>

  </div>

  <script>
    // =========================================================
    // 🔥 Firebase 初期化 ＆ Firestore連携
    // =========================================================
    const firebaseConfig = {
      apiKey: "AIzaSyDe2qsA9wEb1z3993Cz2EBJR2LY4GzUibk",
      authDomain: "my-private-chat-d5464.firebaseapp.com",
      projectId: "my-private-chat-d5464",
      storageBucket: "my-private-chat-d5464.firebasestorage.app",
      messagingSenderId: "272901563642",
      appId: "1:272901563642:web:af2c6f6d57572e33c61543"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();
    const moneyDocRef = db.collection('app_data').doc('money_assets');

    function setSyncStatus(isSyncing) {
      const badge = document.getElementById('sync-status');
      if (badge) {
        if (isSyncing) {
          badge.className = 'sync-status-badge syncing';
          badge.textContent = '☁️ 同期中...';
        } else {
          badge.className = 'sync-status-badge';
          badge.textContent = '☁️ クラウド同期済';
        }
      }
    }

    function getStoredNumber(key) {
      const val = localStorage.getItem(key);
      return (val !== null && val !== '') ? Number(val) : 0;
    }

    function getStoredJSON(key, defaultVal) {
      try {
        const val = localStorage.getItem(key);
        return val ? JSON.parse(val) : defaultVal;
      } catch(e) {
        return defaultVal;
      }
    }

    // =========================================================
    // 🔒 暗証番号（PIN）ロック機能
    // =========================================================
    let enteredPin = '';
    let isSettingMode = false;
    let tempNewPin = '';

    function checkLockOnLoad() {
      const savedPin = localStorage.getItem('my_money_pin');
      const isLockEnabled = localStorage.getItem('my_money_lock_enabled') !== 'false';

      if (!savedPin) {
        // 初回：PIN設定案内
        isSettingMode = true;
        tempNewPin = '';
        enteredPin = '';
        updateDots();
        document.getElementById('lock-msg-title').textContent = '暗証番号を登録';
        document.getElementById('lock-msg-sub').textContent = '新しい4桁の暗証番号を入力してください';
        document.getElementById('lock-screen').style.display = 'flex';
      } else if (isLockEnabled) {
        // ロック中
        isSettingMode = false;
        tempNewPin = '';
        enteredPin = '';
        updateDots();
        document.getElementById('lock-msg-title').textContent = '暗証番号を入力';
        document.getElementById('lock-msg-sub').textContent = '4桁のパスコードを入力してください';
        document.getElementById('lock-screen').style.display = 'flex';
      } else {
        // ロック解除済み/無効
        document.getElementById('lock-screen').style.display = 'none';
      }
    }

    function updateDots() {
      for (let i = 0; i < 4; i++) {
        const dot = document.getElementById(`dot-${i}`);
        if (dot) {
          if (i < enteredPin.length) dot.classList.add('filled');
          else dot.classList.remove('filled');
        }
      }
    }

    function pressKey(num) {
      if (enteredPin.length >= 4) return;
      enteredPin += num;
      updateDots();

      if (enteredPin.length === 4) {
        setTimeout(handlePinComplete, 120);
      }
    }

    function deleteKey() {
      if (enteredPin.length > 0) {
        enteredPin = enteredPin.slice(0, -1);
        updateDots();
      }
    }

    function handlePinComplete() {
      const savedPin = localStorage.getItem('my_money_pin');

      if (isSettingMode) {
        if (!tempNewPin) {
          tempNewPin = enteredPin;
          enteredPin = '';
          updateDots();
          document.getElementById('lock-msg-title').textContent = 'もう一度入力';
          document.getElementById('lock-msg-sub').textContent = '確認のため同じ暗証番号を入力してください';
        } else {
          if (enteredPin === tempNewPin) {
            localStorage.setItem('my_money_pin', enteredPin);
            localStorage.setItem('my_money_lock_enabled', 'true');
            syncToFirebaseAndLocal();
            alert('🔐 暗証番号を登録したぜ！');
            document.getElementById('lock-screen').style.display = 'none';
          } else {
            alert('暗証番号が一致しなかったぜ。最初からやり直してくれ！');
            tempNewPin = '';
            enteredPin = '';
            updateDots();
            checkLockOnLoad();
          }
        }
      } else {
        if (enteredPin === savedPin) {
          enteredPin = '';
          updateDots();
          document.getElementById('lock-screen').style.display = 'none';
        } else {
          alert('❌ 暗証番号が違います！');
          enteredPin = '';
          updateDots();
        }
      }
    }

    function openLockSettings() {
      const currentPin = localStorage.getItem('my_money_pin');
      const isEnabled = localStorage.getItem('my_money_lock_enabled') !== 'false';

      const action = confirm(
        `【暗証番号（PIN）ロック設定】\n\n現在の状態: ${isEnabled ? '🔒 有効' : '🔓 無効'}\n\n[OK] ➔ 暗証番号を変更・新規登録\n[キャンセル] ➔ ロック機能のON/OFF切り替え`
      );

      if (action) {
        if (currentPin) {
          const input = prompt('現在の4桁の暗証番号を入力してください:');
          if (input !== currentPin) {
            alert('暗証番号が違います！');
            return;
          }
        }
        isSettingMode = true;
        tempNewPin = '';
        enteredPin = '';
        updateDots();
        document.getElementById('lock-msg-title').textContent = '新しい暗証番号';
        document.getElementById('lock-msg-sub').textContent = '新しい4桁の暗証番号を入力してください';
        document.getElementById('lock-screen').style.display = 'flex';
      } else {
        const toggle = confirm(`暗証番号ロックを【${isEnabled ? '無効（次回からスキップ）' : '有効（毎回要求）'}】にしますか？`);
        if (toggle) {
          localStorage.setItem('my_money_lock_enabled', (!isEnabled).toString());
          syncToFirebaseAndLocal();
          alert(`ロックを【${!isEnabled ? '有効' : '無効'}】にしたぜ！`);
        }
      }
    }

    // =========================================================
    // Firebase への安全保存（Firestore ＋ LocalStorage）
    // =========================================================
    async function syncToFirebaseAndLocal() {
      setSyncStatus(true);
      const data = {
        cash: getStoredNumber('myCashBalance'),
        bank: getStoredNumber('myBankBalance'),
        suica: getStoredNumber('mySuicaBalance'),
        mainLogs: getStoredJSON('myMainLogs', []),
        suicaLogs: getStoredJSON('mySuicaLogs', []),
        fares: getStoredJSON('myCommuteFares', { aGo: 220, aBack: 220, bGo: 350, bBack: 350 }),
        currentRoute: localStorage.getItem('myCurrentRoute') || 'A',
        confirmSetting: localStorage.getItem('myConfirmSetting') !== 'false',
        moneyPin: localStorage.getItem('my_money_pin') || '',
        lockEnabled: localStorage.getItem('my_money_lock_enabled') !== 'false',
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      };

      try {
        await moneyDocRef.set(data, { merge: true });
        setSyncStatus(false);
      } catch (err) {
        console.error('Firebase save error:', err);
        setSyncStatus(false);
      }
    }

    // Firebase からの自動読み込み＆リアルタイム同期
    function listenToFirebase() {
      moneyDocRef.onSnapshot((doc) => {
        if (doc.exists) {
          const d = doc.data();
          if (d.cash !== undefined) localStorage.setItem('myCashBalance', d.cash);
          if (d.bank !== undefined) localStorage.setItem('myBankBalance', d.bank);
          if (d.suica !== undefined) localStorage.setItem('mySuicaBalance', d.suica);
          if (d.mainLogs !== undefined) localStorage.setItem('myMainLogs', JSON.stringify(d.mainLogs));
          if (d.suicaLogs !== undefined) localStorage.setItem('mySuicaLogs', JSON.stringify(d.suicaLogs));
          if (d.fares !== undefined) localStorage.setItem('myCommuteFares', JSON.stringify(d.fares));
          if (d.currentRoute !== undefined) localStorage.setItem('myCurrentRoute', d.currentRoute);
          if (d.confirmSetting !== undefined) localStorage.setItem('myConfirmSetting', d.confirmSetting);
          if (d.moneyPin !== undefined && d.moneyPin !== '') localStorage.setItem('my_money_pin', d.moneyPin);
          
          updateDisplay();
          setSyncStatus(false);
        } else {
          syncToFirebaseAndLocal();
        }
      }, (error) => {
        console.error('Firebase listen error:', error);
        setSyncStatus(false);
      });
    }

    function updateDisplay() {
      const cash = getStoredNumber('myCashBalance');
      const bank = getStoredNumber('myBankBalance');
      const suica = getStoredNumber('mySuicaBalance');
      const mainLogs = getStoredJSON('myMainLogs', []);
      const suicaLogs = getStoredJSON('mySuicaLogs', []);
      const isConfirmEnabled = localStorage.getItem('myConfirmSetting') !== 'false';

      document.getElementById('confirm-toggle').checked = isConfirmEnabled;

      document.getElementById('cash-balance').textContent = cash.toLocaleString();
      document.getElementById('bank-balance').textContent = bank.toLocaleString();
      document.getElementById('top-suica-balance').textContent = suica.toLocaleString();
      
      const total = cash + bank + suica;
      document.getElementById('total-assets').textContent = total.toLocaleString();

      // 現金・銀行履歴
      const mainList = document.getElementById('main-log-list');
      mainList.innerHTML = '';
      if (mainLogs.length === 0) {
        mainList.innerHTML = '<li style="color:#999; justify-content:center;">履歴はありません</li>';
      } else {
        for (let i = mainLogs.length - 1; i >= 0; i--) {
          const item = mainLogs[i];
          const li = document.createElement('li');
          const badgeClass = item.account === 'cash' ? 'badge-cash' : 'badge-bank';
          const badgeText = item.account === 'cash' ? '現金' : '銀行';
          const isIncome = item.direction === 'income';
          const sign = isIncome ? '+' : '-';
          const amountClass = isIncome ? 'amount-plus' : 'amount-minus';

          li.innerHTML = `
            <div>
              <span class="badge ${badgeClass}">${badgeText}</span>
              <strong>${item.memo}</strong>
              <div style="font-size:11px; color:#888;">${item.date}</div>
            </div>
            <div>
              <span class="${amountClass}">${sign}${Number(item.amount).toLocaleString()}円</span>
              <button class="delete-btn" onclick="deleteMainLog(${i})">削除</button>
            </div>
          `;
          mainList.appendChild(li);
        }
      }

      // Suica履歴
      document.getElementById('suica-balance').textContent = suica.toLocaleString();
      const suicaList = document.getElementById('suica-log-list');
      suicaList.innerHTML = '';
      if (suicaLogs.length === 0) {
        suicaList.innerHTML = '<li style="color:#999; justify-content:center;">履歴はありません</li>';
      } else {
        for (let i = suicaLogs.length - 1; i >= 0; i--) {
          const item = suicaLogs[i];
          const li = document.createElement('li');
          const isIncome = item.direction === 'income';
          const sign = isIncome ? '+' : '-';
          const amountClass = isIncome ? 'amount-plus' : 'amount-minus';

          li.innerHTML = `
            <div>
              <strong>${item.memo}</strong>
              <div style="font-size:11px; color:#888;">${item.date}</div>
            </div>
            <div>
              <span class="${amountClass}">${sign}${Number(item.amount).toLocaleString()}円</span>
              <button class="delete-btn" onclick="deleteSuicaLog(${i})">削除</button>
            </div>
          `;
          suicaList.appendChild(li);
        }
      }

      updateCommuteButtonLabels();
    }

    function toggleConfirmSetting() {
      const isChecked = document.getElementById('confirm-toggle').checked;
      localStorage.setItem('myConfirmSetting', isChecked);
      syncToFirebaseAndLocal();
    }

    function updateCommuteButtonLabels() {
      const fares = getStoredJSON('myCommuteFares', { aGo: 220, aBack: 220, bGo: 350, bBack: 350 });
      const currentRoute = localStorage.getItem('myCurrentRoute') || 'A';

      document.getElementById('route-select').value = currentRoute;
      const goFare = currentRoute === 'A' ? fares.aGo : fares.bGo;
      const backFare = currentRoute === 'A' ? fares.aBack : fares.bBack;

      document.getElementById('btn-fare-go').textContent = Number(goFare).toLocaleString();
      document.getElementById('btn-fare-back').textContent = Number(backFare).toLocaleString();
    }

    function switchRoute() {
      const currentRoute = document.getElementById('route-select').value;
      localStorage.setItem('myCurrentRoute', currentRoute);
      updateCommuteButtonLabels();
      syncToFirebaseAndLocal();
    }

    function toggleCommuteSettings() {
      const panel = document.getElementById('commute-settings-panel');
      const isOpen = panel.style.display === 'block';
      panel.style.display = isOpen ? 'none' : 'block';

      if (!isOpen) {
        const fares = getStoredJSON('myCommuteFares', { aGo: 220, aBack: 220, bGo: 350, bBack: 350 });
        document.getElementById('fare-a-go').value = fares.aGo;
        document.getElementById('fare-a-back').value = fares.aBack;
        document.getElementById('fare-b-go').value = fares.bGo;
        document.getElementById('fare-b-back').value = fares.bBack;
      }
    }

    function saveFares() {
      const fares = {
        aGo: Number(document.getElementById('fare-a-go').value) || 0,
        aBack: Number(document.getElementById('fare-a-back').value) || 0,
        bGo: Number(document.getElementById('fare-b-go').value) || 0,
        bBack: Number(document.getElementById('fare-b-back').value) || 0
      };

      localStorage.setItem('myCommuteFares', JSON.stringify(fares));
      document.getElementById('commute-settings-panel').style.display = 'none';
      updateCommuteButtonLabels();
      syncToFirebaseAndLocal();
      alert('運賃設定をクラウドに保存したぜ！');
    }

    function quickCommute(type) {
      const fares = getStoredJSON('myCommuteFares', { aGo: 220, aBack: 220, bGo: 350, bBack: 350 });
      const currentRoute = localStorage.getItem('myCurrentRoute') || 'A';
      let suicaBalance = getStoredNumber('mySuicaBalance');
      const suicaLogs = getStoredJSON('mySuicaLogs', []);
      const isConfirmEnabled = localStorage.getItem('myConfirmSetting') !== 'false';

      let amount = (currentRoute === 'A') 
        ? (type === '行き' ? fares.aGo : fares.aBack)
        : (type === '行き' ? fares.bGo : fares.bBack);

      if (amount <= 0) {
        alert('運賃が0円になってるぜ！設定から金額を入れてくれ！');
        return;
      }

      if (isConfirmEnabled) {
        const ok = confirm(`【通勤（${type}）】\nSuicaから ${amount}円 を差し引きますか？`);
        if (!ok) return;
      }

      suicaBalance -= amount;
      localStorage.setItem('mySuicaBalance', suicaBalance);

      const now = new Date();
      const dateStr = `${now.getMonth() + 1}/${now.getDate()} ${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`;
      const memo = `通勤（${type}・ルート${currentRoute}）`;

      suicaLogs.push({ direction: 'expense', amount, memo, date: dateStr });
      localStorage.setItem('mySuicaLogs', JSON.stringify(suicaLogs));

      updateDisplay();
      syncToFirebaseAndLocal();
    }

    function recordMainTransaction() {
      const direction = document.getElementById('main-direction').value;
      const account = document.getElementById('main-account').value;
      const amountInput = document.getElementById('main-amount');
      const memoInput = document.getElementById('main-memo');
      const isConfirmEnabled = localStorage.getItem('myConfirmSetting') !== 'false';

      let cashBalance = getStoredNumber('myCashBalance');
      let bankBalance = getStoredNumber('myBankBalance');
      const mainLogs = getStoredJSON('myMainLogs', []);

      const amount = Number(amountInput.value.trim());
      const memo = memoInput.value.trim() || (direction === 'income' ? '入金' : '支出');

      if (!amount || amount <= 0) {
        alert('金額を入力してください！');
        return;
      }

      if (isConfirmEnabled) {
        const actionText = direction === 'income' ? '増やし' : '減らし';
        const accountText = account === 'cash' ? '手持ち現金' : '銀行・通帳';
        const ok = confirm(`【${accountText}】\n${memo}：${amount.toLocaleString()}円 を残高から${actionText}ますか？`);
        if (!ok) return;
      }

      if (account === 'cash') {
        cashBalance = direction === 'income' ? cashBalance + amount : cashBalance - amount;
        localStorage.setItem('myCashBalance', cashBalance);
      } else {
        bankBalance = direction === 'income' ? bankBalance + amount : bankBalance - amount;
        localStorage.setItem('myBankBalance', bankBalance);
      }

      const now = new Date();
      const dateStr = `${now.getMonth() + 1}/${now.getDate()} ${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`;

      mainLogs.push({ direction, account, amount, memo, date: dateStr });
      localStorage.setItem('myMainLogs', JSON.stringify(mainLogs));

      amountInput.value = '';
      memoInput.value = '';
      updateDisplay();
      syncToFirebaseAndLocal();
    }

    function recordSuicaTransaction() {
      const direction = document.getElementById('suica-direction').value;
      const amountInput = document.getElementById('suica-amount');
      const memoInput = document.getElementById('suica-memo');
      const isConfirmEnabled = localStorage.getItem('myConfirmSetting') !== 'false';

      let suicaBalance = getStoredNumber('mySuicaBalance');
      const suicaLogs = getStoredJSON('mySuicaLogs', []);

      const amount = Number(amountInput.value.trim());
      const memo = memoInput.value.trim() || (direction === 'income' ? 'チャージ' : '利用');

      if (!amount || amount <= 0) {
        alert('金額を入力してください！');
        return;
      }

      if (isConfirmEnabled) {
        const actionText = direction === 'income' ? 'チャージ' : '支払い';
        const ok = confirm(`【Suica】\n${memo}：${amount.toLocaleString()}円 を${actionText}しますか？`);
        if (!ok) return;
      }

      suicaBalance = direction === 'income' ? suicaBalance + amount : suicaBalance - amount;
      localStorage.setItem('mySuicaBalance', suicaBalance);

      const now = new Date();
      const dateStr = `${now.getMonth() + 1}/${now.getDate()} ${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`;

      suicaLogs.push({ direction, amount, memo, date: dateStr });
      localStorage.setItem('mySuicaLogs', JSON.stringify(suicaLogs));

      amountInput.value = '';
      memoInput.value = '';
      updateDisplay();
      syncToFirebaseAndLocal();
    }

    function deleteMainLog(index) {
      if (confirm('この記録を削除して残高を元に戻しますか？')) {
        let cashBalance = getStoredNumber('myCashBalance');
        let bankBalance = getStoredNumber('myBankBalance');
        const mainLogs = getStoredJSON('myMainLogs', []);

        const item = mainLogs[index];
        const isIncome = item.direction === 'income';
        if (item.account === 'cash') {
          cashBalance = isIncome ? cashBalance - item.amount : cashBalance + item.amount;
          localStorage.setItem('myCashBalance', cashBalance);
        } else {
          bankBalance = isIncome ? bankBalance - item.amount : bankBalance + item.amount;
          localStorage.setItem('myBankBalance', bankBalance);
        }
        mainLogs.splice(index, 1);
        localStorage.setItem('myMainLogs', JSON.stringify(mainLogs));
        updateDisplay();
        syncToFirebaseAndLocal();
      }
    }

    function deleteSuicaLog(index) {
      if (confirm('このSuica記録を削除して残高を元に戻しますか？')) {
        let suicaBalance = getStoredNumber('mySuicaBalance');
        const suicaLogs = getStoredJSON('mySuicaLogs', []);

        const item = suicaLogs[index];
        const isIncome = item.direction === 'income';
        suicaBalance = isIncome ? suicaBalance - item.amount : suicaBalance + item.amount;
        localStorage.setItem('mySuicaBalance', suicaBalance);
        suicaLogs.splice(index, 1);
        localStorage.setItem('mySuicaLogs', JSON.stringify(suicaLogs));
        updateDisplay();
        syncToFirebaseAndLocal();
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      checkLockOnLoad();
      updateDisplay();
      listenToFirebase();
    });
  </script>

</body>
